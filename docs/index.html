<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Deutsch Täglich — l'allemand chaque jour</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="L'allemand un peu chaque jour. Application personnelle, sans compte ni serveur.">

<!-- La couleur de la barre du navigateur suit le thème de l'appareil. -->
<meta name="theme-color" content="#EDEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">

<!-- « Ajouter à l'écran d'accueil » : icône, nom court, plein écran. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png" sizes="180x180">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* ---------------------------------------------------------------
   TOKENS — direction « Ordnung », choisie par Exsangue le 01/08/2026
   parmi trois maquettes. Référence : l'école de design allemande —
   primaires franches, géométrie nette, grille asymétrique.

   Les composants ne lisent JAMAIS une couleur en dur : uniquement
   ces variables. C'est ce qui permet aux deux thèmes de marcher.

   ⚠️ RÈGLE À NE PAS ENFREINDRE : le rouge appartient à l'ERREUR.
   La maquette donnait un bloc rouge au mode « oral » ; c'est écarté
   ici. Sur l'accueil on navigue, dans un exercice on est corrigé —
   si les deux emploient le même rouge, le rouge ne veut plus rien
   dire. L'accueil se contente donc d'encre, de jaune, de bleu et de
   blanc. Le rouge n'apparaît qu'au moment d'une faute.
----------------------------------------------------------------*/
:root {
  --paper:      #F4F3EF;
  --surface:    #FFFFFF;
  --surface-2:  #E8E6DF;
  --ink:        #111111;
  --ink-2:      #444444;
  --ink-3:      #6E6E6A;
  --line:       #D6D3CA;
  --accent:     #1D4E89;
  --accent-ink: #FFFFFF;
  --accent-soft:rgba(29, 78, 137, .12);
  --amber:      #8A5D00;
  --amber-bg:   #F4A300;
  --amber-ink:  #111111;
  --good:       #1B7F4F;
  --good-soft:  rgba(27, 127, 79, .12);
  --bad:        #C1121F;
  --bad-soft:   rgba(193, 18, 31, .12);

  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Futura est la police du Bauhaus, et elle est présente sur iPhone —
     c'est là que l'app est vraiment utilisée. Sous Windows elle n'existe
     pas : Century Gothic prend le relais, même squelette géométrique.
     Aucun téléchargement : une police chargée depuis le web s'affiche
     d'abord en secours, et ce clignotement se voit à chaque ouverture. */
  --display: Futura, "Century Gothic", "Trebuchet MS", var(--ui);
  --de: Georgia, "Noto Serif", "Times New Roman", serif;

  /* Bauhaus : l'angle est droit. Les seuls cercles sont voulus (pastilles). */
  --edge: 0px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #121212;
    --surface:    #1D1D1D;
    --surface-2:  #262625;
    --ink:        #F2F2F0;
    --ink-2:      #B0B0AE;
    --ink-3:      #85857F;
    --line:       #33332F;
    --accent:     #5E9BDC;
    --accent-ink: #101010;
    --accent-soft:rgba(94, 155, 220, .16);
    --amber:      #F2B23C;
    --amber-bg:   #F2A81E;
    --amber-ink:  #121212;
    --good:       #3FBE84;
    --good-soft:  rgba(63, 190, 132, .16);
    --bad:        #F0705F;
    --bad-soft:   rgba(240, 112, 95, .16);
  }
}

/* Le sélecteur du viewer doit gagner dans LES DEUX sens. */
:root[data-theme="dark"] {
  --paper:#121212; --surface:#1D1D1D; --surface-2:#262625;
  --ink:#F2F2F0; --ink-2:#B0B0AE; --ink-3:#85857F; --line:#33332F;
  --accent:#5E9BDC; --accent-ink:#101010; --accent-soft:rgba(94,155,220,.16);
  --amber:#F2B23C; --amber-bg:#F2A81E; --amber-ink:#121212;
  --good:#3FBE84; --good-soft:rgba(63,190,132,.16);
  --bad:#F0705F;  --bad-soft:rgba(240,112,95,.16);
}
:root[data-theme="light"] {
  --paper:#F4F3EF; --surface:#FFFFFF; --surface-2:#E8E6DF;
  --ink:#111111; --ink-2:#444444; --ink-3:#6E6E6A; --line:#D6D3CA;
  --accent:#1D4E89; --accent-ink:#FFFFFF; --accent-soft:rgba(29,78,137,.12);
  --amber:#8A5D00; --amber-bg:#F4A300; --amber-ink:#111111;
  --good:#1B7F4F; --good-soft:rgba(27,127,79,.12);
  --bad:#C1121F;  --bad-soft:rgba(193,18,31,.12);
}

/* ---------- Les palettes de l'accueil ----------
   Réglage « la couleur des cases », demandé par Exsangue le 01/08/2026.
   Seule la teinte d'accent change : l'ambre reste l'ambre partout, parce
   qu'il ne décore pas — il signale ce qui attend (mots en retard, série en
   cours). Une couleur qui veut dire quelque chose ne se choisit pas.

   Aucune de ces teintes n'est verte ni rouge, et ce n'est pas un hasard :
   ces deux-là appartiennent au juste et au faux. */
:root[data-couleur="indigo"] { --accent:#3D3A8C; --accent-ink:#FFFFFF; --accent-soft:rgba(61,58,140,.12); }
:root[data-couleur="prune"]  { --accent:#6A4C93; --accent-ink:#FFFFFF; --accent-soft:rgba(106,76,147,.12); }
:root[data-couleur="encre"]  { --accent:#111111; --accent-ink:#F4F3EF; --accent-soft:rgba(17,17,17,.10); }

/* En sombre, l'accent doit s'éclaircir : la même teinte foncée deviendrait
   illisible sur fond noir. `:not([data-theme="light"])` évite d'écraser un
   thème clair explicitement forcé alors que le téléphone est en sombre. */
@media (prefers-color-scheme: dark) {
  :root[data-couleur="indigo"]:not([data-theme="light"]) { --accent:#8B87E0; --accent-ink:#101010; --accent-soft:rgba(139,135,224,.16); }
  :root[data-couleur="prune"]:not([data-theme="light"])  { --accent:#B08BE0; --accent-ink:#101010; --accent-soft:rgba(176,139,224,.16); }
  :root[data-couleur="encre"]:not([data-theme="light"])  { --accent:#F2F2F0; --accent-ink:#121212; --accent-soft:rgba(242,242,240,.14); }
}
:root[data-theme="dark"][data-couleur="indigo"] { --accent:#8B87E0; --accent-ink:#101010; --accent-soft:rgba(139,135,224,.16); }
:root[data-theme="dark"][data-couleur="prune"]  { --accent:#B08BE0; --accent-ink:#101010; --accent-soft:rgba(176,139,224,.16); }
:root[data-theme="dark"][data-couleur="encre"]  { --accent:#F2F2F0; --accent-ink:#121212; --accent-soft:rgba(242,242,240,.14); }

* { box-sizing: border-box; }

/* L'échelle du texte agit sur la RACINE : toute l'app étant dimensionnée en
   rem, les marges, les boutons et les traits grandissent avec les lettres.
   Agrandir le seul corps donnerait de grosses lettres dans des boutons
   restés petits — et des mots qui débordent. */
html {
  font-size: calc(100% * var(--zoom, 1));
  /* Deuxième cause du « ça bouge quand j'écris » : l'en-tête est COLLANT.
     Quand le navigateur amène le champ de réponse à l'écran, il le pose au
     ras du haut — c'est-à-dire DERRIÈRE l'en-tête, qui ne défile pas. On
     réserve donc sa hauteur : tout défilement automatique s'arrête en
     dessous, et le champ reste visible.
     La valeur suit l'en-tête : 1 rem de marge + la cible tactile de 2,75 rem
     + 0,625 rem + le trait, arrondi au-dessus. */
  scroll-padding-top: 5rem;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;

  /* Deux appuis rapides sur un bouton sont un geste normal dans une app, pas
     une demande de zoom : on désactive le double-tap zoom. Le pincement à deux
     doigts reste possible — on ne retire pas le zoom, seulement ce raccourci
     qui se déclenche par accident. */
  touch-action: manipulation;
}

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Lu par les lecteurs d'ecran, invisible a l'oeil. On ne prend NI
   `display:none` NI `visibility:hidden` : les deux retirent l'element de
   l'arbre d'accessibilite, donc de ce qui est annonce -- ce serait ecrire un
   message dans une piece vide. Le pli d'un pixel, lui, reste lisible. */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip-path: inset(50%);
  white-space: nowrap;
}

.app {
  max-width: 31rem;
  margin: 0 auto;
  padding: 1rem 1rem 4rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

/* ---------- Libellés de signalétique ---------- */
.label {
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ---------- En-tête ----------
   COLLANT depuis le 02/08/2026. Demande d'Exsangue : « je veux pouvoir lever
   les yeux et lire dans quel onglet je suis ». Un en-tête qui défile avec la
   page ne répond qu'à moitié : au milieu d'une leçon, il est déjà sorti de
   l'écran. Le rouage devient accessible partout au passage.

   La marge négative compense la marge intérieure de `.app` : sans elle, le
   fond de l'en-tête s'arrêterait 1 rem trop bas et on verrait le contenu
   défiler dans cette bande. */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  border-bottom: 3px solid var(--ink);
  padding-bottom: .625rem;
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--paper);
  padding-top: 1rem;
  margin-top: -1rem;
}
.wordmark {
  font-family: var(--display);
  font-size: 1.0625rem;
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: uppercase;
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: .4rem;
}
.wordmark small {
  font-size: .625rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
/* ---------- « Où suis-je » ----------
   Demandé par Exsangue le 02/08/2026. Le badge prend la PLACE du nom de
   l'app, il ne s'ajoute pas à côté : à 390 px de large, un titre + un badge
   + la série + le rouage ne tiennent pas sur une ligne sans que tout
   rétrécisse. Et sur un écran de leçon, « Deutsch Täglich » n'apprend rien
   qu'on ne sache déjà — alors que « L'ORAL » répond à la question posée.
   Sur l'accueil, où il n'y a pas d'ambiguïté, le nom revient.

   Les couleurs sont celles des cases de l'accueil, et c'est le point : on
   appuie sur le bloc bleu « la leçon », on obtient le bandeau bleu « LA
   LEÇON ». Le badge confirme le geste au lieu de le commenter. */
.ou {
  display: inline-block;
  font-family: var(--display);
  font-size: .8125rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .3125rem .625rem;
  border: 2px solid transparent;
}
/* Mêmes variables que les cases de l'accueil, et c'est tout l'intérêt : une
   couleur choisie à la main repeint le bloc ET son badge. Deux jeux de
   règles séparés se seraient désaccordés au premier changement. */
.ou[data-ou="lesson"]   { background: var(--c-lesson, var(--accent));    color: var(--ct-lesson, var(--accent-ink)); }
.ou[data-ou="quiz"]     { background: var(--c-quiz, var(--accent));      color: var(--ct-quiz, var(--accent-ink)); }
.ou[data-ou="cards"]    { background: var(--c-cards, var(--amber-bg));   color: var(--ct-cards, var(--amber-ink)); }
.ou[data-ou="practice"] { background: var(--c-practice, var(--amber-bg));color: var(--ct-practice, var(--amber-ink)); }
.ou[data-ou="oral"]     { background: var(--c-oral, var(--ink));         color: var(--ct-oral, var(--paper)); }
.ou[data-ou="drills"]   {
  background: var(--c-drills, var(--surface));
  color: var(--ct-drills, var(--ink));
  border-color: var(--ct-drills, var(--ink));
}
/* Le livre et les réglages ne sont pas des étapes du parcours : un aplat
   sourd les distingue des cinq modes sans inventer une sixième couleur —
   or chaque couleur de plus est une couleur de moins qui veut dire quelque
   chose. Ils restent bien lisibles, seulement plus discrets. */
.ou[data-ou="book"],
.ou[data-ou="unit"],
.ou[data-ou="booktest"],
.ou[data-ou="reglages"],
/* Le relais annonce le mode qui ARRIVE — c'est l'aplat en dessous qui porte
   sa couleur. Un badge coloré en plus dirait deux fois la même chose. */
.ou[data-ou="relais"]   { background: var(--surface-2); color: var(--ink-2); }

.streak {
  display: inline-flex;
  align-items: center;
  gap: .375rem;
  background: var(--amber-bg);
  color: var(--amber-ink);
  padding: .25rem .5rem;
  font-size: .75rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: .04em;
}
.streak[hidden] { display: none; }

/* ---------- Le bouton des réglages ----------
   En haut à droite de TOUTES les pages : l'en-tête est hors de la zone
   redessinée, donc il ne dépend d'aucun écran.

   ⚠️ C'est un DESSIN À TROIS POINTS, et non un rouage. Choisi par Exsangue le
   02/08/2026 sur une planche de douze candidats vus à taille réelle sur son
   iPhone — il trouvait le rouage « horrible », ce qui était juste : deux
   cercles et huit dents font une tache à 22 px.

   Un réglage a brièvement existé pour laisser le choix dans l'app. Il a été
   RETIRÉ à sa demande — « que ce soit fixe, qu'il n'y ait rien à changer
   ensuite ». Un réglage qui n'a servi qu'une fois est un réglage de trop :
   il coûte une ligne dans la sauvegarde, une validation, et de la place sur
   un écran qu'on ouvre pour autre chose.

   En SVG et non le caractère ⋮ : sur iPhone celui-ci s'affiche en emoji
   couleur, qui jurerait et ne suivrait pas le thème. */
.topright { display: flex; align-items: center; gap: .5rem; }
.gear {
  background: none;
  border: 0;
  padding: .25rem;
  display: inline-flex;
  color: var(--ink-2);
  /* La cible tactile fait 44 px de côté, minimum recommandé sur téléphone :
     l'icône, elle, reste petite. Un bouton visuellement discret ne doit pas
     être difficile à toucher. */
  min-width: 2.75rem;
  min-height: 2.75rem;
  align-items: center;
  justify-content: center;
  margin-right: -.25rem;
}
/* L'icône est en traits : `fill: currentColor` la remplirait et la rendrait
   illisible. C'est le `stroke` du SVG qui suit la couleur du texte. */
.gear svg { width: 1.5rem; height: 1.5rem; }
/* Aucune rotation à l'ouverture : trois points empilés tourneraient sans
   qu'on voie pourquoi. C'est la COULEUR qui porte l'état — elle marchait
   déjà, la rotation n'était qu'un bonus lié au rouage. */
.gear:hover { color: var(--accent); }
.gear.on { color: var(--accent); }

.back {
  background: none;
  border: 0;
  padding: .25rem 0;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
  align-self: flex-start;
}
.back:hover { color: var(--accent); }

/* ---------- Le chemin : le cours comme une montée ----------
   Demandé par Exsangue le 02/08/2026 : « comme sur Duolingo, des paliers, on
   avance sur un plan vertical, les prochaines leçons en bas grisées, les
   réussies en vert, en orange là où on a des fautes ».

   Pourquoi VERTICAL et non plus horizontal : la ligne d'avant tenait 35
   étapes dans un défilement latéral de 2,5 rem par étape. On y voyait sa
   position, jamais son parcours — et le titre de chaque étape n'y tenait
   pas du tout. Une colonne rend la liste lisible et laisse la place au nom.

   ⚠️ Trois couleurs, trois SENS, et il fallait trancher : le vert et le rouge
   appartiennent au juste et au faux dans le reste de l'app. Le vert convient
   donc (une étape validée EST une réussite), mais l'orange remplace le rouge
   pour « validée avec des fautes » — sinon une étape acquise porterait la
   couleur de l'erreur. */
.chemin { display: flex; flex-direction: column; }
.palier {
  position: relative;
  display: flex;
  align-items: center;
  gap: .75rem;
  background: none;
  border: 0;
  padding: .375rem 0;
  text-align: left;
  width: 100%;
  color: inherit;
}
/* Le trait qui relie un palier au suivant. Posé sur l'élément et non entre
   deux, pour qu'aucun trou n'apparaisse quand un palier change de hauteur. */
.palier::before {
  content: "";
  position: absolute;
  left: 1.09375rem;                 /* le centre de la pastille */
  top: 0; bottom: 0;
  width: 2px;
  background: var(--line);
}
.palier:first-child::before { top: 50%; }
.palier:last-child::before  { bottom: 50%; }

.palier .dot {
  position: relative;               /* au-dessus du trait */
  flex: none;
  width: 2.25rem; height: 2.25rem;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--paper);
  display: grid;
  place-items: center;
  font-size: .8125rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
}
.palier .t {
  font-size: .875rem;
  line-height: 1.25;
  color: var(--ink-3);
  min-width: 0;
}
.palier .t b { font-weight: 600; }
/* L'état, en toutes lettres à côté du titre : la couleur seule ne se lit pas
   par tout le monde, et « 3 fautes » dit ce qu'aucune teinte ne dira. */
.palier .e {
  display: block;
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  opacity: .8;
}

/* Réussie sans faute. */
.palier.net .dot { background: var(--good); border-color: var(--good); color: #fff; }
.palier.net .t   { color: var(--ink-2); }
.palier.net .e   { color: var(--good); }

/* Réussie, mais avec des fautes — on peut y revenir. */
.palier.tache .dot { background: var(--amber-bg); border-color: var(--amber-bg); color: var(--amber-ink); }
.palier.tache .t   { color: var(--ink-2); }
.palier.tache .e   { color: var(--amber); }

/* Là où l'on en est. */
.palier.ici .dot {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.palier.ici .t { color: var(--ink); }
.palier.ici .e { color: var(--accent); }

/* Pas encore ouverte. Grisée, et vraiment inerte. */
.palier.plus-tard { opacity: .45; cursor: default; }
.palier.plus-tard .dot { border-style: dashed; }

/* L'avancée, jouée UNE fois au retour au menu après avoir validé une étape.
   C'est le « effet qui nous fait avancer » demandé. Elle ne se rejoue pas au
   redessin suivant : une animation qui repart à chaque clic sur l'accueil
   deviendrait un défaut au bout de trois fois. */
.palier.franchi .dot { animation: palier-franchi .55s ease-out both; }
@keyframes palier-franchi {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.28); }
  100% { transform: scale(1); }
}

/* ---------- La plaque du jour ---------- */
.plate {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 1rem;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--edge);
  padding: 1rem;
}
/* Le cercle est la seule forme ronde de l'interface, et c'est délibéré :
   au Bauhaus le cercle, le carré et le triangle sont les trois formes
   primaires. Ici le cercle marque l'étape en cours — un point sur un
   parcours, cohérent avec les stations de la ligne de progression. */
.plate .num {
  width: 4.25rem; height: 4.25rem;
  background: var(--amber-bg);
  color: var(--amber-ink);
  border-radius: 50%;
  display: grid;
  place-items: center;
  line-height: 1;
}
.plate .num b {
  font-family: var(--display);
  font-size: 2.125rem;
  font-weight: 600;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}
.plate h2 {
  font-family: var(--display);
  margin: .25rem 0 0;
  font-size: 1.375rem;
  font-weight: 600;
  letter-spacing: 0;
  text-wrap: balance;
}
.plate .de {
  font-family: var(--de);
  font-style: italic;
  color: var(--ink-2);
  font-size: .9375rem;
  margin: .125rem 0 0;
}

/* ---------- Barres d'action ---------- */
.modes { display: flex; flex-direction: column; gap: .5rem; }
.mode {
  display: flex;
  align-items: center;
  gap: .875rem;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--ink);
  border-radius: var(--edge);
  padding: .875rem 1rem;
  transition: background .12s ease, border-color .12s ease;
}
.mode:hover:not(:disabled) { background: var(--surface-2); border-left-color: var(--accent); }
.mode:disabled { opacity: .45; cursor: not-allowed; }
.mode .txt { flex: 1; min-width: 0; }
.mode .txt strong {
  display: block;
  font-family: var(--display);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0;
}

/* ---------- L'accueil : cinq blocs, pas cinq lignes ----------
   Le défaut que cette grille corrige : les cinq modes étaient cinq rectangles
   interchangeables, et rien ne distinguait « la leçon » (on lit) de « l'oral »
   (on écoute). Ici chaque activité a sa couleur et sa taille.

   La taille encode la charge : « les cartes » occupe deux rangées parce que
   c'est le mode quotidien, celui qui porte le nombre de mots en attente.
   « La leçon » ouvre, « le quiz » ferme — tous deux pleine largeur, parce
   qu'ils sont les deux bouts du parcours.

   Le placement passe par data-go et JAMAIS par :nth-child : le deuxième
   bouton bascule entre `cards` et `practice` selon qu'il reste des mots à
   réviser, et un mode peut être absent. Une grille positionnelle se
   décalerait silencieusement. */
.modes-home {
  display: grid;
  gap: .5rem;
  grid-template-columns: 1fr 1fr;
}

/* La disposition en RECTANGLES : « la leçon » ouvre et « le quiz » ferme,
   tous deux pleine largeur ; « les cartes » tient deux rangées, parce que
   c'est le mode quotidien. Ici la taille encode la charge. */
.modes-home.carre {
  grid-template-areas:
    "lecon  lecon"
    "cartes oral"
    "cartes exos"
    "quiz   quiz";
}
/* Les emplacements suivent la POSITION, pas l'identité du mode : c'est ce qui
   permet de réordonner les cases depuis les réglages. La 1re case ouvre en
   pleine largeur, la 2e occupe la grande colonne de gauche, la 5e ferme en
   pleine largeur. Lier l'emplacement à `data-go` rendait l'ordre décoratif —
   on aurait réordonné le HTML sans que rien ne bouge à l'écran. */
.modes-home.carre .mode[data-pos="1"] { grid-area: lecon; }
.modes-home.carre .mode[data-pos="2"] { grid-area: cartes; }
.modes-home.carre .mode[data-pos="3"] { grid-area: oral; }
.modes-home.carre .mode[data-pos="4"] { grid-area: exos; }
.modes-home.carre .mode[data-pos="5"] { grid-area: quiz; }

/* La taille des cases. Elle n'agit que sur la hauteur minimale et les marges
   intérieures : le texte, lui, a son propre réglage. */
.modes-home.t-compacte .mode { min-height: 3.25rem; padding: .5rem .75rem; }
.modes-home.t-normale  .mode { min-height: 4.25rem; }
.modes-home.t-grande   .mode { min-height: 5.75rem; padding: 1rem; }
.modes-home.rond.t-compacte .mode,
.modes-home.rond.t-normale  .mode,
.modes-home.rond.t-grande   .mode { min-height: 0; }
.modes-home .mode {
  border: 0;
  border-left: 0;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: .375rem;
  min-height: 4.25rem;
  padding: .75rem .875rem;
}
.modes-home .mode:hover:not(:disabled) { filter: brightness(1.06); background: inherit; }
.modes-home .mode .txt { flex: initial; }
.modes-home .mode .txt span { color: inherit; opacity: .8; }

/* Le bleu encadre le parcours : « la leçon » l'ouvre, « le quiz » le ferme.
   Ce n'est pas une répétition par manque d'idée — ce sont les deux bouts du
   même chemin, et les deux seuls blocs pleine largeur.

   Aucune règle propre au thème sombre ici, et c'est voulu : les jetons
   s'inversent déjà. En sombre `--ink` devient presque blanc et `--paper`
   presque noir, donc le bloc encre de « l'oral » devient un aplat CLAIR sur
   fond sombre. C'est la vraie inversion d'un aplat noir sur fond clair, et
   elle garde le contraste franc du Bauhaus. Une première version forçait ce
   bloc en gris (`--surface-2`) : il redevenait un rectangle indistinct,
   c'est-à-dire précisément le défaut que cette grille corrige. */
/* Les couleurs sont COMMUNES aux deux formes : seule la disposition change.
   Les mêler à la grille obligerait à tout redéclarer pour les cercles, et
   les deux jeux finiraient par diverger. */
/* Chaque case lit d'abord SA variable, puis retombe sur le jeton du thème.
   C'est ce repli qui permet aux deux réglages de cohabiter : tant
   qu'Exsangue n'a pas choisi de couleur, `--c-lesson` n'existe pas et la
   case suit la palette (bauhaus / indigo / prune / encre). Dès qu'il en
   choisit une, elle gagne — pour cette case-là seulement.
   `--ct-…` est l'encre CALCULÉE à partir de la teinte : c'est elle qui
   garantit que le nom de la case reste lisible sur n'importe quel fond. */
.modes-home .mode[data-go="lesson"]   { background: var(--c-lesson, var(--accent));    color: var(--ct-lesson, var(--accent-ink)); }
.modes-home .mode[data-go="cards"]    { background: var(--c-cards, var(--amber-bg));   color: var(--ct-cards, var(--amber-ink)); }
.modes-home .mode[data-go="practice"] { background: var(--c-practice, var(--amber-bg));color: var(--ct-practice, var(--amber-ink)); }
.modes-home .mode[data-go="oral"]     { background: var(--c-oral, var(--ink));         color: var(--ct-oral, var(--paper)); }
.modes-home .mode[data-go="quiz"]     { background: var(--c-quiz, var(--accent));      color: var(--ct-quiz, var(--accent-ink)); }
/* Les exercices gardent leur trait : leur case est claire par défaut, et
   sans bordure elle se confondrait avec le fond. Le trait prend la couleur
   du TEXTE plutôt que l'encre du thème — sinon une teinte sombre choisie à
   la main lui donnerait un contour noir invisible. */
.modes-home .mode[data-go="drills"] {
  background: var(--c-drills, var(--surface));
  color: var(--ct-drills, var(--ink));
  border: 2px solid var(--ct-drills, var(--ink));
}

/* ---------- La disposition en CERCLES ----------
   Le cercle est l'une des trois formes primaires du Bauhaus, avec le carré
   et le triangle : la demande est donc dans l'esprit de la direction.

   Deux choses se perdent en passant au rond, et c'est assumé :
     - le SOUS-TITRE (« 8 tirés parmi 28 ») ne tient pas dans un disque sans
       casser les mots n'importe où. Il est retiré, pas rétréci — du texte
       illisible ne vaut pas mieux que pas de texte.
     - la TAILLE ne dit plus la charge. Cinq disques inégaux à cette échelle
       se lisent mal ; le compte, lui, reste affiché sur chacun.
   C'est le prix du cercle, et c'est pourquoi les deux formes coexistent. */
.modes-home.rond { gap: .625rem; }
.modes-home.rond .mode {
  aspect-ratio: 1;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: .25rem;
  padding: 1rem .75rem;
  min-height: 0;
}
.modes-home.rond .mode .txt span { display: none; }
.modes-home.rond .mode .txt strong { font-size: .9375rem; }
/* Le quiz ferme le parcours : seul sur sa rangée, centré, comme un point
   d'arrivée. Un cinquième disque collé à gauche donnerait une grille bancale. */
.modes-home.rond .mode[data-go="quiz"] {
  grid-column: 1 / -1;
  justify-self: center;
  width: calc(50% - .3125rem);
}

/* La pastille est CERCLÉE de la couleur du texte, jamais remplie d'une teinte
   fixe. `currentColor` la rend lisible sur n'importe quel fond et dans les
   deux thèmes sans une seule règle en plus — une version précédente posait du
   blanc à 20 %, qui disparaissait dès que le bloc devenait clair en sombre. */
.modes-home .chip {
  background: none;
  color: inherit;
  border: 2px solid currentColor;
}
/* Seule exception : le compte de mots en retard, qui doit sauter aux yeux.
   Les deux couleurs sont sûres dans les deux thèmes — le bloc « cartes » est
   ambre au clair comme au sombre, et son texte y est toujours quasi noir. */
.modes-home .mode[data-go="cards"] .chip.hot {
  background: var(--amber-ink);
  color: var(--amber-bg);
  border-color: var(--amber-ink);
}
.mode .txt span {
  display: block;
  font-size: .8125rem;
  color: var(--ink-3);
}
.chip {
  flex: 0 0 auto;
  min-width: 1.75rem;
  padding: .1875rem .4375rem;
  text-align: center;
  font-size: .75rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  border-radius: var(--edge);
  background: var(--surface-2);
  color: var(--ink-2);
}
.chip.hot  { background: var(--amber-bg); color: var(--amber-ink); }
.chip.ok   { background: var(--good-soft); color: var(--good); }

/* ---------- Blocs de contenu ---------- */
/* Le trait est FRANC, et c'est une nécessité, pas un goût. Le fond « Ordnung »
   (#F4F3EF) est bien plus clair que le gris qu'il remplace : un panneau blanc
   posé dessus avec un liseré gris clair ne se détachait plus du tout. Le
   Bauhaus dessine ses limites — on les dessine donc pour de bon. */
.card {
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--edge);
  padding: 1rem;
}
.stack { display: flex; flex-direction: column; gap: 1rem; }
.stack-s { display: flex; flex-direction: column; gap: .5rem; }

h3.sec {
  margin: 0;
  font-size: .6875rem;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  border-bottom: 1px solid var(--line);
  padding-bottom: .375rem;
}

/* ---------- Une étape de leçon ---------- */
.step-idea {
  margin: 0;
  font-size: 1.1875rem;
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -.015em;
  text-wrap: balance;
}
.step-detail {
  margin: .625rem 0 0;
  font-size: .9375rem;
  color: var(--ink-2);
}
.step-detail b { color: var(--ink); font-family: var(--de); font-weight: 600; }

/* Le mot à mot : chaque mot allemand au-dessus de sa traduction */
.gloss {
  display: flex;
  flex-wrap: wrap;
  gap: .625rem .875rem;
  background: var(--surface-2);
  border-radius: var(--edge);
  padding: .75rem;
  margin-top: .875rem;
}
.gloss > span { display: flex; flex-direction: column; gap: .0625rem; }
.gloss b { font-family: var(--de); font-size: 1.0625rem; font-weight: 600; line-height: 1.2; }
.gloss i { font-style: normal; font-size: .75rem; color: var(--ink-3); line-height: 1.2; }
.gloss-say { display: flex; align-items: center; margin-top: .875rem; gap: .5rem; }
.gloss-say .t { font-size: .75rem; color: var(--ink-3); }

/* Tableau de conjugaison */
.conj {
  width: 100%;
  border-collapse: collapse;
  font-size: .9375rem;
  margin-top: .875rem;
}
.conj td { padding: .3125rem .5rem .3125rem 0; border-bottom: 1px solid var(--line); }
.conj td:first-child { color: var(--ink-3); width: 7.5rem; }
.conj td:last-child { font-family: var(--de); font-weight: 600; }
.scroll-x { overflow-x: auto; }

/* Bouton écouter — masqué tant qu'aucune voix allemande n'est disponible */
.say {
  display: none;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 1.75rem; height: 1.75rem;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--edge);
  background: var(--surface);
  color: var(--ink-3);
  font-size: .625rem;
  line-height: 1;
}
body.has-tts .say { display: inline-flex; }
.say:hover { color: var(--accent); border-color: var(--accent); }

/* Exemples : l'allemand en serif, le français en dessous */
.ex { border-left: 3px solid var(--accent); padding-left: .75rem; }
.ex + .ex { margin-top: .875rem; }
.ex .top-line { display: flex; align-items: center; gap: .5rem; }
.ex .d { font-family: var(--de); font-size: 1.0625rem; line-height: 1.4; flex: 1; }
.ex .f { font-size: .875rem; color: var(--ink-3); margin-top: .125rem; }

/* Liste de vocabulaire */
.voc { list-style: none; margin: .25rem 0 0; padding: 0; display: flex; flex-direction: column; }
.voc li {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: .5rem 0;
  border-bottom: 1px solid var(--line);
}
.voc li:last-child { border-bottom: 0; }
.voc .w { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.voc .d { font-family: var(--de); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.voc .p { font-size: .6875rem; color: var(--ink-3); letter-spacing: .02em; }
.voc .f { font-size: .875rem; color: var(--ink-3); text-align: right; max-width: 45%; }

/* ---------- Flashcards ---------- */
.flash {
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--edge);
  min-height: 14rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: 1.5rem 1rem;
  text-align: center;
  width: 100%;
}
.flash .front { font-family: var(--de); font-size: 1.75rem; font-weight: 600; line-height: 1.25; }
.flash .p     { font-size: .8125rem; color: var(--ink-3); letter-spacing: .02em; }
.flash .trad  { font-size: 1.125rem; color: var(--accent); font-weight: 700; margin-top: .5rem; }
/* La consigne précise n'est plus en gris pâle et minuscule : c'est elle
   qu'Exsangue disait ne pas voir. Elle reste petite — le filigrane porte le
   coup d'œil — mais elle se lit. */
.flash .tip   { font-size: .8125rem; color: var(--ink-2); font-weight: 600; }
.flash .ask   { font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
.flash .sol   { font-family: var(--de); font-size: 1.625rem; font-weight: 600; color: var(--accent); }

/* ---------- La carte qui se retourne ----------
   Demandé par Exsangue le 02/08/2026 : « je veux que ce soient de vraies
   cartes, avec une animation où ça se retourne ».

   Les DEUX faces sont dans le HTML en même temps — c'est la condition même
   d'un retournement : on ne peut pas animer un remplacement. Elles sont
   empilées dans UNE case de grille plutôt que posées en absolu, pour que la
   hauteur suive spontanément la plus haute des deux. En absolu, il aurait
   fallu figer une hauteur et la face la plus longue aurait débordé.

   ⚠️ Le champ de saisie et les boutons restent DEHORS. À l'intérieur, ils
   partiraient à l'envers avec la face — un champ inversé ne se remplit pas. */
/* ⚠️ LA CARTE EST ÉTROITE, PAS HAUTE. C'est la correction du 02/08/2026,
   après un premier essai raté.

   Exsangue voulait « une vraie carte » — donc un format portrait. J'ai
   d'abord allongé la carte, et il l'a essayée sur son iPhone : « ça n'a rien
   changé, et quand je veux écrire la carte n'est plus centrée, parfois je ne
   vois plus ce qui est écrit dessus ».

   Le conflit est réel et il fallait le nommer : une carte HAUTE et le champ
   de saisie ne tiennent pas ensemble à l'écran quand le clavier prend la
   moitié de la place. Il a tranché — voir les deux en même temps compte plus
   que la forme.

   D'où le changement de levier : on obtient le portrait en RÉTRÉCISSANT la
   largeur, ce qui ne coûte aucune hauteur. 17 rem de large pour ~20 de haut,
   soit à peu près les proportions d'une carte à jouer. */
.carte3d {
  perspective: 1200px;
  width: min(100%, 17rem);
  /* Les proportions d'une carte à jouer. C'est ce qui l'empêche de devenir
     démesurée quand il y a de la place — signalé par Exsangue : « la carte
     est beaucoup trop grande ». Sans ce rapport, elle prenait toute la
     hauteur de l'écran dès que le clavier était fermé. */
  aspect-ratio: 5 / 7;
  margin: 0 auto;
}
.carte-i {
  display: grid;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.2, .7, .3, 1);
}
.carte-i.retourne { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  /* ⚠️ LA HAUTEUR EST CALCULÉE POUR QUE TOUT TIENNE SANS DÉFILEMENT.

     C'est LE point, et il a fallu deux essais pour le comprendre. Exsangue,
     après avoir essayé sur son iPhone : « quand je veux écrire, la carte
     n'est plus centrée, parfois je ne vois plus ce qui est écrit dessus. Je
     veux voir le mot de la carte ET ce que j'écris, à chaque nouvelle carte ».

     Tant que la page peut défiler, elle défilera : le navigateur amène le
     champ à l'écran et pousse la carte dehors. Aucun réglage de focus ne
     corrige ça — il fallait supprimer le défilement lui-même.

     D'où une hauteur qui prend CE QUI RESTE : la hauteur visible moins tout
     ce qui accompagne la carte (en-tête collant, ligne d'état, champ,
     boutons, marges) ≈ 20 rem. Bornée entre 8 et 21 rem pour qu'elle ne
     devienne ni ridicule ni envahissante.

     `dvh` et non `vh` : `dvh` est la hauteur RÉELLEMENT visible, clavier
     déduit. `vh` l'ignore, et c'est pourquoi le premier essai n'a rien
     changé. Isolé dans un `@supports` : sans `dvh`, toute la déclaration
     serait invalide et la carte n'aurait plus aucune hauteur. */
  min-height: 17rem;
  padding: 1.25rem 1rem 2.5rem;
}
/* ⚠️ REMPLACÉ UNE ESTIMATION PAR UNE GARANTIE — 02/08/2026, après une photo
   d'Exsangue : la page avait défilé pour amener le champ à l'écran, et le
   haut de la carte, donc LE MOT, était sorti par le haut.

   La version précédente calculait « la hauteur visible moins 20 rem de
   voisinage ». Ce 20 rem était une estimation de l'en-tête, de la ligne
   d'état, du champ, des boutons et des marges. Une estimation fausse d'un
   rem et la page redéfile — et je n'ai aucun moyen de la vérifier, faute de
   clavier dans un navigateur sans fenêtre.

   Désormais l'écran des cartes fait exactement la hauteur visible, et la
   carte prend CE QUI RESTE, quel qu'il soit. Plus rien à estimer : c'est la
   mise en page qui mesure, et elle ne se trompe pas. */
@supports (height: 1dvh) {
  /* ⚠️ `--vv` D'ABORD, `100dvh` seulement en secours — et c'est LA correction
     du 02/08/2026, après deux tentatives ratées que je dois nommer :

     `dvh` suit les BARRES DU NAVIGATEUR, pas le clavier. Sur iPhone, le
     clavier se pose PAR-DESSUS la page sans réduire la fenêtre de mise en
     page : `100dvh` ne bouge pas d'un pixel quand il monte. C'est pourquoi
     les deux essais précédents n'ont rien changé, et pourquoi Exsangue a dû
     me le dire deux fois.

     La seule mesure qui voit le clavier est `visualViewport`. Elle n'existe
     qu'en JavaScript, d'où la variable posée par `suitLeClavier()`. */
  body.plein .app { height: var(--vv, 100dvh); padding-bottom: 1.25rem; }
  body.plein #view { flex: 1 1 auto; min-height: 0; }
  body.plein #view > .stack { height: 100%; }
  /* `flex: 1 1 0` et non `auto` : la carte doit partir de zéro et prendre le
     reste, sans que sa hauteur propre entre dans le calcul.
     `max-height` la borne aux proportions d'une carte à jouer — 17 rem de
     large × 7/5. Au-delà, elle ne grandit plus, elle laisse la place. */
  body.plein .carte3d { flex: 1 1 0; min-height: 5rem; max-height: 23.8rem; }
  /* ⚠️ Le maillon qu'on oublie : `.carte-i` est la grille qui porte les deux
     faces. Sans hauteur propre, elle reste à la taille de son contenu, et le
     `height: 100%` des faces se mesure alors sur RIEN. Vu sur une capture :
     le bloc prenait bien la place, mais la carte restait petite au milieu
     d'un grand vide. */
  body.plein .carte-i { height: 100%; }
  body.plein .face { height: 100%; min-height: 0; }
}
.face {
  text-align: center;
  border: 2px solid var(--ink);
  border-radius: var(--edge);

  /* Le fond du THÈME. Un aplat teinté plus un disque, dessinés en
     `background-image` et non en pseudo-élément : le filigrane de consigne
     occupe déjà `::before`, et empiler deux pseudo-éléments obligerait à
     ranger tout le contenu au-dessus par des `z-index` — trois règles de
     plus pour le même résultat.

     La teinte est en ALPHA FAIBLE sur la surface : au-dessus du blanc elle
     donne un pastel, au-dessus du gris sombre une nuance profonde. Une seule
     couleur par thème suffit donc pour les deux thèmes de l'app. */
  background-color: var(--surface);
  /* Le disque est en HAUT à droite, pas en bas : le filigrane de consigne
     occupe le bas de la carte, et les deux se percutaient — vu sur une
     capture. En haut, chacun a son coin. */
  background-image:
    radial-gradient(circle at 92% 12%, rgba(var(--th), .22) 0 3.75rem, transparent 3.75rem),
    linear-gradient(rgba(var(--th), .10), rgba(var(--th), .10));
}
.face.arriere { transform: rotateY(180deg); }

/* Le filigrane est plus petit SUR UNE CARTE que dans les exercices : la
   carte ne fait plus que 17 rem de large depuis qu'elle est passée en
   portrait, et « EN FRANÇAIS » à 2,25 rem venait toucher ses deux bords. */
.face[data-consigne]::before { font-size: 1.75rem; }

/* Les teintes. Aucune n'est verte ni rouge : ces deux-là disent le juste et
   le faux, et une carte ne doit pas avoir l'air de répondre à sa place. */
.carte3d[data-th="monde"]     { --th: 29, 78, 137; }
.carte3d[data-th="gens"]      { --th: 244, 163, 0; }
.carte3d[data-th="mots"]      { --th: 110, 110, 106; }
.carte3d[data-th="nombres"]   { --th: 61, 58, 140; }
.carte3d[data-th="verbes"]    { --th: 106, 76, 147; }
.carte3d[data-th="couleurs"]  { --th: 0, 120, 140; }
.carte3d[data-th="nature"]    { --th: 138, 93, 0; }
.carte3d[data-th="quotidien"] { --th: 90, 80, 110; }
.carte3d[data-th="table"]     { --th: 176, 98, 20; }
.carte3d[data-th="voyage"]    { --th: 40, 110, 120; }
/* Ajoutés le 02/08/2026 en rangeant les 350 mots un par un : « le temps qui
   passe » se distinguait mal des nombres, et les objets de la maison
   n'avaient aucun thème du tout. */
.carte3d[data-th="temps"]     { --th: 128, 92, 140; }
.carte3d[data-th="maison"]    { --th: 120, 110, 85; }

/* Le contenu des faces reprend l'habillage des anciennes boîtes : il n'y a
   aucune raison qu'un mot s'affiche autrement selon qu'il est sur une carte
   ou dans un exercice. */
.face .front { font-family: var(--de); font-size: 1.75rem; font-weight: 600; line-height: 1.25; }
.face .ask   { font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
.face .sol   { font-family: var(--de); font-size: 1.625rem; font-weight: 600; color: var(--accent); }
.face .p     { font-size: .8125rem; color: var(--ink-3); letter-spacing: .02em; }
.face .trad  { font-size: 1.125rem; color: var(--accent); font-weight: 700; margin-top: .5rem; }
.face .tip   { font-size: .8125rem; color: var(--ink-2); font-weight: 600; }

/* ---------- Les verbes irréguliers ---------- */
.verbe-i {
  font-family: var(--de);
  font-size: 1.875rem;
  font-weight: 600;
  text-align: center;
  padding-top: .5rem;
}
.verbe-f {
  text-align: center;
  font-size: .9375rem;
  color: var(--ink-3);
  padding-bottom: .5rem;
}
/* Une ligne par pronom, le pronom aligné à gauche en colonne fixe : c'est
   une conjugaison, elle doit se lire en colonne comme dans un manuel. */
.conj-q {
  display: grid;
  grid-template-columns: 6.5rem 1fr;
  align-items: center;
  gap: .625rem;
}
.conj-q label {
  font-size: .8125rem;
  font-weight: 700;
  color: var(--ink-2);
}
.conj-q .answer { margin: 0; }

.conj { display: flex; flex-direction: column; gap: .25rem; }
.conj-l {
  display: grid;
  grid-template-columns: 6.5rem 1fr;
  gap: .625rem;
  padding: .375rem .5rem;
  background: var(--surface);
  border-left: 4px solid var(--line);
}
.conj-p { font-size: .8125rem; color: var(--ink-3); }
.conj-l b { font-family: var(--de); font-size: 1rem; }
.conj-l.ok    { border-left-color: var(--good); }
.conj-l.ko    { border-left-color: var(--bad); }
/* Les formes qu'on n'a PAS demandées restent neutres : les marquer en vert
   féliciterait pour une réponse jamais donnée. */
.conj-l.calme { opacity: .6; }
.conj-t {
  grid-column: 2;
  font-size: .75rem;
  color: var(--bad);
}

/* ---------- Le contre-la-montre ----------
   Trois chiffres sur une ligne : le temps, les trouvés, le combo. Le temps
   est le plus gros parce que c'est lui qu'on surveille — dans un jeu de
   vitesse, le score se lit à la fin, le temps se lit pendant. */
.chrono-tete {
  display: grid;
  grid-template-columns: auto 1fr 1fr;
  align-items: baseline;
  gap: .75rem;
  border-bottom: 3px solid var(--ink);
  padding-bottom: .5rem;
}
.chrono-t {
  font-family: var(--display);
  font-size: 2.75rem;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;   /* sans quoi les chiffres dansent */
}
.chrono-s, .chrono-c {
  display: flex;
  flex-direction: column;
  font-size: .625rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.chrono-s b, .chrono-c b {
  font-family: var(--display);
  font-size: 1.375rem;
  letter-spacing: 0;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
/* Le combo devient ambre quand il rapporte du temps. L'ambre signale ce qui
   attend ou ce qui compte — c'est exactement son rôle ici. */
.chrono-c.chaud b { color: var(--amber); }
.chrono-c.chaud   { color: var(--amber); }

.chrono-gain {
  align-self: center;
  background: var(--amber-bg);
  color: var(--amber-ink);
  font-family: var(--display);
  font-weight: 700;
  letter-spacing: .06em;
  padding: .125rem .625rem;
}
.chrono-mot {
  font-family: var(--de);
  font-size: 2rem;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  padding: 1.5rem 0;
}

/* Le classement. Le premier est détaché : un record qui ressemble aux autres
   n'est plus un record. */
.recs { display: flex; flex-direction: column; gap: .25rem; }
.rec {
  display: flex;
  align-items: baseline;
  gap: .625rem;
  padding: .375rem .5rem;
  background: var(--surface);
  border: 2px solid var(--line);
}
.rec.top { border-color: var(--amber-bg); }
.rec-n {
  font-family: var(--display);
  font-weight: 700;
  color: var(--ink-3);
  min-width: 1rem;
  font-variant-numeric: tabular-nums;
}
.rec b { font-size: .9375rem; }
.rec-d { margin-left: auto; font-size: .75rem; color: var(--ink-3); }

/* ---------- Le filigrane de consigne ----------
   Demandé par Exsangue le 02/08/2026 : « quand on va vite parce qu'on
   connaît, on se trompe — on ne voit pas d'un regard ce qu'on doit faire ».

   Deux décisions, et la raison de chacune :

   1. Le filigrane est DANS LA BOÎTE, jamais derrière le champ de saisie.
      Écrire par-dessus un texte, même pâle, gêne la relecture de ce qu'on
      tape : ce serait échanger un défaut de lisibilité contre un autre.
      La boîte, elle, a de la place perdue — `min-height: 14rem` pour un mot.
   2. Le filigrane porte un VERBE court (« TRADUIS », « COMPLÈTE », « EN
      ALLEMAND »), pas la consigne entière. Un filigrane qu'il faut lire
      n'est plus un coup d'œil. La phrase exacte reste affichée en clair
      juste en dessous, pour le cas où le verbe ne suffit pas.

   `attr()` : le texte vient du HTML. Une seule règle CSS sert donc les
   cartes, l'oral et les exercices, et le filigrane ne peut pas se
   désaccorder de la consigne qu'il résume. */
[data-consigne] { position: relative; overflow: hidden; }
/* On RÉSERVE la place du filigrane au lieu de le laisser passer derrière le
   texte. Sans ça, une boîte courte — un exercice d'une seule ligne — verrait
   sa dernière ligne traversée par le filigrane. Pâle ou pas, deux textes
   superposés se lisent mal, et c'est exactement le défaut qu'on corrige. */
.flash[data-consigne] { padding-bottom: 3rem; }
.card[data-consigne]  { padding-bottom: 2.5rem; }
[data-consigne]::before {
  content: attr(data-consigne);
  position: absolute;
  left: 0; right: 0;
  /* Posé DANS la boîte, pas mordant sur son bord. Une première version le
     débordait vers le bas (`bottom: -.375rem`) : avec `overflow: hidden`,
     le résultat ne se lisait pas comme un débord voulu mais comme un texte
     coupé — vu sur une capture, pas par un test. */
  bottom: .5rem;
  font-family: var(--display);
  font-size: 2.25rem;
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1;
  text-transform: uppercase;
  text-align: center;
  color: var(--ink);
  opacity: .11;
  pointer-events: none;
  white-space: nowrap;
}
/* Sur fond sombre, l'encre est déjà claire : la même opacité donnerait un
   gris sale. Un filigrane un peu plus present compense la perte de contraste
   d'un texte clair sur fond noir. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-consigne]::before { opacity: .16; }
}
:root[data-theme="dark"] [data-consigne]::before { opacity: .16; }

/* Saisie de la réponse, à partir du niveau 3.
   Sur iPhone, la correction automatique remplacerait les mots allemands par
   des mots français : elle est coupée, ainsi que la majuscule automatique.
   La comparaison ignore la casse, donc rien n'est perdu. */
.answer {
  width: 100%;
  box-sizing: border-box;
  font-family: var(--de);
  font-size: 1.375rem;
  font-weight: 600;
  text-align: center;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--edge);
  padding: .875rem .75rem;
}
/* ⚠️ L'INDICATEUR DE FOCUS NE SE RETIRE PAS — signale par le mentor (§4).
   La regle disait `outline: none`, et comme elle est plus specifique que le
   `:focus-visible` general d'en haut, elle gagnait : le champ PRINCIPAL de
   l'app -- celui ou l'on tape toutes les reponses -- n'avait plus aucun
   reperage au clavier. Un changement de couleur de bordure ne suffit pas :
   WCAG 2.4.7 demande un indicateur visible, et une bordure qui change de
   teinte sans changer d'epaisseur passe inapercue des qu'on regarde ailleurs.
   La bordure d'accent reste -- elle est jolie et elle aide -- mais elle
   s'ajoute au trait, elle ne le remplace plus. */
.answer:focus { border-color: var(--accent); }
.answer:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Remettre les mots dans l'ordre : les étiquettes qu'on assemble.
   La zone du haut est la phrase en construction, celle du bas la réserve. */
.build {
  min-height: 3.25rem;
  display: flex; flex-wrap: wrap; gap: .375rem; align-items: flex-start;
  padding: .625rem;
  border: 2px dashed var(--line);
  border-radius: var(--edge);
  background: var(--surface);
}
.build:empty::after {
  content: "Touche les mots dans le bon ordre";
  color: var(--ink-3); font-size: .8125rem;
}
.chips { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: .75rem; }
.chip-w {
  font-family: var(--de); font-size: 1rem; font-weight: 600;
  padding: .5rem .75rem;
  border: 1px solid var(--line);
  border-radius: .375rem;
  background: var(--surface);
  color: var(--ink);
}
.chip-w:hover { border-color: var(--accent); color: var(--accent); }
.build .chip-w { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Les chapitres de l'accueil sont repliables, comme les groupes du livre :
   ils partagent la classe .grp. Ici, la ligne de pastilles a juste besoin
   d'un peu d'air sous le titre. */
.grp .line { padding-bottom: .5rem; }
/* Le sommaire complet, replié sous une seule ligne. Ses chapitres sont
   imbriqués : on les décale un peu et on leur retire les traits, sinon
   l'empilement de bordures fait sale. */
.grp.tout { border-bottom: 1px solid var(--line); }
.grp.tout .grp { border: 0; padding-left: .75rem; }
.grp.tout .grp > summary { padding: .5rem .125rem; }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--edge);
  padding: .8125rem .75rem;
  font-weight: 800;
  font-size: .9375rem;
  transition: background .12s ease;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.miss { border-color: var(--bad); color: var(--bad); }
.btn.miss:hover { background: var(--bad-soft); }
.btn.hit  { border-color: var(--good); color: var(--good); }
.btn.hit:hover { background: var(--good-soft); }
.btn.wide { width: 100%; }

/* ---------- Questions (quiz et mini-questions d'étape) ---------- */
.q { font-size: 1.0625rem; font-weight: 700; margin: 0; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: .5rem; }
.opt {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--edge);
  padding: .75rem .875rem;
  font-size: .9375rem;
  transition: background .12s ease;
}
.opt:hover:not(:disabled) { background: var(--surface-2); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); font-weight: 700; }
.opt.wrong { border-color: var(--bad);  background: var(--bad-soft); }
/* ---------- Les réglages : rangées de choix ----------
   Des boutons et non un <select> : sur iPhone un menu déroulant ouvre un
   sélecteur plein écran, alors qu'ici on veut voir toutes les possibilités
   ET l'effet du choix sans quitter la page. */
.seg { display: flex; flex-wrap: wrap; gap: .375rem; }
.segb {
  flex: 1 1 auto;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--edge);
  padding: .5rem .625rem;
  font-size: .8125rem;
  font-weight: 600;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .375rem;
}
.segb:hover:not(.on) { border-color: var(--ink-3); }
/* Le choix retenu ne se distingue PAS par la seule couleur : il prend aussi
   le trait épais et le texte gras. Une différence uniquement colorée
   disparaît pour qui distingue mal les teintes. */
.segb.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 800;
}
.pas {
  width: .875rem; height: .875rem;
  border-radius: 50%;
  border: 2px solid var(--ink);
  display: inline-block;
  flex: 0 0 auto;
}
/* La rangée des couleurs ne prend PAS le fond d'accent quand elle est
   retenue : la pastille « Bauhaus » est justement de cette couleur, elle
   disparaissait dans le bouton. Le choix se marque donc par un trait épais
   et le gras — ce qui reste lisible sans dépendre de la couleur, comme
   partout ailleurs dans cet écran. */
.segb.pastille.on {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--ink);
  border-width: 3px;
}
/* ---------- Réordonner les cases ----------
   Des flèches et non un glisser-déposer : le glisser est pénible au doigt sur
   une liste courte, impossible au clavier, et demanderait du code qu'on
   n'aurait aucun moyen de tester ici. Deux boutons font le même travail. */
.ordre { display: flex; flex-direction: column; gap: .375rem; }
.ordre-l {
  display: flex; align-items: center; gap: .5rem;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--edge);
  padding: .375rem .5rem;
}
.ordre-l b { flex: 1; font-size: .875rem; font-weight: 600; }
.ordre-n {
  flex: 0 0 auto;
  width: 1.5rem; height: 1.5rem;
  display: grid; place-items: center;
  background: var(--ink); color: var(--paper);
  border-radius: 50%;
  font-size: .75rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.ordre-b {
  flex: 0 0 auto;
  min-width: 2.25rem; min-height: 2.25rem;
  background: none;
  border: 2px solid var(--line);
  border-radius: var(--edge);
  color: var(--ink);
  font-size: .875rem;
}
.ordre-b:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.ordre-b:disabled { opacity: .3; cursor: not-allowed; }

/* ---------- Le relais entre deux phases ----------
   Un aplat pleine largeur aux couleurs du mode qui arrive. Il reprend les
   MÊMES variables que les cases de l'accueil et que le badge d'en-tête :
   une couleur choisie à la main repeint les trois. Trois jeux de règles
   séparés se seraient désaccordés au premier changement. */
.relais {
  display: flex;
  flex-direction: column;
  gap: .5rem;
  padding: 2.5rem 1.25rem;
  text-align: center;
  animation: relais-entre .32s ease-out both;
}
.relais strong {
  font-family: var(--display);
  font-size: 1.875rem;
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1.1;
  text-wrap: balance;
}
.relais-l {
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  opacity: .75;
}
.relais-s { font-size: .9375rem; opacity: .85; }

/* Chaque mode ne pose que DEUX valeurs, son fond et son encre. Le bloc et
   son bouton les lisent tous les deux — le bouton en les échangeant. Écrire
   les règles du bouton séparément aurait doublé la table, et les deux
   moitiés auraient fini par se désaccorder. */
.relais[data-ou="lesson"] { --relais-bg: var(--c-lesson, var(--accent));    --relais-ink: var(--ct-lesson, var(--accent-ink)); }
.relais[data-ou="quiz"]   { --relais-bg: var(--c-quiz, var(--accent));      --relais-ink: var(--ct-quiz, var(--accent-ink)); }
.relais[data-ou="cards"]  { --relais-bg: var(--c-cards, var(--amber-bg));   --relais-ink: var(--ct-cards, var(--amber-ink)); }
.relais[data-ou="oral"]   { --relais-bg: var(--c-oral, var(--ink));         --relais-ink: var(--ct-oral, var(--paper)); }
.relais[data-ou="drills"] {
  --relais-bg: var(--c-drills, var(--surface));
  --relais-ink: var(--ct-drills, var(--ink));
  outline: 2px solid var(--ct-drills, var(--ink));
  outline-offset: -2px;
}
.relais { background: var(--relais-bg); color: var(--relais-ink); }

/* ⚠️ « Commencer » vit DANS l'aplat, pas en dessous. Vu sur une capture :
   posé dehors, le bouton bleu de l'app se retrouvait collé sous l'aplat bleu
   du relais de la leçon et du quiz — deux rectangles de la même couleur,
   sans limite lisible entre eux. À l'intérieur et en inversé, le bloc
   devient une seule chose : ce qui arrive, et le geste pour y aller. */
.relais-go {
  margin-top: 1rem;
  align-self: center;
  background: var(--relais-ink);
  color: var(--relais-bg);
  border: 0;
  border-radius: var(--edge);
  padding: .75rem 2.25rem;
  min-height: 2.75rem;
  font-family: var(--display);
  font-size: .9375rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* L'aplat monte et se révèle. Court — 0,32 s : c'est une respiration entre
   deux phases, pas un générique. Au-delà, on attend. */
@keyframes relais-entre {
  from { opacity: 0; transform: translateY(.75rem); }
  to   { opacity: 1; transform: none; }
}
/* La règle globale `prefers-reduced-motion` du fichier coupe déjà toutes les
   animations : rien à répéter ici. */

/* La pastille d'une séance en cours : un simple contour, sans animation.
   Ce n'est pas une alerte mais un repère, et une chose qui bouge en
   permanence sur l'accueil finit par se lire comme un défaut.
   Le contour prend `currentColor`, donc la couleur du texte de la case :
   il reste visible quelle que soit la teinte choisie à la main. */
.chip.encours {
  outline: 2px solid currentColor;
  outline-offset: 2px;
}

.pas-bauhaus { background: #1D4E89; }
.pas-indigo  { background: #3D3A8C; }
.pas-prune   { background: #6A4C93; }
.pas-encre   { background: #111111; }

/* ---------- Les couleurs choisies à la main ----------
   Une ligne par case, avec la vraie pastille du système : c'est celle du
   téléphone, avec toutes les teintes, et elle ne coûte pas une ligne de
   code. Sur un appareil trop ancien pour la connaître, le navigateur la
   rend en champ de texte — on peut alors y taper un code du genre #1D4E89.
   Dégradé, mais jamais bloqué. */
.teintes { display: flex; flex-direction: column; gap: .375rem; }
.teinte-l {
  display: flex;
  align-items: center;
  gap: .625rem;
  background: var(--surface);
  border: 2px solid var(--line);
  padding: .375rem .5rem;
}
.teinte-l b { flex: 1; font-size: .875rem; font-weight: 600; }
.teinte-e {
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
/* La pastille système est habillée d'un cadre : sans lui, une teinte claire
   posée sur une carte blanche n'aurait plus de contour visible. */
.teinte-p {
  width: 2.75rem;          /* la cible tactile, encore : 44 px */
  height: 2.25rem;
  padding: 0;
  border: 2px solid var(--ink);
  background: none;
  cursor: pointer;
  flex: none;
}
.teinte-p::-webkit-color-swatch-wrapper { padding: 2px; }
.teinte-p::-webkit-color-swatch { border: 0; }

/* Les deux cadres de la sauvegarde par texte. Volontairement bas (3 lignes)
   et en chasse fixe : ce n'est pas fait pour être lu, seulement copié ou
   collé. Un cadre haut donnerait l'impression qu'il faut le relire. */
.sauve {
  width: 100%;
  box-sizing: border-box;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: .75rem;
  line-height: 1.4;
  background: var(--surface);
  color: var(--ink-2);
  border: 2px solid var(--line);
  border-radius: var(--edge);
  padding: .5rem;
  resize: vertical;
}
.sauve:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.why {
  font-size: .875rem;
  color: var(--ink-2);
  background: var(--surface-2);
  border-radius: var(--edge);
  padding: .625rem .75rem;
}
.why b { color: var(--ink); font-family: var(--de); font-weight: 600; }
.why.good { color: var(--good); background: var(--good-soft); }
.why.bad  { color: var(--bad);  background: var(--bad-soft); }
.why.good b, .why.bad b { color: inherit; }

.meter { display: flex; gap: .25rem; }
.meter i {
  flex: 1;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
}
.meter i.on  { background: var(--accent); }
.meter i.err { background: var(--bad); }

.score { text-align: center; padding: 1rem 0; }
.score b {
  display: block;
  font-size: 3rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.04em;
  line-height: 1;
}
.score span { color: var(--ink-3); font-size: .9375rem; }

.tools { display: flex; flex-wrap: wrap; gap: .5rem; }
.tool {
  background: none;
  border: 1px solid var(--line);
  border-radius: var(--edge);
  padding: .4375rem .625rem;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.tool:hover { color: var(--ink); border-color: var(--ink-3); }
.tool.danger:hover { color: var(--bad); border-color: var(--bad); }
.msg { font-size: .8125rem; color: var(--ink-2); }

/* L'onglet « Le livre ». Les listes du livre sont longues (26 lettres,
   21 mots de vocabulaire) : deux colonnes serrées, et la table déborde
   en défilement plutôt que de casser la mise en page du téléphone. */
.tbl { width: 100%; border-collapse: collapse; font-size: .875rem; display: block; overflow-x: auto; }
.tbl td { padding: .3125rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td:first-child { font-weight: 600; white-space: nowrap; }
.items { margin: .5rem 0 0; padding-left: 1.25rem; font-size: .875rem; }
.items li { margin: .25rem 0; }

/* Une question du livre : énoncé, champ, verdict. */
.ask-item { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--line); }
.ask-item:first-of-type { border-top: 0; padding-top: 0; }
.ask-q { font-size: .875rem; margin: 0 0 .375rem; }
/* L'indice « où chercher » : discret, il ne doit pas se lire avant l'énoncé. */
.ask-ou { font-size: .75rem; color: var(--ink-3); margin: 0 0 .375rem; font-style: italic; }
.ask-item .answer { margin: 0 0 .375rem; }
.ask-fb { font-size: .8125rem; margin-top: .375rem; color: var(--ink-2); }
.ask-fb.good { color: var(--ok, #1B7F4B); }
.ask-fb.bad  { color: var(--ko, #B3261E); }

/* La réplique en cours de lecture. Un liseré épais plutôt qu'un fond
   coloré : la carte reste lisible, et ça marche en clair comme en sombre. */
.card.saying { box-shadow: inset 3px 0 0 var(--accent, #1B54C7); }

/* Les groupes repliables du sommaire du livre. */
.grp { border-top: 1px solid var(--line); }
.grp:last-of-type { border-bottom: 1px solid var(--line); }
.grp > summary {
  display: flex; align-items: baseline; justify-content: space-between; gap: .5rem;
  padding: .75rem .125rem; cursor: pointer; list-style: none;
}
.grp > summary::-webkit-details-marker { display: none; }
/* Le chevron dit d'un coup d'œil si le groupe est ouvert. */
.grp > summary::after {
  content: "▾"; color: var(--ink-3); font-size: .75rem; transition: transform .15s;
}
.grp[open] > summary::after { transform: rotate(180deg); }
.grp .g-t { font-weight: 650; font-size: .9375rem; }
.grp .g-n { font-size: .75rem; color: var(--ink-3); margin-left: auto; }
.grp .modes { padding-bottom: .75rem; }
.warn {
  font-size: .8125rem;
  color: var(--ink-2);
  background: var(--bad-soft);
  border-left: 3px solid var(--bad);
  padding: .625rem .75rem;
}

/* ---------- Rapport d'auto-test (index.html#test) ---------- */
.t-sum {
  font-size: 2.25rem;
  font-weight: 800;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  margin: .25rem 0;
}
.t-row {
  display: flex;
  gap: .625rem;
  align-items: baseline;
  padding: .375rem 0;
  border-bottom: 1px solid var(--line);
  font-size: .875rem;
}
.t-row:last-child { border-bottom: 0; }
.t-tag {
  flex: 0 0 auto;
  font-size: .625rem;
  font-weight: 800;
  letter-spacing: .08em;
  padding: .0625rem .3125rem;
  border-radius: var(--edge);
}
.t-tag.ok { background: var(--good-soft); color: var(--good); }
.t-tag.ko { background: var(--bad-soft);  color: var(--bad); }
.t-row .d { color: var(--ink-3); font-size: .75rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1 class="wordmark" id="wordmark">Deutsch Täglich <small>A1</small></h1>
    <div class="topright">
      <span class="streak" id="streak" hidden></span>
      <!-- Rouage dessiné et non le caractère ⚙ : sur iPhone ce dernier
           s'affiche en emoji couleur, qui jurerait avec le reste et ne
           suivrait pas le thème. Le SVG prend la couleur du texte.

           Il est CONSTRUIT et non tracé à main levée. La première version
           était un `path` écrit au jugé : ses dents n'étaient ni de la même
           taille ni régulièrement réparties, et à 22 px ça donnait une tache.
           Ici, huit dents identiques posées tous les 45°, et deux cercles
           concentriques — de la géométrie, ce que réclame la direction
           choisie. Tout est en traits (`stroke`) : pas de trou à remplir,
           donc rien à accorder au fond, et l'icône reste nette sur les deux
           thèmes. -->
      <button class="gear" id="gear" type="button" aria-label="Réglages et progression">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g fill="currentColor">
            <circle cx="12" cy="5"  r="2.1"/>
            <circle cx="12" cy="12" r="2.1"/>
            <circle cx="12" cy="19" r="2.1"/>
          </g>
        </svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<!-- LA REGION D'ANNONCE, signalee par le mentor (§4). Les ecrans sont
     reconstruits par innerHTML : pour un lecteur d'ecran, la page ne change
     pas, elle se remplace en silence. Ni le changement d'ecran ni la
     CORRECTION -- c'est-a-dire la reponse a la seule question qu'on se pose en
     revisant -- n'etaient annonces.

     `polite` et non `assertive` : on attend que la phrase en cours se termine.
     Couper la lecture d'une consigne pour annoncer « Exact. » ferait perdre la
     consigne. Elle est hors de #view, sinon chaque innerHTML la remplacerait
     et le navigateur perdrait le fil de ce qu'il devait dire. -->
<p id="annonce" class="sr-only" role="status" aria-live="polite"></p>

     Scripts CLASSIQUES et non modules ES : verifie le 13/08/2026, un module

     test.ps1. Un script classique, si, et ses const/let restent visibles
     d un fichier a l autre. Le passage aux modules attendra le serveur. -->
<script src="donnees/cours.js"></script>
<script src="app.js"></script>
<script src="demarrage.js"></script>
