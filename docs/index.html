     gap    compléter un trou               — terminaisons, articles, cas
     trans  transformer une phrase          — négation, question : la mécanique
     trad   traduire une phrase entière     — tout à la fois

   Ils vivent dans `drills`, au niveau de l'étape. Une étape sans `drills`
   n'affiche simplement pas le mode. */
const DRILL_SESSION = 8;   // combien on en sert par séance, quel que soit le réservoir

let drills = [], di = 0, drillVerdict = null, orderPool = [], orderPicked = [];

/* Le réservoir est plus grand qu'une séance, et on sert d'abord ce qui a été
   le MOINS VU. Mélanger seulement, comme au début, redonnait mot pour mot les
   mêmes exercices dans un autre ordre — c'est exactement ce qu'on veut éviter.
   À nombre de passages égal, on tire au hasard : deux séances de suite ne
   donnent donc pas la même liste. */
function drawDrills(n) {
  const src = (COURSE[S.day - 1] || {}).drills || [];
  if (!src.length) return [];

  const idx = shuffleIdx(src.length);                       // départage aléatoire
  idx.sort(function (a, b) {
    return drillSeen(a) - drillSeen(b);
  });

  return idx.slice(0, Math.min(n, src.length)).map(function (i) {
    return Object.assign({ key: S.day + ":" + i }, src[i]);
  });
}
function drillSeen(i) {
  return (S.dseen && S.dseen[S.day + ":" + i]) || 0;
}

function drillsView() {
  drills = drawDrills(DRILL_SESSION);
  // On note tout de suite ce qui est servi : même si la séance est abandonnée,
  // la prochaine proposera autre chose.
  if (!S.dseen) S.dseen = {};
  drills.forEach(function (d) { S.dseen[d.key] = (S.dseen[d.key] || 0) + 1; });
  persist();
  di = 0;
  setupDrill();
  return renderDrill();
}

/* Prépare l'exercice courant. Pour « remettre dans l'ordre », les étiquettes
   sont tirées une fois ici : les remélanger à chaque redessin les ferait
   sauter sous le doigt. */
function setupDrill() {
  drillVerdict = null;
  orderPicked = [];
  orderPool = [];
  const d = drills[di];
  if (d && d.t === "order") {
    const mots = bareSentence(d.a).split(" ");
    orderPool = shuffleIdx(mots.length).map(function (i) { return mots[i]; });
  }
}

/* La phrase sans sa ponctuation : ce sont les mots qu'on assemble. */
function bareSentence(s) {
  return String(s).replace(/[.,!?;:]/g, " ").replace(/\s+/g, " ").trim();
}

function drillAnswer(d) {
  return orderPicked.map(function (i) { return orderPool[i]; }).join(" ");
}

function checkDrill(d, typed) {
  if (d.t === "order") {
    const got = normDE(drillAnswer(d));
    if (!got) return { ok: false, kind: "empty" };
    return got === normDE(bareSentence(d.a))
      ? { ok: true, kind: "exact" }
      : { ok: false, kind: "wrong" };
  }
  return checkAnswer(typed, d.a);
}

function renderDrill() {
  if (!drills.length) {
    return [
      backBar('Accueil'),
      '<div class="stack">',
        '<div class="card"><span class="label">Les exercices</span>',
          '<p class="msg" style="margin:.5rem 0 0">Cette étape n\'a pas encore d\'exercices écrits.</p></div>',
        suiteBtn("drills"),
        '<button class="btn wide" data-go="home">Retour à l\'accueil</button>',
      '</div>'
    ].join("");
  }

  if (di >= drills.length) {
    touchStreak();
    const bons = drills.filter(function (x) { return x.ok; }).length;
    return [
      backBar('Accueil'),
      '<div class="stack">',
        '<div class="score"><b>' + bons + '/' + drills.length + '</b><span>exercices réussis.</span></div>',
        suiteBtn("drills"),
        '<button class="btn wide" data-go="drills">Recommencer</button>',
        '<button class="btn wide" data-go="home">Retour à l\'accueil</button>',
      '</div>'
    ].join("");
  }

  const d = drills[di];
  const consignes = {
    order: "Remets les mots dans l'ordre.",
    gap:   "Complète la phrase.",
    trans: d.inst || "Transforme la phrase.",
    trad:  "Traduis en allemand."
  };

  const head = [
    backBar('Accueil'),
    '<div class="stack">',
      '<div class="stack-s">',
        '<span class="label">Exercice ' + (di + 1) + ' sur ' + drills.length + '</span>',
        '<div class="meter">' + drills.map(function (_, i) {
          return '<i class="' + (i < di ? (drills[i].ok ? 'on' : 'err') : '') + '"></i>';
        }).join("") + '</div>',
      '</div>',
      '<div class="card">',
        '<h3 class="sec">' + esc(consignes[d.t] || "") + '</h3>',
        d.f     ? '<p class="q" style="margin-top:.75rem">' + esc(d.f) + '</p>' : '',
        d.from  ? '<p class="de" style="margin-top:.5rem">' + esc(d.from) + '</p>' : '',
        d.s     ? '<p class="de" style="margin-top:.5rem">' + esc(d.s) + '</p>' : '',
      '</div>'
  ].join("");

  if (!drillVerdict) {
    const saisie = d.t === "order"
      ? [
          '<div class="build">' +
            orderPicked.map(function (p, k) {
              return '<button class="chip-w" data-unchip="' + k + '">' + esc(orderPool[p]) + '</button>';
            }).join("") +
          '</div>',
          '<div class="chips">' +
            orderPool.map(function (w, i) {
              return orderPicked.indexOf(i) !== -1 ? '' :
                '<button class="chip-w" data-chip="' + i + '">' + esc(w) + '</button>';
            }).join("") +
          '</div>'
        ].join("")
      : '<input class="answer" id="answer" type="text" enterkeyhint="done"' +
        ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' +
        ' aria-label="Ta réponse">';

    return head + saisie + [
      '<div class="pair">',
        '<button class="btn" data-act="drill-skip">Je ne sais pas</button>',
        '<button class="btn primary" data-act="drill-check">Vérifier</button>',
      '</div>',
    '</div>'
    ].join("");
  }

  return head + [
    '<div class="flash">',
      '<div class="sol">' + esc(d.a) + '</div>',
      drillVerdict.typed ? '<div class="tip">Tu as écrit : ' + esc(drillVerdict.typed) + '</div>' : '',
    '</div>',
    '<div class="why ' + (drillVerdict.ok ? "good" : "bad") + '">' +
      (drillVerdict.ok ? "Exact. " : "") + (d.why || "") + '</div>',
    '<button class="btn primary wide" data-act="drill-next">Continuer</button>',
  '</div>'
  ].join("");
}

/* ===============================================================
   5. NAVIGATION — un seul écouteur pour toute l'app
   =============================================================== */
/* ---------------------------------------------------------------
   L'onglet « Le livre »
   ---------------------------------------------------------------
   Trois écrans : le sommaire des unités, une unité, le test de fin
   de niveau.

   La première version était volontairement passive — on lisait, rien
   n'était corrigé. Exsangue l'a arrêtée net : « j'aimerais pouvoir
   répondre aux questions du livre et que tu me corriges ». Il a raison,
   et le raisonnement d'avant était faux : un exercice qu'on ne peut pas
   faire n'est plus un exercice, c'est une page à regarder.

   On corrige donc ici, avec le MÊME moteur que le reste de l'app —
   checkAnswer pour l'allemand (tolérant sur ß, les trémas, la casse et
   la ponctuation ; strict sur le genre) et checkFR pour le français.
   Aucun second moteur : deux correcteurs qui divergent, c'est la
   garantie qu'un jour l'un des deux refusera ce que l'autre accepte.

   Deux sortes de questions, et la distinction est nette :
   - `a` : une réponse attendue → on corrige.
   - `model` : une question ouverte (« présentez-vous », « décrivez votre
     famille ») → aucune correction automatique n'a de sens, on montre
     une réponse possible à comparer. Prétendre corriger « décrivez votre
     famille » serait mentir sur ce que l'app sait faire. */

/* ---------------------------------------------------------------
   Le suivi du livre
   ---------------------------------------------------------------
   Demandé par Exsangue le 01/08/2026 : voir qu'une leçon est faite, et
   si elle l'a été sans faute.

   On enregistre le PREMIER verdict de chaque question, et lui seul.
   Réessayer ensuite n'efface pas l'erreur — sinon « sans faute » ne
   voudrait plus rien dire, il suffirait d'insister. Réviser reste
   possible et utile ; c'est la trace qui ne bouge plus.

   Révéler la réponse avant d'avoir répondu compte comme une faute :
   c'est exactement ce que veut dire le bouton.

   Les questions ouvertes (`model`) restent hors du compte — on ne peut
   pas juger « décrivez votre famille », et un compteur qui prétendrait
   le faire serait faux. */

function askIds(u) {
  const ids = [];
  (u.exercises || []).forEach(function (ex, k) {
    (ex.items || []).forEach(function (it, j) {
      if (it.a) ids.push("u" + u.n + "-" + k + "-" + j);
    });
  });
  return ids;
}

function unitScore(u) {
  const ids = askIds(u);
  let faits = 0, fautes = 0;
  ids.forEach(function (id) {
    const v = S.bookq[id];
    if (v === undefined) return;
    faits++;
    if (!v) fautes++;
  });
  return {
    total: ids.length, faits: faits, fautes: fautes,
    fini: ids.length > 0 && faits === ids.length
  };
}

/* L'étiquette affichée pour une unité, sur le sommaire comme en fin d'unité. */
function unitBadge(u) {
  const s = unitScore(u);
  if (!s.total)  return { txt: "à lire", cls: "" };
  if (!s.faits)  return { txt: s.total + " questions", cls: "" };
  if (!s.fini)   return { txt: s.faits + " / " + s.total, cls: "" };
  if (!s.fautes) return { txt: "sans faute", cls: " ok" };
  return { txt: s.fautes + " faute" + (s.fautes > 1 ? "s" : ""), cls: " hot" };
}

/* ---------------------------------------------------------------
   L'indice « où chercher »
   ---------------------------------------------------------------
   Signalé par Exsangue le 01/08/2026 : à l'unité 4, l'exercice demande de
   traduire « chez moi », « fiancée », « samedi soir »… mais la liste de
   vocabulaire n'a que six mots pour sept demandés. Les réponses sont dans
   le DIALOGUE — jamais dans la liste.

   Le livre attend donc qu'on relise le dialogue pour y pêcher les mots.
   La méthode est défendable : elle force à relire. Mais il ne le dit nulle
   part, et sa liste laisse croire qu'elle est complète — on cherche alors
   un mot qu'on est certain de n'avoir jamais vu, et on se croit fautif.

   On calcule donc l'indice au lieu de l'écrire à la main : pour chaque
   question, on regarde si la réponse se trouve dans les listes de
   vocabulaire, dans le dialogue, ou nulle part. Écrit à la main sur 35
   unités, il finirait faux quelque part ; calculé, il reste juste même si
   une unité change. */

function motsDeLUnite(u) {
  const listes = [], dialogue = [];
  (u.sections || []).forEach(function (s) {
    (s.rows || []).forEach(function (r) {
      listes.push(normDE(r[0]));
      listes.push(normDE(r[1]));
    });
    (s.p || []).forEach(function (t) { listes.push(normDE(t)); });
  });
  if (u.dialogue) {
    u.dialogue.lines.forEach(function (l) { dialogue.push(normDE(l.de)); });
  }
  return { listes: listes.join(" · "), dialogue: dialogue.join(" · ") };
}

/* Renvoie l'indice à afficher sous une question, ou "" s'il n'y a rien
   d'utile à dire. On ne signale QUE le cas gênant : la réponse existe dans
   l'unité, mais ailleurs que là où on la cherche. */
function indiceOu(u, it) {
  if (!it.a) return "";
  const cible = normDE(it.a);
  if (!cible) return "";
  const src = motsDeLUnite(u);

  if (src.listes.indexOf(cible) !== -1) return "";           // là où on l'attend
  if (src.dialogue.indexOf(cible) !== -1) return "Cherche dans le dialogue.";
  return "";
}

/* Une question du livre : l'énoncé, un champ, un bouton.
   `id` doit être unique sur l'écran — c'est lui qui relie le bouton à son
   champ et à sa zone de réponse. */
function askItem(it, id, indice) {
  ASKED[id] = it;
  const ouverte = !it.a;
  return [
    '<div class="ask-item">',
      '<p class="ask-q">' + esc(it.q) + '</p>',
      indice ? '<p class="ask-ou">' + esc(indice) + '</p>' : '',
      ouverte
        ? '<button class="btn" data-model="' + att(id) + '">Voir une réponse possible</button>'
        : '<input class="answer" type="text" data-in="' + att(id) + '"' +
            ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' +
            ' aria-label="Ta réponse">' +
          '<div class="pair">' +
            '<button class="btn primary" data-send="' + att(id) + '">Envoyer</button>' +
            '<button class="btn" data-check="' + att(id) + '">Voir la réponse</button>' +
          '</div>',
      '<div class="ask-fb" data-fb="' + att(id) + '" hidden></div>',
    '</div>'
  ].join("");
}

/* L'indice donné quand la réponse est fausse. Il doit aider à REESSAYER
   sans donner la solution — demandé par Exsangue : « peut-être j'ai oublié
   juste un mot ou mal orthographié ». Dire seulement « faux » ne permet pas
   de savoir s'il faut tout revoir ou corriger une lettre. */
function hintFor(typed, expected, fr) {
  const norm = fr ? normFR : normDE;
  const t = norm(typed), e = norm(expected);
  if (!t) return "Écris quelque chose d'abord.";

  const mt = t.split(" ").length, me = e.split(" ").length;
  if (mt < me) return "Presque — il manque " + (me - mt > 1 ? (me - mt) + " mots." : "un mot.");
  if (mt > me) return "Il y a " + (mt - me > 1 ? (mt - me) + " mots de trop." : "un mot de trop.");

  // On réutilise la distance plafonnée de l'app : au-delà de 5, savoir si
  // c'est 6 ou 40 ne change rien à ce qu'on affiche.
  const d = editDistance(t, e, 5);
  if (d <= 2) return "Tout près — regarde l'orthographe.";
  if (d <= 5) return "Le bon nombre de mots, mais ce n'est pas encore ça.";
  return "Pas encore. Reprends la phrase depuis le début.";
}

/* Corrige une question. `reveal` sépare les deux boutons demandés par
   Exsangue : « Envoyer » dit juste ou faux et laisse réessayer ; « Voir la
   réponse » dévoile. Confondre les deux, c'est priver du deuxième essai —
   or c'est souvent au deuxième essai qu'on apprend vraiment.
   Renvoie true si la réponse est juste. */
function gradeItem(id, reveal) {
  const it = ASKED[id];
  if (!it) return false;
  const input = view.querySelector('[data-in="' + id + '"]');
  const fb = view.querySelector('[data-fb="' + id + '"]');
  const tape = input ? input.value : "";

  // Le français est corrigé avec indulgence, l'allemand avec exigence :
  // c'est là que l'orthographe EST l'objectif.
  const v = it.fr ? checkFR(tape, it.a) : checkAnswer(tape, it.a);

  let note, classe;
  if (reveal) {
    note = "La réponse : <b>" + esc(it.a) + "</b>";
    classe = "";
  } else if (v.ok) {
    note = v.kind === "no-article"
      ? "Juste — pense à l'article la prochaine fois."
      : "Exact.";
    classe = " good";
  } else if (v.kind === "bad-article") {
    note = "Le genre de l'article n'est pas le bon. Réessaie.";
    classe = " bad";
  } else {
    note = hintFor(tape, it.a, it.fr);
    classe = " bad";
  }

  /* On fige le premier verdict. Un champ vide n'en est pas un : appuyer sur
     Envoyer sans avoir écrit ne doit pas coûter une faute. */
  const vide = !reveal && v.kind === "empty";
  if (!vide && S.bookq[id] === undefined) {
    S.bookq[id] = (!reveal && v.ok) ? 1 : 0;
    persist();
  }

  if (fb) {
    fb.className = "ask-fb" + classe;
    fb.innerHTML = note;
    fb.hidden = false;
  }
  return v.ok;
}

/* Les questions affichées à l'écran, par identifiant. Rempli à chaque
   rendu : sans ça, le bouton « Vérifier » n'aurait aucun moyen de
   retrouver la réponse attendue. */
let ASKED = {};

function bookView() {
  ASKED = {};
  let finies = 0, impec = 0;
  BOOK.forEach(function (u) {
    const s = unitScore(u);
    if (s.fini) { finies++; if (!s.fautes) impec++; }
  });

  /* Trente-cinq unités à la file font un écran interminable qu'on ne relit
     jamais. Signalé par Exsangue. On les replie par groupes, avec un
     `<details>` natif : pas de code d'ouverture à écrire, et ça reste
     accessible au clavier et aux lecteurs d'écran.
     Le groupe où l'on travaille s'ouvre tout seul — sinon il faudrait
     recliquer au même endroit à chaque visite. */
  const groupes = BOOK_GROUPS.map(function (g) {
    const dedans = BOOK.filter(function (u) { return u.n >= g.de && u.n <= g.a; });
    if (!dedans.length) return "";

    let gFinies = 0;
    const cartes = dedans.map(function (u) {
      const s = unitScore(u), b = unitBadge(u);
      if (s.fini) gFinies++;
      return '<button class="mode" data-unit="' + u.n + '">' +
               '<div class="txt"><strong>' + (s.fini ? '&#10003; ' : '') +
                 'Unité ' + u.n + ' &#183; ' + esc(u.title) + '</strong>' +
               '<span>page ' + esc(u.pages) + (u.dialogue ? ' &#183; dialogue' : '') + '</span></div>' +
               '<span class="chip' + b.cls + '">' + b.txt + '</span>' +
             '</button>';
    }).join("");

    const ouvert = S.unit >= g.de && S.unit <= g.a;
    return '<details class="grp"' + (ouvert ? ' open' : '') + '>' +
             '<summary>' +
               '<span class="g-t">' + esc(g.titre) + '</span>' +
               '<span class="g-n">unités ' + g.de + '–' + g.a + ' &#183; ' +
                 gFinies + '/' + dedans.length + '</span>' +
             '</summary>' +
             '<div class="modes">' + cartes + '</div>' +
           '</details>';
  }).join("");

  return [
    '<div class="stack">',
      backBar("Accueil"),
      '<div class="stack-s">',
        '<span class="label">Le livre &#183; niveau ' + LEVEL + ' &#183; ' +
          finies + ' / ' + BOOK.length + ' unités terminées' +
          (impec ? ' &#183; ' + impec + ' sans faute' : '') + '</span>',
        '<h2>Le livre</h2>',
        '<p class="msg">Les unités telles qu\'elles sont dans ton livre : le dialogue, ' +
          'les listes, les exercices. Une unité est terminée quand tu as répondu à toutes ' +
          'ses questions — c\'est la <b>première</b> réponse qui compte.</p>',
      '</div>',
      groupes,
      '<button class="btn wide" data-go="booktest">Test de fin de niveau &#183; ' +
        BOOK_TEST.exercises.length + ' exercices</button>',
    '</div>'
  ].join("");
}

/* Le bilan affiché au bas d'une unité. Tant qu'elle n'est pas terminée on
   dit seulement où on en est : annoncer un score à mi-parcours donnerait
   une note à un travail inachevé. */
function bilan(u) {
  const s = unitScore(u);
  if (!s.total) return "";

  let titre, corps;
  if (!s.fini) {
    titre = "En cours";
    corps = s.faits + " question" + (s.faits > 1 ? "s" : "") + " sur " + s.total +
            ". Il en reste " + (s.total - s.faits) + ".";
  } else if (!s.fautes) {
    titre = "&#10003; Unité terminée &#183; sans faute";
    corps = "Les " + s.total + " questions justes du premier coup. Tu peux passer à la suite.";
  } else {
    titre = "&#10003; Unité terminée";
    corps = (s.total - s.fautes) + " sur " + s.total + " justes du premier coup, " +
            s.fautes + " faute" + (s.fautes > 1 ? "s" : "") +
            ". Refaire l'unité remet le compteur à zéro.";
  }

  return '<div class="card">' +
           '<span class="label">' + titre + '</span>' +
           '<p class="msg" style="margin:.375rem 0 0">' + corps + '</p>' +
           (s.faits ? '<button class="btn" style="margin-top:.5rem" data-reset="' + u.n +
                      '">Refaire cette unité</button>' : '') +
         '</div>';
}

function unitView() {
  ASKED = {};
  const u = BOOK.filter(function (x) { return x.n === S.unit; })[0] || BOOK[0];

  /* Dans la version publiée, `BOOK` est vide et cet écran n'est atteignable
     que par une adresse tapée à la main (#unite3). Il ne doit pas planter
     pour autant : une page blanche muette vaut mieux qu'un écran cassé. */
  if (!u) {
    return [
      backBar("Accueil"),
      '<div class="stack"><div class="card">',
        '<span class="label">Le livre</span>',
        '<p class="msg" style="margin:.5rem 0 0">Cette version ne contient pas le livre.</p>',
      '</div></div>'
    ].join("");
  }

  const dial = u.dialogue ? [
    '<div class="stack-s">',
      '<h3 class="sec">Dialogue</h3>',
      '<p class="msg">' + esc(u.dialogue.inst) + '</p>',
      '<button class="btn primary wide" data-play="' + u.n + '">▶ Écouter tout le dialogue</button>',
      u.dialogue.lines.map(function (l, i) {
        return '<div class="card" data-line="' + i + '">' +
                 '<span class="label">' + esc(l.who) + '</span>' +
                 '<p class="de">' + esc(l.de) + ' ' + sayBtn(l.de) + '</p>' +
                 (l.fr ? '<p class="trad" data-fr="' + i + '" hidden>' + esc(l.fr) + '</p>' +
                         '<button class="btn" data-reveal="' + i + '">Traduction</button>' : '') +
               '</div>';
      }).join(""),
    '</div>'
  ].join("") : "";

  const secs = (u.sections || []).map(function (s) {
    const corps = s.rows
      ? '<table class="tbl">' + s.rows.map(function (r) {
          return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>';
        }).join("") + '</table>'
      : (s.p || []).map(function (t) { return '<p class="msg">' + esc(t) + '</p>'; }).join("");
    return '<div class="stack-s"><h3 class="sec">' + esc(s.h) + '</h3>' + corps + '</div>';
  }).join("");

  const exos = (u.exercises || []).map(function (ex, k) {
    return '<div class="card">' +
             '<p class="msg">' + esc(ex.inst) + '</p>' +
             (ex.items || []).map(function (it, j) {
               return askItem(it, "u" + u.n + "-" + k + "-" + j, indiceOu(u, it));
             }).join("") +
           '</div>';
  }).join("");

  const i = BOOK.map(function (x) { return x.n; }).indexOf(u.n);
  const prev = i > 0 ? BOOK[i - 1].n : null;
  const next = i < BOOK.length - 1 ? BOOK[i + 1].n : null;

  return [
    '<div class="stack">',
      '<button class="back" data-go="book">&#8592; Le livre</button>',
      '<div class="stack-s">',
        '<span class="label">Unité ' + u.n + ' &#183; niveau ' + LEVEL + ' &#183; page ' + esc(u.pages) + '</span>',
        '<h2>' + esc(u.title) + '</h2>',
        u.intro ? '<p class="msg">' + esc(u.intro) + '</p>' : '',
      '</div>',
      dial,
      secs,
      exos ? '<div class="stack-s"><h3 class="sec">Exercices</h3>' + exos + '</div>' : '',
      bilan(u),
      '<div class="tools">',
        prev !== null ? '<button class="tool" data-unit="' + prev + '">&#8592; Unité ' + prev + '</button>' : '',
        next !== null ? '<button class="tool" data-unit="' + next + '">Unité ' + next + ' &#8594;</button>' : '',
      '</div>',
    '</div>'
  ].join("");
}

function bookTestView() {
  ASKED = {};
  const exos = BOOK_TEST.exercises.map(function (ex) {
    return '<div class="card">' +
             '<span class="label">Exercice ' + ex.n + ' &#183; ' + esc(ex.h) + '</span>' +
             '<p class="msg">' + esc(ex.inst) + '</p>' +
             (ex.items || []).map(function (it, j) {
               return askItem(it, "t" + ex.n + "-" + j);
             }).join("") +
           '</div>';
  }).join("");

  return [
    '<div class="stack">',
      '<button class="back" data-go="book">&#8592; Le livre</button>',
      '<div class="stack-s">',
        '<span class="label">Pages ' + esc(BOOK_TEST.pages) + ' &#183; ' + BOOK_TEST.exercises.length + ' exercices</span>',
        '<h2>' + esc(BOOK_TEST.title) + '</h2>',
        '<p class="msg">Le test du livre, à faire sur papier. Il reprend tout le niveau, ' +
          'dans l\'ordre des unités.</p>',
      '</div>',
      exos,
    '</div>'
  ].join("");
}

const ROUTES = {
  home: home, lesson: lessonView, cards: cardsView,
  practice: practiceView, oral: oralView, drills: drillsView, quiz: quizView,
  book: bookView, unit: unitView, booktest: bookTestView
};

function go(name) { show(ROUTES[name]()); }

view.addEventListener("click", function (e) {
  const t = e.target.closest("[data-go],[data-act],[data-pick],[data-grade],[data-day],[data-lesson],[data-say],[data-scheck],[data-chip],[data-unchip],[data-unit],[data-reveal],[data-check],[data-model],[data-send],[data-reset],[data-play]");
  if (!t) return;

  // Écouter une réplique seule doit interrompre la lecture continue :
  // sinon deux voix se superposent et on ne comprend plus rien.
  if (t.hasAttribute("data-say")) { stopLecture(); speak(t.getAttribute("data-say")); return; }

  if (t.dataset.play) {
    if (lecture) { stopLecture(); return; }          // le bouton fait aussi « arrêter »
    const u = BOOK.filter(function (x) { return x.n === Number(t.dataset.play); })[0];
    if (u && u.dialogue) {
      playDialogue(u.dialogue.lines.map(function (l) { return l.de; }));
    }
    return;
  }

  // Le livre : ouvrir une unité, révéler une traduction, corriger une réponse.
  if (t.dataset.unit) { S.unit = Number(t.dataset.unit); persist(); go("unit"); return; }
  if (t.dataset.reveal) {
    const p = view.querySelector('.trad[data-fr="' + t.dataset.reveal + '"]');
    if (p) { p.hidden = false; t.remove(); }
    return;
  }
  if (t.dataset.reset) {
    const u = BOOK.filter(function (x) { return x.n === Number(t.dataset.reset); })[0];
    if (u) { askIds(u).forEach(function (id) { delete S.bookq[id]; }); persist(); go("unit"); }
    return;
  }
  if (t.dataset.send)  { gradeItem(t.dataset.send, false); return; }
  if (t.dataset.check) { gradeItem(t.dataset.check, true); return; }
  if (t.dataset.model) {
    const it = ASKED[t.dataset.model];
    const fb = view.querySelector('[data-fb="' + t.dataset.model + '"]');
    if (it && fb) {
      fb.className = "ask-fb";
      fb.innerHTML = "Une réponse possible : <b>" + esc(it.model) + "</b>";
      fb.hidden = false;
      t.remove();
    }
    return;
  }

  if (t.dataset.go) { go(t.dataset.go); return; }

  if (t.dataset.day) {
    const n = Number(t.dataset.day);
    if (reachable(n)) { S.day = n; persist(); go("home"); }
    return;
  }

  // Ouvrir directement la leçon d'un jour donné (précédent ou suivant).
  if (t.dataset.lesson) {
    const n = Number(t.dataset.lesson);
    if (reachable(n)) { S.day = n; persist(); go("lesson"); }
    return;
  }

  /* --- étapes de la leçon --- */
  if (t.hasAttribute("data-scheck")) {
    if (stepPick !== null) return;
    stepPick = Number(t.dataset.scheck);
    show(renderStep());
    return;
  }
  if (t.dataset.act === "step-next")    { setStep(stepIdx + 1); show(renderStep()); return; }
  if (t.dataset.act === "step-back")    { setStep(Math.max(0, stepIdx - 1)); show(renderStep()); return; }
  if (t.dataset.act === "step-restart") { setStep(0); show(renderStep()); return; }

  if (t.hasAttribute("data-grade")) { advanceCard(t.dataset.grade === "1"); return; }

  if (t.dataset.act === "check-word" || t.dataset.act === "dunno") {
    const inp = document.getElementById("answer");
    const raw = inp ? inp.value : "";
    const cur = deck[pos];
    // Le sens dépend du niveau du mot : en dessous du seuil on écrit le
    // français, au-dessus l'allemand. Deux correcteurs, parce que les deux
    // langues ne s'exigent pas pareil — le français est jugé avec indulgence,
    // l'allemand au mot près.
    const enAllemand = S.cards[cur.id].box >= WRITE_FROM_BOX;
    verdict = (t.dataset.act === "dunno")
      ? { ok: false, kind: "dunno", typed: "" }
      : (enAllemand ? checkAnswer(raw, cur.d) : checkGloss(raw, cur.f));

    // Réponse refusée en allemand : peut-être un autre mot qui traduit la
    // même chose. On ne punit pas une traduction correcte.
    if (enAllemand && !verdict.ok && verdict.kind !== "empty") {
      const autre = autreTraduction(raw, cur);
      if (autre) verdict = { ok: true, kind: "autre", autre: autre };
    }

    if (t.dataset.act === "check-word") verdict.typed = raw.trim();
    show(renderCard());
    return;
  }

  if (t.dataset.act === "card-next") { advanceCard(!!(verdict && verdict.ok)); return; }

  if (t.dataset.act === "oral-check" || t.dataset.act === "oral-dunno") {
    const inp = document.getElementById("answer");
    const raw = inp ? inp.value : "";
    const it = oral[oi];
    if (t.dataset.act === "oral-dunno") {
      oralVerdict = { ok: false, kind: "dunno", typed: "" };
    } else {
      oralVerdict = checkOral(raw, it, it.level);
      oralVerdict.typed = raw.trim();
    }
    it.ok = oralVerdict.ok;

    // Niveau à l'oreille : +1 si c'est juste, −1 sinon, comme pour les cartes.
    it.after = oralVerdict.ok
      ? Math.min(ORAL_MAX, it.level + 1)
      : Math.max(1, it.level - 1);
    if (!S.oral) S.oral = {};
    S.oral[it.key] = it.after;
    persist();

    // Seuls les mots du vocabulaire ont une fiche ; les phrases n'en ont pas.
    // Comme l'entraînement, l'oral nourrit le journal sans toucher au calendrier.
    if (it.id && S.cards[it.id]) grade(it.id, oralVerdict.ok, false);
    show(renderOral());
    return;
  }
  if (t.dataset.act === "oral-next") { oi++; oralVerdict = null; show(renderOral()); return; }

  /* --- les exercices --- */
  if (t.dataset.chip)   { orderPicked.push(Number(t.dataset.chip)); show(renderDrill()); return; }
  if (t.dataset.unchip) { orderPicked.splice(Number(t.dataset.unchip), 1); show(renderDrill()); return; }
  if (t.dataset.act === "drill-check" || t.dataset.act === "drill-skip") {
    const d = drills[di];
    const inp = document.getElementById("answer");
    const raw = inp ? inp.value : "";
    if (t.dataset.act === "drill-skip") {
      drillVerdict = { ok: false, kind: "dunno", typed: "" };
    } else {
      drillVerdict = checkDrill(d, raw);
      drillVerdict.typed = d.t === "order" ? drillAnswer(d) : raw.trim();
    }
    d.ok = drillVerdict.ok;
    show(renderDrill());
    return;
  }
  if (t.dataset.act === "drill-next") { di++; setupDrill(); show(renderDrill()); return; }

  if (t.hasAttribute("data-pick")) {
    if (answered) return;
    qLog[qi] = Number(t.dataset.pick);
    const src = qOrder[qi];
    if (qLog[qi] === COURSE[S.day - 1].quiz[src].a) qScore++;
    else {
      // Journal : quelle question résiste, et depuis combien de fois.
      const k = S.day + ":" + src;
      S.qmiss[k] = (S.qmiss[k] || 0) + 1;
      persist();
    }
    answered = true;
    show(renderQuestion());
    return;
  }

  if (t.dataset.act === "next") { qi++; answered = false; show(renderQuestion()); return; }

  if (t.dataset.act === "quit-test") {
    try { history.replaceState(null, "", window.location.pathname); } catch (e) {}
    go("home");
    return;
  }

  if (t.dataset.act === "export") { exportData(); return; }
  if (t.dataset.act === "import") { importData(); return; }
  if (t.dataset.act === "reset") {
    if (window.confirm("Effacer toute ta progression ? C'est définitif.")) {
      S = fresh(); persist(); paintStreak(); go("home");
    }
    return;
  }
});

/* Entrée : valider, puis enchaîner.
   Demandé par Exsangue le 01/08/2026. L'ancien gestionnaire ne savait que
   valider, et seulement dans les cartes et l'oral : il fallait reprendre la
   souris entre chaque carte, et les exercices comme les questions du livre
   n'y répondaient pas du tout. Enchaîner vingt cartes au clavier change le
   rythme d'une séance.

   L'écouteur est sur `document` et non sur `view` : une fois la réponse
   validée, le champ disparaît de l'écran, donc le focus retombe sur la page
   et la touche n'atteindrait plus `view`.

   L'ordre compte : on valide d'abord s'il y a quelque chose à valider, on
   passe à la suite seulement sinon. L'inverse ferait sauter une carte à
   chaque fois qu'on appuie deux fois un peu vite. */
let revele = 0; // quand la carte courante a été retournée

document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;

  const cible = e.target;
  // Un texte long se saisit sur plusieurs lignes : Entrée doit y rester Entrée.
  if (cible && cible.tagName === "TEXTAREA") return;

  // Dans une question du livre, Entrée envoie la réponse — sans la dévoiler.
  if (cible && cible.dataset && cible.dataset.in) {
    const envoi = view.querySelector('[data-send="' + cible.dataset.in + '"]');
    if (envoi) { e.preventDefault(); envoi.click(); }
    return;
  }

  const valider = view.querySelector(
    '[data-act="check-word"],[data-act="oral-check"],[data-act="drill-check"]');
  if (valider) { e.preventDefault(); valider.click(); return; }

  const suivant = view.querySelector(
    '[data-act="card-next"],[data-act="oral-next"],[data-act="drill-next"]');
  if (suivant) { e.preventDefault(); suivant.click(); }
});

/* La flèche gauche vaut « Je ne sais pas ». Elle visait « Raté » tant que les
   cartes se retournaient ; depuis qu'on écrit toujours, c'est le bouton
   d'abandon qu'elle sert. Placée sous la main gauche, à l'opposé d'Entrée,
   pour qu'on ne l'atteigne pas par inadvertance en validant.
   Elle est ignorée dans un champ de saisie : la flèche doit y déplacer le
   curseur, sinon on ne peut plus corriger une faute de frappe. */
document.addEventListener("keydown", function (e) {
  if (e.key !== "ArrowLeft") return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  const abandon = view.querySelector('[data-act="dunno"],[data-act="oral-dunno"]');
  if (abandon) { e.preventDefault(); abandon.click(); }
});

/* ===============================================================
   6. SAUVEGARDE / RESTAURATION
   =============================================================== */
function toolMsg(txt) {
  const el = document.getElementById("toolmsg");
  if (el) el.textContent = txt;
}
function exportData() {
  const json = JSON.stringify(S, null, 2);
  const name = "allemand-progression-" + today() + ".json";

  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename: name, data: json })
      .then(function () { toolMsg("Sauvegarde enregistrée."); })
      .catch(function (err) {
        if (err && err.code === "declined") toolMsg("Sauvegarde annulée.");
        else toolMsg("Sauvegarde impossible ici. Essaie depuis un navigateur classique.");
      });
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
    toolMsg("Sauvegarde enregistrée.");
  } catch (e) { toolMsg("Sauvegarde impossible dans ce navigateur."); }
}
function importData() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.addEventListener("change", function () {
    const f = input.files && input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = function () {
      try {
        const p = JSON.parse(r.result);
        if (typeof p !== "object" || !p.cards) throw new Error("format");
        S = Object.assign(fresh(), p);
        persist(); paintStreak(); go("home");
        toolMsg("Progression restaurée.");
      } catch (e) { toolMsg("Ce fichier n'est pas une sauvegarde valide."); }
    };
    r.readAsText(f);
  });
  input.click();
}

/* ===============================================================
   7. AUTO-TEST — ouvrir index.html#test
   =============================================================== */
let T = [];
function ok(name, cond, detail) { T.push({ n: name, p: !!cond, d: detail || "" }); }
function eq(name, got, want) {
  ok(name, got === want, "obtenu " + JSON.stringify(got) + " · attendu " + JSON.stringify(want));
}

function runTests() {
  let backup = null;
  try { backup = localStorage.getItem(KEY); } catch (e) {}
  T = [];

  /* --- A. Intégrité du contenu --- */
  COURSE.forEach(function (l, i) {
    const tag = "jour " + (i + 1);
    ok(tag + " : numéro cohérent avec sa position", l.day === i + 1);
    ok(tag + " : titre et phrase-titre renseignés", !!l.title && !!l.de);

    ok(tag + " : au moins deux étapes", l.steps.length >= 2);
    ok(tag + " : chaque étape porte une idée", l.steps.every(function (s) { return !!s.idea; }));
    ok(tag + " : les mots à mots sont alignés",
       l.steps.every(function (s) { return !s.gloss || s.gloss.de.length === s.gloss.fr.length; }));
    ok(tag + " : aucun mot à mot vide",
       l.steps.every(function (s) { return !s.gloss || (s.gloss.de.length > 0 && s.gloss.de.every(Boolean) && s.gloss.fr.every(Boolean)); }));
    ok(tag + " : les tableaux ont deux colonnes",
       l.steps.every(function (s) { return !s.table || s.table.every(function (r) { return r.length === 2 && r[0] && r[1]; }); }));
    ok(tag + " : au moins une mini-question dans la leçon",
       l.steps.some(function (s) { return !!s.check; }));
    ok(tag + " : chaque mini-question est valide",
       l.steps.every(function (s) {
         if (!s.check) return true;
         const c = s.check;
         return !!c.q && !!c.why && c.o.length >= 2 &&
                Number.isInteger(c.a) && c.a >= 0 && c.a < c.o.length &&
                new Set(c.o).size === c.o.length;
       }));

    ok(tag + " : exemples complets (allemand + français)", l.examples.length > 0 && l.examples.every(function (e) { return e.d && e.f; }));
    ok(tag + " : vocabulaire complet, prononciation comprise",
       l.vocab.length > 0 && l.vocab.every(function (v) { return v.d && v.f && v.p; }));
    ok(tag + " : aucun mot en double", new Set(l.vocab.map(function (v) { return v.d; })).size === l.vocab.length);

    ok(tag + " : quiz non vide", l.quiz.length > 0);
    ok(tag + " : chaque bonne réponse pointe sur une option existante",
       l.quiz.every(function (q) { return Number.isInteger(q.a) && q.a >= 0 && q.a < q.o.length; }));
    ok(tag + " : aucune option dupliquée dans une question",
       l.quiz.every(function (q) { return new Set(q.o).size === q.o.length; }));
    ok(tag + " : chaque question est expliquée", l.quiz.every(function (q) { return !!q.why; }));
  });

  /* --- A bis. La structure Niveau / Chapitre / Étape --- */
  ok("structure : chaque étape écrite appartient à un chapitre",
     (function () {
       for (let n = 1; n <= COURSE.length; n++) if (!chapterOf(n)) return false;
       return true;
     })());
  ok("structure : aucune étape n'est rangée dans deux chapitres",
     (function () {
       const vus = {};
       for (let i = 0; i < CHAPTERS.length; i++) {
         for (let j = 0; j < CHAPTERS[i].steps.length; j++) {
           const n = CHAPTERS[i].steps[j];
           if (vus[n]) return false;
           vus[n] = true;
         }
       }
       return true;
     })());
  ok("structure : les chapitres regroupent des étapes consécutives",
     CHAPTERS.every(function (ch) {
       return ch.steps.every(function (n, i) { return i === 0 || n === ch.steps[i - 1] + 1; });
     }));
  ok("structure : chaque chapitre a un titre", CHAPTERS.every(function (ch) { return !!ch.title; }));
  eq("structure : l'étape 1 ouvre le chapitre 1", chapterOf(1).chapter.n, 1);
  eq("structure : et elle y est en première position", chapterOf(1).rank, 1);
  /* Ces règles ne visent plus des numéros d'étape en dur : le cours se
     construit unité par unité, et une vérification qui nomme « l'étape 4 »
     casse à chaque étape ajoutée au lieu de signaler un vrai défaut. */
  ok("structure : chaque chapitre reprend là où le précédent s'arrête",
     CHAPTERS.every(function (ch, i) {
       if (i === 0) return ch.steps[0] === 1;
       const avant = CHAPTERS[i - 1].steps;
       return ch.steps[0] === avant[avant.length - 1] + 1;
     }));
  ok("structure : le dernier chapitre se termine sur la dernière étape écrite",
     (function () {
       const dernier = CHAPTERS[CHAPTERS.length - 1].steps;
       return dernier[dernier.length - 1] === COURSE.length;
     })());
  ok("structure : chaque étape est en première position de son chapitre ou suit la précédente",
     CHAPTERS.every(function (ch) {
       return ch.steps.every(function (n, i) { return chapterOf(n).rank === i + 1; });
     }));

  /* ---- La touche Entrée ----
     Demandé par Exsangue : valider ET enchaîner sans reprendre la souris.
     On envoie une vraie touche, pas un appel de fonction : c'est le seul
     moyen de vérifier que l'écouteur est bien branché là où il faut. */
  function entree(sur) {
    (sur || document.body).dispatchEvent(
      new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  }

  S = fresh(); S.day = 1; seed(1);
  go("cards");
  (function () {
    const champ = view.querySelector("#answer");
    if (champ) {
      champ.value = "n'importe quoi";
      entree(champ);
      ok("Entrée : dans les cartes, elle valide",
         !!view.querySelector('[data-act="card-next"]'));
      entree();
      ok("Entrée : puis elle passe à la carte suivante",
         !view.querySelector('[data-act="card-next"]'));
    }
  })();

  /* Les cartes du niveau 1 : on y écrit le français, comme partout ailleurs.
     Le garde-fou du double appui n'a plus lieu d'être — il protégeait le
     « Je savais » d'un retournement trop rapide, et ce bouton n'existe plus. */
  S = fresh(); S.day = 1; seed(1);
  go("cards");
  (function () {
    const champ = document.getElementById("answer");
    ok("Entrée : au niveau 1 aussi, il y a un champ à remplir", !!champ);
    if (!champ) return;
    champ.value = deck[0].f;
    entree(champ);
    ok("Entrée : elle valide la carte de niveau 1",
       !!view.querySelector('[data-act="card-next"]'));
    entree();
    ok("Entrée : puis elle passe à la suivante",
       !view.querySelector('[data-act="card-next"]'));
  })();

  /* La flèche gauche vaut « Je ne sais pas » depuis que les cartes s'écrivent
     toutes — elle visait « Raté », qui n'existe plus. */
  S = fresh(); S.day = 1; seed(1);
  go("cards");
  (function () {
    const avant = !!view.querySelector('[data-act="dunno"]');
    document.body.dispatchEvent(
      new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
    ok("Flèche gauche : elle vaut « Je ne sais pas »",
       avant && !!view.querySelector('[data-act="card-next"]'));
  })();

  /* Mais elle ne doit rien déclencher pendant qu'on écrit : dans un champ,
     la flèche sert à corriger une faute de frappe. */
  S = fresh(); S.day = 1; seed(1);
  go("cards");
  (function () {
    const champ = document.getElementById("answer");
    champ.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
    ok("Flèche gauche : sans effet quand on est dans le champ",
       !view.querySelector('[data-act="card-next"]'));
  })();

  S = fresh(); S.day = 1; seed(1);
  go("drills");
  (function () {
    const champ = view.querySelector("#answer");
    if (!champ) { ok("Entrée : exercice sans champ, rien à vérifier", true); return; }
    champ.value = "n'importe quoi";
    entree(champ);
    ok("Entrée : dans les exercices, elle valide aussi",
       !!view.querySelector('[data-act="drill-next"]'));
  })();

  /* La touche Entrée dans une question du livre : seulement s'il y a un livre. */
  if (BOOK.length) {
    S.unit = 1; go("unit");
    const champ = view.querySelector('[data-in="u1-0-0"]');
    champ.value = "Ich spreche Russisch";
    entree(champ);
    const fb = view.querySelector('[data-fb="u1-0-0"]');
    ok("Entrée : dans une question du livre, elle envoie la réponse",
       !fb.hidden && fb.className.indexOf("good") !== -1);
    ok("Entrée : et elle ne dévoile pas la réponse",
       fb.innerHTML.indexOf("La réponse") === -1);
  }

  /* Tout ce qui suit ne concerne que le livre. Dans la version publiée,
     `BOOK` est vide : ces vérifications n'ont plus d'objet et se retirent
     d'elles-mêmes, au lieu d'échouer en bloc. */
  if (BOOK.length) {

  /* ---- Lire un dialogue d'un bout à l'autre ----
     Demandé par Exsangue. On ne peut pas faire parler la voix de synthèse
     dans le harnais, mais on vérifie tout ce qui l'entoure : le bouton, le
     repère visuel, l'arrêt, et surtout qu'on ne laisse pas une lecture
     tourner derrière un autre écran. */
  S = fresh(); S.unit = 2; go("unit");
  (function () {
    ok("dialogue : un bouton propose d'écouter tout le dialogue",
       !!view.querySelector('[data-play="2"]'));
    eq("dialogue : chaque réplique est repérable pour le surlignage",
       view.querySelectorAll("[data-line]").length,
       BOOK.filter(function (x) { return x.n === 2; })[0].dialogue.lines.length);

    /* La lecture doit s'arrêter quand on change d'écran, sinon le dialogue
       continue à parler par-dessus la suite, sans bouton pour le couper. */
    lecture = { i: 0, stop: false };
    go("book");
    ok("dialogue : changer d'écran coupe la lecture", lecture === null);

    /* Écouter une réplique seule doit couper la lecture continue : deux
       voix en même temps ne s'écoutent pas. */
    S.unit = 2; go("unit");
    lecture = { i: 0, stop: false };
    view.querySelector(".card [data-say]").click();
    ok("dialogue : écouter une réplique seule interrompt la lecture", lecture === null);

    /* Une unité sans dialogue ne doit pas afficher de bouton de lecture. */
    S.unit = 10; go("unit");
    ok("dialogue : pas de bouton quand l'unité n'a pas de dialogue",
       !view.querySelector("[data-play]"));
  })();
  S = fresh(); seed(1);

  /* ---- L'indice « où chercher » ----
     Trouvé par Exsangue : l'unité 4 demande de traduire « chez moi », mais
     sa liste de vocabulaire n'a que six mots pour sept demandés. La réponse
     est dans le dialogue. On vérifie sur ce cas précis, puis on s'assure
     qu'on ne colle pas un indice là où il n'a rien à faire. */
  (function () {
    const u4 = BOOK.filter(function (x) { return x.n === 4; })[0];
    const items = u4.exercises[0].items;

    const chezMoi = items.filter(function (it) { return it.q === "Chez moi"; })[0];
    ok("indice : « chez moi » n'est pas dans la liste de vocabulaire",
       motsDeLUnite(u4).listes.indexOf(normDE(chezMoi.a)) === -1);
    ok("indice : mais bien dans le dialogue",
       motsDeLUnite(u4).dialogue.indexOf(normDE(chezMoi.a)) !== -1);
    eq("indice : on le signale donc", indiceOu(u4, chezMoi), "Cherche dans le dialogue.");

    /* Un mot qui EST dans la liste ne doit pas recevoir d'indice : ce serait
       du bruit, et à force on ne lirait plus les indices utiles. */
    const plage = items.filter(function (it) { return it.q === "Plage"; })[0];
    eq("indice : rien à dire quand le mot est dans la liste", indiceOu(u4, plage), "");

    /* Une question ouverte n'a pas de réponse à chercher. */
    const u0 = BOOK.filter(function (x) { return x.n === 0; })[0];
    eq("indice : rien sur une question ouverte",
       indiceOu(u0, u0.exercises[0].items[0]), "");

    /* Et l'indice s'affiche vraiment à l'écran. */
    S = fresh(); S.unit = 4; go("unit");
    ok("indice : il apparaît sous la question",
       view.innerHTML.indexOf("Cherche dans le dialogue") !== -1);

    /* Il ne doit jamais apparaître sur une unité dont tout le vocabulaire
       est listé — sinon c'est que le calcul déraille. */
    S.unit = 9; go("unit");
    ok("indice : absent quand l'unité liste tout son vocabulaire",
       view.innerHTML.indexOf("Cherche dans le dialogue") === -1);

    S = fresh(); seed(1);

  /* ---- Le suivi du livre ----

  eq("série : après une coupure, elle repart à 1", S.streak, 1);

  /* Les clés des exercices qu'un tirage servirait, sans rien enregistrer. */

    return drawDrills(DRILL_SESSION).map(function (d) { return d.key; }).sort();

  /* Lit l'ordre des boutons de réponse actuellement à l'écran, par index d'origine. */

  /* --- E. La leçon pas à pas, en cliquant vraiment --- */

  go("lesson");
  const steps1 = COURSE[0].steps;
  let sawCheck = false;

  ok("récapitulatif : la prononciation est affichée", view.querySelectorAll(".voc .p").length === COURSE[0].vocab.length);

  /* --- G. Le mélange — le défaut trouvé en jouant : sans lui, la bonne

  eq("mélange : autant d'indices que demandé", shuffleIdx(5).length, 5);

     (function () {
       for (let n = 1; n <= 6; n++) {

     })());

  S = fresh(); S.day = 1; seed(1);

  /* --- I. Revenir à la leçon précédente depuis la fin d'une leçon --- */

  /* ---- Un autre mot peut traduire la même chose ----
     Trouvé par Exsangue le 01/08/2026 : la carte affichait « voici » et
     attendait « das ist ». Il a répondu « hier ist », qui est juste aussi —
     les deux entrées partagent la glose « voici », l'une écrite à la main,
     l'autre venue du livre. */
  (function () {
    /* On FABRIQUE la collision au lieu de compter sur le contenu. Le mot qui
       l'avait révélée — « hier ist » — vient du livre, et la version publiée
       ne l'a pas : le test échouait là-bas alors que le code était bon.
       Un test doit valoir dans les deux versions. */
    const faux = { d: "hier ist", f: "voici", p: "hiir IST" };
    COURSE[0].vocab.push(faux);

    const carte = { d: "das ist", f: "voici, c'est" };
    eq("synonyme : un autre mot traduisant « voici » est reconnu",
       autreTraduction("hier ist", carte), "hier ist");
    ok("synonyme : un mot sans rapport reste refusé",
       autreTraduction("der Hund", carte) === null);
    ok("synonyme : le mot visé lui-même n'est pas proposé comme autre",
       autreTraduction("das ist", carte) === null);

    /* Et le verdict le dit, sinon on croirait avoir visé juste.
       On vise la carte « das ist » explicitement : la laisser au tirage
       rendait le test aléatoire, et il tombait sur « hier ist » elle-même. */
    S = fresh(); S.day = 3; seed(3);
    Object.keys(S.cards).forEach(function (id) { S.cards[id].box = WRITE_FROM_BOX; });
    go("cards");
    const idx = deck.map(function (c) { return normDE(c.d); }).indexOf(normDE("das ist"));
    ok("synonyme : la carte « das ist » est bien dans le paquet", idx !== -1);
    if (idx !== -1) {
      pos = idx;

      show(renderCard());
      document.getElementById("answer").value = "hier ist";
      view.querySelector('[data-act="check-word"]').click();
      ok("synonyme : la réponse est acceptée", verdict && verdict.ok);
      eq("synonyme : et signalée comme une autre traduction", verdict.kind, "autre");
      ok("synonyme : le mot visé est rappelé",
         view.innerHTML.indexOf("Ici on visait") !== -1);
    }

    COURSE[0].vocab.pop();   // on retire la collision fabriquée
    S = fresh(); S.day = 1; seed(1);
  })();

  /* ---- La virgule d'une glose sépare des synonymes ----
     Trouvé par Exsangue le 01/08/2026 sur la carte « das ist », dont la
     traduction est enregistrée « voici, c'est » : taper « voici » était
     refusé alors que c'est juste. */
  ok("glose : le premier synonyme suffit", checkGloss("voici", "voici, c'est").ok);
  ok("glose : le second aussi", checkGloss("c'est", "voici, c'est").ok);
  ok("glose : la réponse complète marche toujours", checkGloss("voici, c'est", "voici, c'est").ok);
  ok("glose : un mot faux reste refusé", !checkGloss("maison", "voici, c'est").ok);
  ok("glose : trois synonymes, n'importe lequel", checkGloss("savoir", "pouvoir, savoir").ok);
  ok("glose : la barre oblique sépare aussi", checkGloss("rapide", "vite / rapide").ok);
  ok("glose : sans virgule, rien ne change", checkGloss("la maison", "la maison").ok);

  /* Le cas exact d'Exsangue : il avait donné les DEUX synonymes, dans l'autre
     ordre et avec un autre séparateur. Compté faux alors que c'était juste
     deux fois plutôt qu'une. */
  ok("glose : les deux synonymes, dans l'autre ordre et avec une barre",
     checkGloss("c'est / voici", "voici, c'est").ok);
  ok("glose : les deux synonymes avec une virgule aussi",
     checkGloss("c'est, voici", "voici, c'est").ok);
  ok("glose : un synonyme juste et un faux passe quand même",
     checkGloss("voici / maison", "voici, c'est").ok);
  ok("glose : et une glose d'un seul mot reste stricte", !checkGloss("chien", "le chat").ok);

  /* Le garde-fou : on ne desserre PAS les exercices du livre, où une réponse

  ok("glose : une réponse en deux morceaux reste exigée en entier",
     !checkFR("ich bin", "ich bin, ich habe").ok);

  /* ---- L'oral monte en difficulté ----
     Signalé par Exsangue : une réplique de sept mots tombée en dictée, trop
     dure pour son niveau. Le tirage mélangeait mots isolés et phrases entières
     au hasard. Désormais la longueur est plafonnée, et le plafond monte avec
     le travail déjà fait sur l'étape. */
  (function () {
    const mots = function (t) { return String(t).trim().split(/\s+/).length; };

    S = fresh(); S.day = 2; seed(1);
    let items = oralItems(ORAL_SIZE);
    ok("oral : au départ, rien de plus long que trois mots",
       items.every(function (x) { return mots(x.de) <= 3; }),
       "le plus long : " + Math.max.apply(null, items.map(function (x) { return mots(x.de); })));

    /* La phrase de sept mots qu'Exsangue avait trouvée trop dure tombe sous le
       plafond de trois mots vérifié juste au-dessus : inutile de la citer en
       dur ici. On ne le fait d'ailleurs pas — le script qui produit la version
       publiable refuse de sortir si un morceau du livre traîne encore dans le
       fichier, y compris dans un test. */
    ok("oral : rien qui dépasse le plafond, quelle que soit la séance",
       (function () {
         for (let k = 0; k < 20; k++) {
           const s = oralItems(ORAL_SIZE);
           if (s.some(function (x) { return mots(x.de) > 3; })) return false;
         }
         return true;
       })());

    /* Le plafond monte : une fois des phrases acquises, les longues arrivent. */
    S = fresh(); S.day = 2; seed(1);
    const l = COURSE[1];
    l.vocab.forEach(function (v, i) { S.oral["v:2:" + i] = 3; });
    l.examples.forEach(function (e, i) { S.oral["p:2:" + i] = 3; });
    items = oralItems(ORAL_SIZE);
    ok("oral : une fois l'étape travaillée, les phrases longues arrivent",
       Math.max.apply(null, items.map(function (x) { return mots(x.de); })) > 3);

    /* Et une séance n'est jamais vide, même si tout dépasse le plafond. */
    S = fresh(); S.day = 2; seed(1);
    ok("oral : la séance n'est jamais vide", oralItems(ORAL_SIZE).length > 0);

    S = fresh(); S.day = 1; seed(1);
  })();

  /* ---- Le parcours guidé ----
     Demandé par Exsangue : après la leçon, on est mené aux exercices, puis aux

  (function () {

    eq("parcours : après les exercices, les cartes", apres("drills"), "cards");
    eq("parcours : après les cartes, l'oral", apres("cards"), "oral");
    eq("parcours : après l'oral, le quiz", apres("oral"), "quiz");

    const vraisDrills = COURSE[0].drills;

    ok("parcours : l'accueil reste proposé", !!view.querySelector('[data-go="home"]'));

  /* ---- Le son se lance tout seul, mais jamais quand il donnerait la réponse ----
     Demandé par Exsangue : « dès qu'une carte apparaît, l'audio se lance, pour
     pouvoir le faire sans lire ». Au niveau 1 le mot allemand est déjà à
     l'écran : l'entendre n'apprend rien à personne sur la traduction cherchée.
     Au-dessus, c'est l'allemand qu'on doit écrire — le prononcer avant la

  (function () {
    S = fresh(); S.day = 1; seed(1);
    go("cards");

    S = fresh(); S.day = 1; seed(1);

  /* Plus aucune carte passive depuis le 01/08/2026 : au niveau 1 on écrit la

  go("cards");

  document.getElementById("answer").value = deck[0].f.toUpperCase();

  S = fresh(); S.day = 1; seed(1);
  Object.keys(S.cards).forEach(function (id) { S.cards[id].box = WRITE_FROM_BOX; });
  go("cards");
  ok("cartes : au-dessus du seuil, c'est l'allemand qui est demandé",

  document.getElementById("answer").value = deck[0].f;

  /* --- L. Le journal des erreurs --- */
  S = fresh(); S.day = 1; seed(1);
  const jid = "1:0";
  eq("journal : un mot neuf part de zéro", (S.cards[jid].hit || 0) + (S.cards[jid].miss || 0), 0);
  eq("journal : un mot jamais révisé est à mi-chemin", weakness(jid), 0.5);
  grade(jid, false);
  eq("journal : une erreur est comptée", S.cards[jid].miss, 1);
  eq("journal : et la fragilité monte à 1", weakness(jid), 1);
  grade(jid, true); grade(jid, true); grade(jid, true);
  eq("journal : trois réussites plus tard, une erreur sur quatre", weakness(jid), 0.25);

  const tid = "1:0";
  S.cards[tid].box = 3;

  eq("entraînement : la date de révision ne bouge pas", S.cards[tid].due, shift(today(), 4));
  eq("entraînement : mais la réponse est notée", S.cards[tid].hit, 1);

  /* Le mot le plus raté doit ressortir à tous les coups. */
  S = fresh(); S.day = 1; seed(1);
  Object.keys(S.cards).forEach(function (id) { grade(id, true, false); grade(id, true, false); });
  grade("1:3", false, false); grade("1:3", false, false); grade("1:3", false, false);
  ok("entraînement : le mot le plus raté est repris à chaque fois",
     (function () {
       for (let k = 0; k < 25; k++) {

         if (!has) return false;
       }
       return true;

    const tag = "étape " + (i + 1);
    ok(tag + " : chaque exercice a un type connu",
       ds.every(function (d) { return ["order", "gap", "trans", "trad"].indexOf(d.t) !== -1; }));
    ok(tag + " : chaque exercice a une réponse et une explication",
       ds.every(function (d) { return !!d.a && !!d.why; }));
    ok(tag + " : chaque exercice pose sa question",
       ds.every(function (d) { return !!(d.f || d.s || d.from); }));
    ok(tag + " : les trous ont bien un trou",
       ds.every(function (d) { return d.t !== "gap" || String(d.s).indexOf("___") !== -1; }));
    ok(tag + " : les remises en ordre ont au moins trois mots",
       ds.every(function (d) { return d.t !== "order" || bareSentence(d.a).split(" ").length >= 3; }));
    ok(tag + " : la réponse attendue est acceptée par le correcteur",
       ds.every(function (d) { return d.t === "order" || checkAnswer(d.a, d.a).ok; }));
    ok(tag + " : plusieurs formes d'exercices, pas une seule en boucle",
       (function () {
         const vus = {};
         ds.forEach(function (d) { vus[d.t] = true; });
         return Object.keys(vus).length >= 3;
       })());
  });

  /* Les quatre formes d'exercices ne sont pas toutes présentes à l'étape 1 :
     elle porte sur les SONS, et « remettre dans l'ordre » suppose une phrase
     à ordonner, donc une grammaire qu'on n'a pas encore vue. Chaque forme se
     teste donc sur la PREMIÈRE étape qui la contient, et non sur l'étape 1 —
     sinon ajouter une étape d'ouverture casse le harnais au lieu du code. */
  function premierExercice(forme) {
    for (let i = 0; i < COURSE.length; i++) {
      const trouves = (COURSE[i].drills || []).filter(function (x) { return x.t === forme; });
      if (trouves.length) return trouves.slice(0, 1);
    }
    return [];
  }
  ["order", "gap", "trans", "trad"].forEach(function (forme) {
    ok("exercices : la forme « " + forme + " » existe quelque part dans le cours",
       premierExercice(forme).length === 1);
  });

  S = fresh(); S.day = 1; seed(1);
  go("drills");
  eq("exercices : une séance en sert un nombre fixe", drills.length,
     Math.min(DRILL_SESSION, COURSE[0].drills.length));
  ok("exercices : le réservoir est plus grand qu'une séance",
     COURSE[0].drills.length > DRILL_SESSION,
     COURSE[0].drills.length + " exercices pour " + DRILL_SESSION + " servis");

  /* Le point signalé par Exsangue : en refaisant la leçon, les exercices
     étaient mot pour mot les mêmes, seulement dans un autre ordre. */
  S = fresh(); S.day = 1; seed(1);
  const serie1 = drawDrillsKeys();
  drillsView();
  const serie2 = drawDrillsKeys();
  ok("exercices : deux séances de suite ne servent pas la même liste",
     serie1.join(",") !== serie2.join(","),
     "1re : " + serie1.length + " · 2e : " + serie2.length);

  /* Et surtout : tout le réservoir finit par passer, rien n'est oublié. */
  S = fresh(); S.day = 1; seed(1);
  const total = COURSE[0].drills.length;
  const tours = Math.ceil(total / DRILL_SESSION);
  const vus = {};
  for (let k = 0; k < tours; k++) {
    drillsView();
    drills.forEach(function (d) { vus[d.key] = true; });
  }
  eq("exercices : en " + tours + " séances, tout le réservoir a été servi",
     Object.keys(vus).length, total);

  ok("exercices : les moins vus passent en premier",
     (function () {
       S = fresh(); S.day = 1; seed(1);
       drillsView();
       const dejaVus = drills.map(function (d) { return d.key; });
       drillsView();
       // Aucun des exercices de la 1re séance ne doit revenir tant qu'il
       // reste des exercices jamais servis.
       return drills.every(function (d) { return dejaVus.indexOf(d.key) === -1; });
     })());

  /* Remettre les mots dans l'ordre, en cliquant vraiment. */
  S = fresh(); S.day = 1; seed(1);
  go("drills");
  drills = premierExercice("order");
  di = 0; setupDrill(); show(renderDrill());
  const attendu = bareSentence(drills[0].a).split(" ");
  eq("ordre : une étiquette par mot", view.querySelectorAll(".chips .chip-w").length, attendu.length);
  ok("ordre : la zone de construction est vide au départ",
     view.querySelectorAll(".build .chip-w").length === 0);

  // On clique les etiquettes dans le bon ordre, en cherchant le mot voulu.
  for (let k = 0; k < attendu.length; k++) {
    const libres = view.querySelectorAll(".chips .chip-w");
    let cible = null;
    for (let z = 0; z < libres.length; z++) {
      if (libres[z].textContent === attendu[k]) { cible = libres[z]; break; }
    }
    if (!cible) { ok("ordre : le mot « " + attendu[k] + " » est disponible", false); break; }
    cible.click();
  }
  eq("ordre : tous les mots sont posés", view.querySelectorAll(".build .chip-w").length, attendu.length);
  view.querySelector('[data-act="drill-check"]').click();
  ok("ordre : la phrase reconstituée est acceptée", !!view.querySelector(".why.good"));

  /* Le mauvais ordre doit être refusé — c'est tout l'intérêt. */
  S = fresh(); S.day = 1; seed(1);
  go("drills");
  drills = premierExercice("order");
  di = 0; setupDrill(); show(renderDrill());
  // On pose systématiquement la DERNIÈRE étiquette libre : la phrase sort à l'envers.
  const nbMots = bareSentence(drills[0].a).split(" ").length;
  for (let k = 0; k < nbMots; k++) {
    const libres = view.querySelectorAll(".chips .chip-w");
    libres[libres.length - 1].click();
  }
  // Le tirage étant aléatoire, cet ordre-là PEUT tomber juste. On vérifie donc
  // l'invariant qui compte : le verdict correspond à ce qui a été construit.
  const construit = normDE(drillAnswer(drills[0]));
  const vise = normDE(bareSentence(drills[0].a));
  view.querySelector('[data-act="drill-check"]').click();
  ok("ordre : le verdict suit exactement la phrase construite",
     construit === vise ? !!view.querySelector(".why.good") : !!view.querySelector(".why.bad"),
     construit === vise ? "ordre juste" : "ordre faux, refusé");

  /* Retirer une étiquette posée. */
  S = fresh(); S.day = 1; seed(1);
  go("drills");
  drills = premierExercice("order");
  di = 0; setupDrill(); show(renderDrill());
  view.querySelector(".chips .chip-w").click();
  eq("ordre : une étiquette cliquée rejoint la phrase", view.querySelectorAll(".build .chip-w").length, 1);
  view.querySelector(".build .chip-w").click();
  eq("ordre : et on peut la reprendre", view.querySelectorAll(".build .chip-w").length, 0);

  /* Les exercices au clavier. */
  S = fresh(); S.day = 1; seed(1);
  go("drills");
  drills = premierExercice("gap");
  di = 0; setupDrill(); show(renderDrill());
  ok("trou : un champ de saisie est proposé", !!view.querySelector("#answer"));
  ok("trou : l'énoncé montre le trou", view.innerHTML.indexOf("___") !== -1);
  document.getElementById("answer").value = drills[0].a;
  view.querySelector('[data-act="drill-check"]').click();
  ok("trou : la bonne réponse est acceptée", !!view.querySelector(".why.good"));
  view.querySelector('[data-act="drill-next"]').click();
  ok("exercices : on arrive au décompte final", !!view.querySelector(".score"));

  S = fresh(); S.day = 1; seed(1);
  go("drills");
  drills = premierExercice("trad");
  di = 0; setupDrill(); show(renderDrill());
  document.getElementById("answer").value = "n'importe quoi";
  view.querySelector('[data-act="drill-check"]').click();
  ok("traduction : une mauvaise réponse est refusée", !!view.querySelector(".why.bad"));
  ok("traduction : la solution est montrée", !!view.querySelector(".flash .sol"));

  /* Une étape sans exercices ne doit pas offrir un écran vide. */
  S = fresh(); S.day = 1; seed(1);
  const sansDrills = (function () {
    for (let n = 1; n <= COURSE.length; n++) if (!(COURSE[n - 1].drills || []).length) return n;
    return 0;
  })();
  if (sansDrills) {
    S.day = sansDrills;
    go("drills");
    ok("exercices : une étape sans exercices l'annonce clairement",
       view.innerHTML.indexOf("pas encore d'exercices") !== -1);
  }

  /* --- P. Robustesse --- */
  ok("sécurité : le HTML des contenus est échappé", esc("<b>&</b>") === "&lt;b&gt;&amp;&lt;/b&gt;");
  ok("sécurité : les guillemets sont échappés dans les attributs", att('a"b') === "a&quot;b");
  eq("mobile : le double-tap ne déclenche pas le zoom",
     getComputedStyle(document.body).touchAction, "manipulation");
  ok("mobile : le champ de saisie fait au moins 16px, sinon iOS zoome au focus",
     (function () {
       const probe = document.createElement("input");
       probe.className = "answer";
       document.body.appendChild(probe);
       const size = parseFloat(getComputedStyle(probe).fontSize);
       document.body.removeChild(probe);
       return size >= 16;
     })());
  ok("audio : ne plante pas quand aucune voix allemande n'est disponible",
     (function () { try { speak("Guten Tag"); return true; } catch (e) { return false; } })());

  /* --- Restauration de la vraie progression --- */
  try {
    if (backup === null) localStorage.removeItem(KEY);
    else localStorage.setItem(KEY, backup);
  } catch (e) {}
  S = load();
  paintStreak();
  report();
}

function report() {
  const failed = T.filter(function (t) { return !t.p; });
  const rows = T.map(function (t) {
    return '<div class="t-row"><span class="t-tag ' + (t.p ? "ok" : "ko") + '">' + (t.p ? "OK" : "KO") + '</span><span>' +
      esc(t.n) + ((t.p || !t.d) ? "" : '<br><span class="d">' + esc(t.d) + '</span>') +
    '</span></div>';
  }).join("");

  show([
    '<div class="stack">',
      '<div class="card">',
        '<span class="label">Auto-test</span>',
        '<div class="t-sum" style="color:' + (failed.length ? "var(--bad)" : "var(--good)") + '">' +
          (T.length - failed.length) + ' / ' + T.length + '</div>',
        '<p class="msg">' +
          (failed.length ? failed.length + " test(s) en échec." : "Tout passe.") +
          ' La progression enregistrée n\'a pas été modifiée.</p>',
      '</div>',
      '<div class="card">' + rows + '</div>',
      '<button class="btn primary wide" data-act="quit-test">Ouvrir l\'application</button>',
    '</div>'
  ].join(""));
}

/* ---- Démarrage ----
   #test        → lance l'auto-test
   #lesson etc. → ouvre directement un écran (pratique pour tester)
   sinon        → l'accueil                                        */
initTTS();
seed(S.day);
paintStreak();

const entry = (window.location.hash || "").replace("#", "");

/* #unite3 ouvre directement l'unité 3 du livre. Ajouté le 01/08/2026 :
   Exsangue ne retrouvait pas les exercices de l'unité 1 en naviguant, et
   lui décrire le chemin par écrit ne servait à rien. Une adresse qui
   tombe pile sur l'écran voulu vaut mieux qu'un itinéraire. */
const uniteVisee = /^unite(\d+)$/.exec(entry);

if (entry === "test") runTests();
else if (uniteVisee && BOOK.some(function (u) { return u.n === Number(uniteVisee[1]); })) {
  S.unit = Number(uniteVisee[1]);
  go("unit");
}
else if (Object.prototype.hasOwnProperty.call(ROUTES, entry)) go(entry);
else go("home");
</script>

</body>
