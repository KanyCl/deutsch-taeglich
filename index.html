<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Deutsch Täglich — l'allemand chaque jour</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="L'allemand un peu chaque jour. Application personnelle, sans compte ni serveur.">

<!-- La couleur de la barre du navigateur suit le thème de l'appareil. -->
<meta name="theme-color" content="#EDEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">

<!-- « Ajouter à l'écran d'accueil » : icône, nom court, plein écran. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png" sizes="180x180">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* ---------------------------------------------------------------
   TOKENS — inspirés de la signalétique allemande (DIN / U-Bahn)
   Les composants ne lisent JAMAIS une couleur en dur : uniquement
   ces variables. C'est ce qui permet aux deux thèmes de marcher.
----------------------------------------------------------------*/
:root {
  --paper:      #EDEEF0;
  --surface:    #FFFFFF;
  --surface-2:  #E4E6EA;
  --ink:        #16181D;
  --ink-2:      #4A505B;
  --ink-3:      #7A828F;
  --line:       #CFD3DA;
  --accent:     #0B4FA8;
  --accent-ink: #FFFFFF;
  --accent-soft:rgba(11, 79, 168, .12);
  --amber:      #B8860B;
  --amber-bg:   #F2B705;
  --amber-ink:  #16181D;
  --good:       #1B7F4F;
  --good-soft:  rgba(27, 127, 79, .12);
  --bad:        #C6362A;
  --bad-soft:   rgba(198, 54, 42, .12);

  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --de: Georgia, "Noto Serif", "Times New Roman", serif;

  --edge: 2px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #0E1116;
    --surface:    #171B22;
    --surface-2:  #1F242D;
    --ink:        #E9ECF1;
    --ink-2:      #A8B0BC;
    --ink-3:      #79828F;
    --line:       #2A303A;
    --accent:     #5A9CEA;
    --accent-ink: #0E1116;
    --accent-soft:rgba(90, 156, 234, .16);
    --amber:      #F5C531;
    --amber-bg:   #F5C531;
    --amber-ink:  #16181D;
    --good:       #3FBE84;
    --good-soft:  rgba(63, 190, 132, .16);
    --bad:        #F0705F;
    --bad-soft:   rgba(240, 112, 95, .16);
  }
}

/* Le sélecteur du viewer doit gagner dans LES DEUX sens. */
:root[data-theme="dark"] {
  --paper:#0E1116; --surface:#171B22; --surface-2:#1F242D;
  --ink:#E9ECF1; --ink-2:#A8B0BC; --ink-3:#79828F; --line:#2A303A;
  --accent:#5A9CEA; --accent-ink:#0E1116; --accent-soft:rgba(90,156,234,.16);
  --amber:#F5C531; --amber-bg:#F5C531; --amber-ink:#16181D;
  --good:#3FBE84; --good-soft:rgba(63,190,132,.16);
  --bad:#F0705F;  --bad-soft:rgba(240,112,95,.16);
}
:root[data-theme="light"] {
  --paper:#EDEEF0; --surface:#FFFFFF; --surface-2:#E4E6EA;
  --ink:#16181D; --ink-2:#4A505B; --ink-3:#7A828F; --line:#CFD3DA;
  --accent:#0B4FA8; --accent-ink:#FFFFFF; --accent-soft:rgba(11,79,168,.12);
  --amber:#B8860B; --amber-bg:#F2B705; --amber-ink:#16181D;
  --good:#1B7F4F; --good-soft:rgba(27,127,79,.12);
  --bad:#C6362A;  --bad-soft:rgba(198,54,42,.12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;

  /* Deux appuis rapides sur un bouton sont un geste normal dans une app, pas
     une demande de zoom : on désactive le double-tap zoom. Le pincement à deux
     doigts reste possible — on ne retire pas le zoom, seulement ce raccourci
     qui se déclenche par accident. */
  touch-action: manipulation;
}

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 31rem;
  margin: 0 auto;
  padding: 1rem 1rem 4rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

/* ---------- Libellés de signalétique ---------- */
.label {
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ---------- En-tête ---------- */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  border-bottom: 3px solid var(--ink);
  padding-bottom: .625rem;
}
.wordmark {
  font-size: 1.0625rem;
  font-weight: 800;
  letter-spacing: -.01em;
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: .4rem;
}
.wordmark small {
  font-size: .625rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.streak {
  display: inline-flex;
  align-items: center;
  gap: .375rem;
  background: var(--amber-bg);
  color: var(--amber-ink);
  padding: .25rem .5rem;
  font-size: .75rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: .04em;
}
.streak[hidden] { display: none; }

.back {
  background: none;
  border: 0;
  padding: .25rem 0;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
  align-self: flex-start;
}
.back:hover { color: var(--accent); }

/* ---------- La ligne : le cours comme un réseau de stations ---------- */
.line {
  display: flex;
  overflow-x: auto;
  padding-bottom: .25rem;
  scrollbar-width: thin;
}
.station {
  flex: 0 0 auto;
  width: 2.5rem;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .375rem;
  background: none;
  border: 0;
  padding: 0;
}
.station::before {
  content: "";
  position: absolute;
  top: .4375rem;
  left: 0; right: 0;
  height: 2px;
  background: var(--line);
}
.station:first-child::before { left: 50%; }
.station:last-child::before  { right: 50%; }
.station .dot {
  position: relative;
  width: 1rem; height: 1rem;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--paper);
}
.station .n {
  font-size: .6875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
}
.station.done .dot { background: var(--accent); border-color: var(--accent); }
.station.done .n   { color: var(--ink-2); }
.station.now .dot  { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.station.now .n    { color: var(--accent); font-weight: 800; }
.station.soon .dot { border-style: dashed; }

/* ---------- La plaque du jour ---------- */
.plate {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 1rem;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--edge);
  padding: 1rem;
}
.plate .num {
  width: 4.25rem; height: 4.25rem;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  line-height: 1;
}
.plate .num b {
  font-size: 2.375rem;
  font-weight: 800;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
}
.plate h2 {
  margin: .25rem 0 0;
  font-size: 1.375rem;
  font-weight: 800;
  letter-spacing: -.02em;
  text-wrap: balance;
}
.plate .de {
  font-family: var(--de);
  font-style: italic;
  color: var(--ink-2);
  font-size: .9375rem;
  margin: .125rem 0 0;
}

/* ---------- Barres d'action ---------- */
.modes { display: flex; flex-direction: column; gap: .5rem; }
.mode {
  display: flex;
  align-items: center;
  gap: .875rem;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--ink);
  border-radius: var(--edge);
  padding: .875rem 1rem;
  transition: background .12s ease, border-color .12s ease;
}
.mode:hover:not(:disabled) { background: var(--surface-2); border-left-color: var(--accent); }
.mode:disabled { opacity: .45; cursor: not-allowed; }
.mode .txt { flex: 1; min-width: 0; }
.mode .txt strong {
  display: block;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -.01em;
}
.mode .txt span {
  display: block;
  font-size: .8125rem;
  color: var(--ink-3);
}
.chip {
  flex: 0 0 auto;
  min-width: 1.75rem;
  padding: .1875rem .4375rem;
  text-align: center;
  font-size: .75rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  border-radius: var(--edge);
  background: var(--surface-2);
  color: var(--ink-2);
}
.chip.hot  { background: var(--amber-bg); color: var(--amber-ink); }
.chip.ok   { background: var(--good-soft); color: var(--good); }

/* ---------- Blocs de contenu ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--edge);
  padding: 1rem;
}
.stack { display: flex; flex-direction: column; gap: 1rem; }
.stack-s { display: flex; flex-direction: column; gap: .5rem; }

h3.sec {
  margin: 0;
  font-size: .6875rem;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  border-bottom: 1px solid var(--line);
  padding-bottom: .375rem;
}

/* ---------- Une étape de leçon ---------- */
.step-idea {
  margin: 0;
  font-size: 1.1875rem;
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -.015em;
  text-wrap: balance;
}
.step-detail {
  margin: .625rem 0 0;
  font-size: .9375rem;
  color: var(--ink-2);
}
.step-detail b { color: var(--ink); font-family: var(--de); font-weight: 600; }

/* Le mot à mot : chaque mot allemand au-dessus de sa traduction */
.gloss {
  display: flex;
  flex-wrap: wrap;
  gap: .625rem .875rem;
  background: var(--surface-2);
  border-radius: var(--edge);
  padding: .75rem;
  margin-top: .875rem;
}
.gloss > span { display: flex; flex-direction: column; gap: .0625rem; }
.gloss b { font-family: var(--de); font-size: 1.0625rem; font-weight: 600; line-height: 1.2; }
.gloss i { font-style: normal; font-size: .75rem; color: var(--ink-3); line-height: 1.2; }
.gloss-say { display: flex; align-items: center; margin-top: .875rem; gap: .5rem; }
.gloss-say .t { font-size: .75rem; color: var(--ink-3); }

/* Tableau de conjugaison */
.conj {
  width: 100%;
  border-collapse: collapse;
  font-size: .9375rem;
  margin-top: .875rem;
}
.conj td { padding: .3125rem .5rem .3125rem 0; border-bottom: 1px solid var(--line); }
.conj td:first-child { color: var(--ink-3); width: 7.5rem; }
.conj td:last-child { font-family: var(--de); font-weight: 600; }
.scroll-x { overflow-x: auto; }

/* Bouton écouter — masqué tant qu'aucune voix allemande n'est disponible */
.say {
  display: none;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 1.75rem; height: 1.75rem;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--edge);
  background: var(--surface);
  color: var(--ink-3);
  font-size: .625rem;
  line-height: 1;
}
body.has-tts .say { display: inline-flex; }
.say:hover { color: var(--accent); border-color: var(--accent); }

/* Exemples : l'allemand en serif, le français en dessous */
.ex { border-left: 3px solid var(--accent); padding-left: .75rem; }
.ex + .ex { margin-top: .875rem; }
.ex .top-line { display: flex; align-items: center; gap: .5rem; }
.ex .d { font-family: var(--de); font-size: 1.0625rem; line-height: 1.4; flex: 1; }
.ex .f { font-size: .875rem; color: var(--ink-3); margin-top: .125rem; }

/* Liste de vocabulaire */
.voc { list-style: none; margin: .25rem 0 0; padding: 0; display: flex; flex-direction: column; }
.voc li {
  display: flex;
  align-items: center;
  gap: .625rem;
  padding: .5rem 0;
  border-bottom: 1px solid var(--line);
}
.voc li:last-child { border-bottom: 0; }
.voc .w { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.voc .d { font-family: var(--de); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.voc .p { font-size: .6875rem; color: var(--ink-3); letter-spacing: .02em; }
.voc .f { font-size: .875rem; color: var(--ink-3); text-align: right; max-width: 45%; }

/* ---------- Flashcards ---------- */
.flash {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--edge);
  min-height: 14rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: 1.5rem 1rem;
  text-align: center;
  width: 100%;
}
.flash .front { font-family: var(--de); font-size: 1.75rem; font-weight: 600; line-height: 1.25; }
.flash .p     { font-size: .8125rem; color: var(--ink-3); letter-spacing: .02em; }
.flash .trad  { font-size: 1.125rem; color: var(--accent); font-weight: 700; margin-top: .5rem; }
.flash .tip   { font-size: .75rem; color: var(--ink-3); }
.flash .ask   { font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
.flash .sol   { font-family: var(--de); font-size: 1.625rem; font-weight: 600; color: var(--accent); }

/* Saisie de la réponse, à partir du niveau 3.
   Sur iPhone, la correction automatique remplacerait les mots allemands par
   des mots français : elle est coupée, ainsi que la majuscule automatique.
   La comparaison ignore la casse, donc rien n'est perdu. */
.answer {
  width: 100%;
  box-sizing: border-box;
  font-family: var(--de);
  font-size: 1.375rem;
  font-weight: 600;
  text-align: center;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--edge);
  padding: .875rem .75rem;
}
.answer:focus { outline: none; border-color: var(--accent); }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--edge);
  padding: .8125rem .75rem;
  font-weight: 800;
  font-size: .9375rem;
  transition: background .12s ease;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.miss { border-color: var(--bad); color: var(--bad); }
.btn.miss:hover { background: var(--bad-soft); }
.btn.hit  { border-color: var(--good); color: var(--good); }
.btn.hit:hover { background: var(--good-soft); }
.btn.wide { width: 100%; }

/* ---------- Questions (quiz et mini-questions d'étape) ---------- */
.q { font-size: 1.0625rem; font-weight: 700; margin: 0; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: .5rem; }
.opt {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--edge);
  padding: .75rem .875rem;
  font-size: .9375rem;
  transition: background .12s ease;
}
.opt:hover:not(:disabled) { background: var(--surface-2); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); font-weight: 700; }
.opt.wrong { border-color: var(--bad);  background: var(--bad-soft); }
.why {
  font-size: .875rem;
  color: var(--ink-2);
  background: var(--surface-2);
  border-radius: var(--edge);
  padding: .625rem .75rem;
}
.why b { color: var(--ink); font-family: var(--de); font-weight: 600; }
.why.good { color: var(--good); background: var(--good-soft); }
.why.bad  { color: var(--bad);  background: var(--bad-soft); }
.why.good b, .why.bad b { color: inherit; }

.meter { display: flex; gap: .25rem; }
.meter i {
  flex: 1;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
}
.meter i.on  { background: var(--accent); }
.meter i.err { background: var(--bad); }

.score { text-align: center; padding: 1rem 0; }
.score b {
  display: block;
  font-size: 3rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.04em;
  line-height: 1;
}
.score span { color: var(--ink-3); font-size: .9375rem; }

.tools { display: flex; flex-wrap: wrap; gap: .5rem; }
.tool {
  background: none;
  border: 1px solid var(--line);
  border-radius: var(--edge);
  padding: .4375rem .625rem;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.tool:hover { color: var(--ink); border-color: var(--ink-3); }
.tool.danger:hover { color: var(--bad); border-color: var(--bad); }
.msg { font-size: .8125rem; color: var(--ink-2); }
.warn {
  font-size: .8125rem;
  color: var(--ink-2);
  background: var(--bad-soft);
  border-left: 3px solid var(--bad);
  padding: .625rem .75rem;
}

/* ---------- Rapport d'auto-test (index.html#test) ---------- */
.t-sum {
  font-size: 2.25rem;
  font-weight: 800;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  margin: .25rem 0;
}
.t-row {
  display: flex;
  gap: .625rem;
  align-items: baseline;
  padding: .375rem 0;
  border-bottom: 1px solid var(--line);
  font-size: .875rem;
}
.t-row:last-child { border-bottom: 0; }
.t-tag {
  flex: 0 0 auto;
  font-size: .625rem;
  font-weight: 800;
  letter-spacing: .08em;
  padding: .0625rem .3125rem;
  border-radius: var(--edge);
}
.t-tag.ok { background: var(--good-soft); color: var(--good); }
.t-tag.ko { background: var(--bad-soft);  color: var(--bad); }
.t-row .d { color: var(--ink-3); font-size: .75rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1 class="wordmark">Deutsch Täglich <small>A1</small></h1>
    <span class="streak" id="streak" hidden></span>
  </header>
  <main id="view"></main>
</div>

<script>
"use strict";

/* ===============================================================
   1. LE COURS
   Un jour = un objet. Une leçon = une suite d'ETAPES courtes.
   Chaque étape porte une idée, et parfois une mini-question qu'il
   faut résoudre avant de continuer : c'est ce qui empêche de lire
   sans comprendre.
     idea   : l'idée, en une phrase simple
     detail : une ou deux phrases de plus (facultatif)
     gloss  : le mot à mot — de[] et fr[] ont TOUJOURS la même longueur
     table  : deux colonnes (conjugaison, récapitulatif)
     check  : la mini-question (facultatif)
   =============================================================== */
const COURSE = [

/* ------------------------------- JOUR 1 ------------------------------- */
{
  day: 1, title: "Se présenter", de: "Guten Tag!",
  steps: [
    {
      idea: "« Je » se dit ich.",
      detail: "Le <b>ch</b> de la fin ne se prononce pas comme en français : c'est un souffle, comme si tu chuchotais un h. Appuie sur écouter.",
      gloss: { de: ["Ich", "lerne", "Deutsch"], fr: ["Je", "apprends", "l'allemand"] }
    },
    {
      idea: "Le verbe « être » change de forme selon la personne.",
      detail: "Exactement comme en français : je suis, tu es, il est. Il n'y a rien de nouveau ici, juste des mots à retenir.",
      table: [["ich", "bin"], ["du", "bist"], ["er / sie / es", "ist"], ["wir", "sind"], ["ihr", "seid"], ["sie / Sie", "sind"]],
      check: { q: "« Tu es » se dit…", o: ["du bist", "du bin", "du ist"], a: 0, why: "Avec <b>du</b>, la forme est toujours <b>bist</b>." }
    },
    {
      idea: "Pour donner ton nom, deux formules au choix.",
      gloss: { de: ["Ich", "heiße", "Anna"], fr: ["Je", "m'appelle", "Anna"] },
      detail: "Plus court et tout aussi correct : <b>Ich bin Anna</b>. Le <b>ß</b> se prononce comme un s dur ; si ton clavier n'en a pas, écris <b>ss</b>."
    },
    {

];

const TOTAL_PLANNED = 30; // objectif du cours complet

/* ===============================================================
   2. L'ÉTAT
   =============================================================== */
const KEY = "deutsch-taeglich-v1";
/* Espacement des révisions, en jours.
   Les niveaux 1 et 2 valent 0 : ce sont des étapes d'apprentissage, elles se
   franchissent dans la même séance. Le vrai espacement commence au niveau 3 —
   celui où le mot ne se reconnaît plus mais s'écrit. */
const INTERVALS = { 1: 0, 2: 0, 3: 1, 4: 4, 5: 16 };

let storageOK = true;
let S = load();

function fresh() {
  // qmiss : nombre de fois où chaque question de quiz a été ratée, clé "jour:index".
  return { day: 1, done: [], cards: {}, streak: 0, last: null, scores: {}, qmiss: {} };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(fresh(), JSON.parse(raw));
  } catch (e) { storageOK = false; }
  return fresh();
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { storageOK = false; }
}

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function shift(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d + days);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}

function touchStreak() {
  const t = today();
  if (S.last === t) return;
  S.streak = (S.last === shift(t, -1)) ? S.streak + 1 : 1;
  S.last = t;
  persist();
  paintStreak();
}

function seed(dayNo) {
  const lesson = COURSE[dayNo - 1];
  if (!lesson) return;
  let added = false;
  lesson.vocab.forEach(function (v, i) {
    const id = dayNo + ":" + i;
    if (!S.cards[id]) { S.cards[id] = { box: 1, due: today(), hit: 0, miss: 0 }; added = true; }
  });
  if (added) persist();
}

/* Fragilité d'un mot, entre 0 (toujours su) et 1 (toujours raté).
   Un mot jamais révisé vaut 0.5 : il mérite plus d'attention qu'un mot
   toujours réussi, mais moins qu'un mot réellement raté. */
function weakness(id) {
  const c = S.cards[id] || {};
  const hit = c.hit || 0, miss = c.miss || 0;
  if (hit + miss === 0) return 0.5;
  return miss / (hit + miss);
}
function cardById(id) {
  const parts = id.split(":").map(Number);
  const lesson = COURSE[parts[0] - 1];
  if (!lesson || !lesson.vocab[parts[1]]) return null;
  return Object.assign({ id: id, day: parts[0] }, lesson.vocab[parts[1]]);
}
/* Le paquet du jour, dans un ordre différent à chaque session. */
function dueCards() {
  const t = today();
  const ids = Object.keys(S.cards).filter(function (id) {
    return S.cards[id].due <= t && cardById(id);
  });
  return shuffleIdx(ids.length).map(function (i) { return cardById(ids[i]); });
}

/* L'entraînement libre : réviser quand rien n'est dû, sans attendre demain.
   Les mots les plus ratés d'abord, mais tirés dans un vivier deux fois plus
   grand que nécessaire — sinon deux entraînements de suite donneraient
   exactement la même liste. */
function practiceCards(n) {
  const ids = Object.keys(S.cards).filter(function (id) { return !!cardById(id); });
  if (!ids.length) return [];
  ids.sort(function (a, b) { return weakness(b) - weakness(a); });

  // La moitié la plus fragile est TOUJOURS reprise — c'est le but de
  // l'entraînement. L'autre moitié est tirée dans un vivier plus large, pour
  // que deux séances de suite ne donnent pas exactement la même liste.
  const keep = Math.min(ids.length, Math.ceil(n / 2));
  const head = ids.slice(0, keep);
  const want = Math.min(n, ids.length) - keep;
  const rest = ids.slice(keep, keep + want * 2);
  const extra = shuffleIdx(rest.length).slice(0, want).map(function (i) { return rest[i]; });

  const chosen = head.concat(extra);
  return shuffleIdx(chosen.length).map(function (i) { return cardById(chosen[i]); });
}

/* Un mot déjà su, tiré au hasard. Sert à ne pas finir une session en boucle
   sur ses seules erreurs : chaque mot raté revient accompagné de celui-ci. */
function pickEasy(excludeId) {
  const ids = Object.keys(S.cards).filter(function (id) {
    return id !== excludeId && cardById(id) && weakness(id) < 0.5;
  });
  if (!ids.length) return null;
  return cardById(ids[shuffleIdx(ids.length)[0]]);
}

/* schedule === false : on note la réponse sans toucher au calendrier.
   C'est le mode entraînement — réviser en avance ne doit pas dérégler
   l'espacement calculé par la méthode Leitner. */
function grade(id, ok, schedule) {
  const c = S.cards[id];
  if (!c) return;
  // Le journal, lui, compte toujours : c'est lui qui repère les mots fragiles.
  if (ok) c.hit = (c.hit || 0) + 1;
  else    c.miss = (c.miss || 0) + 1;
  if (schedule !== false) {
    // Bonne réponse : un cran de plus. Ratée : un cran de moins, jamais la
    // chute complète — perdre quinze jours de travail sur un mot hésitant
    // décourage plus que ça n'apprend.
    c.box = ok ? Math.min(5, c.box + 1) : Math.max(1, c.box - 1);
    c.due = shift(today(), INTERVALS[c.box]);
  }
  persist();
}
function learnedCount() {
  return Object.keys(S.cards).filter(function (id) { return S.cards[id].box >= 4; }).length;
}
/* Mots réellement fragiles : ratés au moins une fois, et au moins une fois
   sur trois. C'est ce chiffre qui dit sur quoi il reste du travail. */
function shakyCount() {
  return Object.keys(S.cards).filter(function (id) {
    return (S.cards[id].miss || 0) > 0 && weakness(id) >= 1 / 3;
  }).length;
}

/* ===============================================================
   3. LA VOIX — prononciation par le navigateur, sans fichier audio
   Les boutons restent masqués tant qu'aucune voix allemande n'est
   installée sur l'appareil : mieux vaut rien qu'un bouton muet.
   =============================================================== */
const TTS = { voice: null };

function initTTS() {
  if (!("speechSynthesis" in window)) return;
  function pick() {
    let list = [];
    try { list = window.speechSynthesis.getVoices() || []; } catch (e) { return; }
    TTS.voice = list.filter(function (v) { return /^de/i.test(v.lang); })[0] || null;
    document.body.classList.toggle("has-tts", !!TTS.voice);
  }
  pick();
  try { window.speechSynthesis.addEventListener("voiceschanged", pick); } catch (e) {}
}

function speak(text) {
  if (!TTS.voice || !("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = TTS.voice;
    u.lang = TTS.voice.lang;
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ===============================================================
   4. RENDU
   =============================================================== */
const view = document.getElementById("view");
const streakEl = document.getElementById("streak");

function esc(s) {
  return String(s).replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; });
}
function att(s) {
  return esc(s).replace(/"/g, "&quot;");
}
function sayBtn(text) {
  return '<button class="say" data-say="' + att(text) + '" aria-label="Écouter">&#9654;</button>';
}
function paintStreak() {
  if (S.streak > 0) {
    streakEl.hidden = false;
    streakEl.textContent = S.streak + (S.streak > 1 ? " jours d'affilée" : " jour");
  } else {
    streakEl.hidden = true;
  }
}
function show(html) {
  view.innerHTML = html;
  window.scrollTo(0, 0);
  // L'oral : la phrase est prononcée dès l'affichage. Avant le focus, sinon
  // l'ouverture du clavier peut couper le début.
  const auto = view.querySelector("[data-autosay]");
  if (auto) speak(auto.getAttribute("data-autosay"));
  // Carte à écrire : le clavier s'ouvre tout de suite, ça évite un appui.
  const field = view.querySelector("#answer");
  if (field) { try { field.focus(); } catch (e) {} }
}
function backBar(label) {
  return '<button class="back" data-go="home">&#8592; ' + label + '</button>';
}
function glossHTML(g) {
  const cells = g.de.map(function (w, i) {
    return '<span><b>' + esc(w) + '</b><i>' + esc(g.fr[i]) + '</i></span>';
  }).join("");
  return '<div class="gloss">' + cells + '</div>' +
         '<div class="gloss-say">' + sayBtn(g.de.join(" ")) + '<span class="t">Écouter la phrase</span></div>';
}
function tableHTML(rows) {
  return '<div class="scroll-x"><table class="conj"><tbody>' +
    rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join("") +
    '</tbody></table></div>';
}

/* Mélange (Fisher-Yates) — renvoie les indices 0..n-1 dans un ordre au hasard.
   Seul l'ORDRE D'AFFICHAGE change : chaque bouton garde son index d'origine
   dans data-pick / data-scheck. Le calcul du score, comme l'auto-test,
   continue donc de raisonner sur le fichier et pas sur l'écran. */
function shuffleIdx(n) {
  const a = [];
  for (let i = 0; i < n; i++) a.push(i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* Un jour est atteignable s'il est déjà fait, ou s'il suit immédiatement
   les jours validés. Sert aux pastilles de l'accueil et aux boutons de leçon. */
function reachable(n) {
  return n >= 1 && n <= COURSE.length &&
         (S.done.indexOf(n) !== -1 || n <= Math.max(1, S.done.length + 1));
}

/* ---------- Accueil ---------- */
function home() {
  seed(S.day);

  const lesson = COURSE[S.day - 1];
  const due = dueCards().length;
  const doneToday = S.done.indexOf(S.day) !== -1;

  let stations = "";
  for (let n = 1; n <= COURSE.length; n++) {
    const cls = S.done.indexOf(n) !== -1 ? "done" : (n === S.day ? "now" : "soon");
    stations += '<button class="station ' + cls + '" data-day="' + n + '" aria-label="Jour ' + n + '">' +
                '<span class="dot"></span><span class="n">' + n + '</span></button>';
  }

  const finished = S.done.length >= COURSE.length;

  return [
    '<div class="stack">',

      '<div class="stack-s">',
        '<span class="label">Progression &#183; ' + S.done.length + ' / ' + COURSE.length + ' jours &#183; ' + TOTAL_PLANNED + ' prévus</span>',
        '<div class="line">' + stations + '</div>',
      '</div>',

      '<div class="plate">',
        '<div class="num"><b>' + S.day + '</b></div>',
        '<div>',
          '<span class="label">' + (doneToday ? 'Jour terminé' : 'Jour en cours') + '</span>',
          '<h2>' + esc(lesson.title) + '</h2>',
          '<p class="de">' + esc(lesson.de) + '</p>',
        '</div>',
      '</div>',

      '<div class="modes">',
        '<button class="mode" data-go="lesson">',
          '<div class="txt"><strong>La leçon</strong><span>' + lesson.steps.length + ' étapes courtes, ' + lesson.vocab.length + ' mots</span></div>',
          '<span class="chip">' + lesson.steps.length + '</span>',
        '</button>',
        // Rien à réviser n'est plus un cul-de-sac : on bascule sur l'entraînement
        // libre, qui travaille les mots les plus ratés sans toucher au calendrier.
        '<button class="mode" data-go="' + (due === 0 ? 'practice' : 'cards') + '">',
          '<div class="txt"><strong>Les cartes</strong><span>' +
            (due === 0 ? 'Rien d\'obligatoire aujourd\'hui — entraîne-toi si tu veux' : 'Révision espacée du vocabulaire') +
          '</span></div>',
          '<span class="chip' + (due > 0 ? ' hot' : '') + '">' + (due > 0 ? due : 'libre') + '</span>',
        '</button>',
        // Toujours actif : les voix de l'appareil arrivent parfois après le
        // premier affichage. C'est l'écran lui-même qui explique s'il en manque.
        '<button class="mode" data-go="oral">',
          '<div class="txt"><strong>L\'oral</strong><span>Écoute seule — écris ou traduis ce qui est dit</span></div>',
          '<span class="chip">' + ORAL_SIZE + '</span>',
        '</button>',
        '<button class="mode" data-go="quiz">',
          '<div class="txt"><strong>Le quiz</strong><span>' + (doneToday ? 'Refaire le test du jour ' + S.day : 'Valide le jour ' + S.day + ' et débloque la suite') + '</span></div>',
          '<span class="chip' + (doneToday ? ' ok' : '') + '">' + (S.scores[S.day] != null ? S.scores[S.day] + '/' + lesson.quiz.length : lesson.quiz.length) + '</span>',
        '</button>',
      '</div>',

      // Le jour est fini mais l'envie est là : on ne renvoie pas à demain.
      (doneToday && reachable(S.day + 1)
        ? '<button class="btn primary wide" data-lesson="' + (S.day + 1) + '">Enchaîner sur le jour ' + (S.day + 1) + '</button>'
        : ''),

      finished ? '<div class="card"><span class="label">Fin de la série</span><p class="msg" style="margin:.5rem 0 0">Tu as terminé les ' + COURSE.length + ' jours écrits. Demande-moi la suite — le contenu s\'ajoute dans un seul fichier.</p></div>' : '',

      !storageOK ? '<p class="warn">Ton navigateur bloque le stockage local : la progression ne sera pas conservée après fermeture. Essaie hors navigation privée.</p>' : '',

      '<div class="stack-s">',
        '<h3 class="sec">Ma progression</h3>',
        '<p class="msg">' + Object.keys(S.cards).length + ' mots en circulation &#183; ' + learnedCount() + ' bien ancrés &#183; ' +
          shakyCount() + ' fragiles &#183; série de ' + S.streak + ' jour' + (S.streak > 1 ? 's' : '') + '</p>',
        '<div class="tools">',
          '<button class="tool" data-act="export">Sauvegarder</button>',
          '<button class="tool" data-act="import">Restaurer</button>',
          '<button class="tool danger" data-act="reset">Tout effacer</button>',
        '</div>',
        '<p class="msg" id="toolmsg"></p>',
      '</div>',

    '</div>'
  ].join("");
}

/* ---------- La leçon, étape par étape ---------- */
let stepIdx = 0, stepPick = null, stepPerm = null;

/* Se placer sur une étape. L'ordre des réponses est figé ICI, une fois :
   sinon elles se remélangeraient à chaque redessin — en particulier
   juste après avoir répondu, ce qui serait illisible. */
function setStep(i) {
  stepIdx = i;
  stepPick = null;
  const l = COURSE[S.day - 1];
  const st = l && l.steps[i];
  stepPerm = (st && st.check) ? shuffleIdx(st.check.o.length) : null;
}

function lessonView() {
  seed(S.day);
  setStep(0);
  return renderStep();
}

function renderStep() {
  const l = COURSE[S.day - 1];
  if (stepIdx >= l.steps.length) return renderRecap();

  const st = l.steps[stepIdx];
  const answered = stepPick !== null;

  let body = '<p class="step-idea">' + esc(st.idea) + '</p>';
  if (st.detail) body += '<p class="step-detail">' + st.detail + '</p>';
  if (st.gloss)  body += glossHTML(st.gloss);
  if (st.table)  body += tableHTML(st.table);

  let quest = "";
  if (st.check) {
    const order = stepPerm || st.check.o.map(function (_, i) { return i; });
    const opts = order.map(function (i) {
      let cls = "opt";
      if (answered) {
        if (i === st.check.a) cls += " right";
        else if (i === stepPick) cls += " wrong";
      }
      return '<button class="' + cls + '" data-scheck="' + i + '"' + (answered ? " disabled" : "") + '>' + esc(st.check.o[i]) + '</button>';
    }).join("");
    quest = [
      '<div class="card">',
        '<h3 class="sec">À toi</h3>',
        '<p class="q" style="margin-top:.75rem">' + esc(st.check.q) + '</p>',
        '<div class="opts" style="margin-top:.75rem">' + opts + '</div>',
        answered ? '<div class="why" style="margin-top:.75rem">' + st.check.why + '</div>' : '',
      '</div>'
    ].join("");
  }

  // Sans mini-question, on peut continuer tout de suite.
  // Avec, il faut avoir répondu : c'est ce qui empêche de survoler.
  const canGo = !st.check || answered;
  const nav = stepIdx === 0
    ? (canGo ? '<button class="btn primary wide" data-act="step-next">Continuer</button>' : '')
    : '<div class="pair"><button class="btn" data-act="step-back">Précédent</button>' +
      (canGo ? '<button class="btn primary" data-act="step-next">Continuer</button>' : '<button class="btn" disabled>Réponds d\'abord</button>') +
      '</div>';

  return [
    backBar('Accueil'),
    '<div class="stack">',
      '<div class="stack-s">',
        '<span class="label">Jour ' + S.day + ' &#183; ' + esc(l.title) + ' &#183; étape ' + (stepIdx + 1) + ' sur ' + l.steps.length + '</span>',
        '<div class="meter">' + l.steps.map(function (_, i) {
          return '<i class="' + (i <= stepIdx ? 'on' : '') + '"></i>';
        }).join("") + '</div>',
      '</div>',
      '<div class="card">' + body + '</div>',
      quest,
      nav,
    '</div>'
  ].join("");
}

/* Fin de la leçon : les phrases, puis les mots, puis le quiz. */
function renderRecap() {
  const l = COURSE[S.day - 1];
  touchStreak();

  const ex = l.examples.map(function (e) {
    return '<div class="ex"><div class="top-line"><span class="d">' + esc(e.d) + '</span>' + sayBtn(e.d) + '</div>' +
           '<div class="f">' + esc(e.f) + '</div></div>';
  }).join("");

  const voc = l.vocab.map(function (v) {
    return '<li>' + sayBtn(v.d) +
      '<span class="w"><span class="d">' + esc(v.d) + '</span><span class="p">' + esc(v.p) + '</span></span>' +
      '<span class="f">' + esc(v.f) + '</span></li>';
  }).join("");

  return [
    backBar('Accueil'),
    '<div class="stack">',
      '<div class="plate">',
        '<div class="num"><b>' + S.day + '</b></div>',
        '<div><span class="label">Leçon terminée</span><h2>' + esc(l.title) + '</h2><p class="de">' + esc(l.de) + '</p></div>',
      '</div>',
      '<div class="card"><h3 class="sec">Des phrases entières</h3><div style="margin-top:.875rem">' + ex + '</div></div>',
      '<div class="card"><h3 class="sec">Les mots du jour</h3><ul class="voc">' + voc + '</ul></div>',
      '<div class="pair">',
        '<button class="btn" data-act="step-restart">Revoir</button>',
        '<button class="btn primary" data-go="quiz">Passer au quiz</button>',
      '</div>',
      S.day > 1 ? '<button class="btn wide" data-lesson="' + (S.day - 1) + '">Revenir au jour ' + (S.day - 1) + '</button>' : '',
    '</div>'
  ].join("");
}

/* ---------- Comparaison d'une réponse écrite ----------
   Tolérant sur la forme, strict sur le mot. On accepte l'orthographe de
   dépannage utilisée quand le clavier n'a pas les touches allemandes
   (ae pour ä, ss pour ß), et on ignore la casse : sur téléphone, la
   majuscule automatique se déclenche de toute façon toute seule. */
const ARTICLES = ["der", "die", "das"];

function normDE(s) {
  return String(s)
    .toLowerCase()
    .replace(/ß/g, "ss")
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
    .replace(/[.,!?;:'"()\[\]-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function splitArticle(norm) {
  const parts = norm.split(" ");
  if (parts.length > 1 && ARTICLES.indexOf(parts[0]) !== -1) {
    return { art: parts[0], rest: parts.slice(1).join(" ") };
  }
  return { art: null, rest: norm };
}

/* Renvoie { ok, kind }. Le genre compte : oublier l'article passe, en
   mettre un faux non — c'est justement ce qui s'apprend mal tout seul. */
function checkAnswer(typed, expected) {
  const t = normDE(typed), e = normDE(expected);
  if (!t) return { ok: false, kind: "empty" };
  if (t === e) return { ok: true, kind: "exact" };

  const ts = splitArticle(t), es = splitArticle(e);
  if (ts.rest === es.rest) {
    if (es.art && !ts.art) return { ok: true, kind: "no-article" };
    if (es.art && ts.art)  return { ok: false, kind: "bad-article" };
    return { ok: true, kind: "exact" };
  }
  return { ok: false, kind: "wrong" };
}

/* ---------- Comparaison d'une traduction française ----------
   Bien plus lâche que le contrôle de l'allemand : ici on vérifie qu'on a
   COMPRIS, pas qu'on sait écrire le français. Accents, ponctuation, article
   et précision entre parenthèses sont tous facultatifs — « salut » suffit
   pour « salut (en partant) ». */
const FR_ARTICLES = ["le", "la", "les", "l", "un", "une", "des", "du"];

function normFR(s) {
  return String(s)
    .toLowerCase()
    .replace(/[àâä]/g, "a").replace(/[éèêë]/g, "e").replace(/[îï]/g, "i")
    .replace(/[ôö]/g, "o").replace(/[ùûü]/g, "u").replace(/ç/g, "c")
    .replace(/[.,!?;:'’"()\[\]-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function stripFR(n) {
  const parts = n.split(" ");
  if (parts.length > 1 && FR_ARTICLES.indexOf(parts[0]) !== -1) return parts.slice(1).join(" ");
  return n;
}
function checkFR(typed, expected) {
  const t = normFR(typed);
  if (!t) return { ok: false, kind: "empty" };
  const full = normFR(expected);
  const core = normFR(String(expected).replace(/\([^)]*\)/g, " "));
  if (t === full || t === core) return { ok: true, kind: "exact" };
  if (stripFR(t) === stripFR(full) || stripFR(t) === stripFR(core)) return { ok: true, kind: "exact" };
  return { ok: false, kind: "wrong" };
}

/* ---------- Cartes ----------
   Deux modes sur le même écran :
   - la révision du jour (Leitner), qui fait avancer le calendrier ;
   - l'entraînement libre, qui n'y touche pas — pour pouvoir travailler
     plus un jour où on a le temps, sans dérégler l'espacement. */
let deck = [], pos = 0, revealed = false, training = false, deckCap = 0, verdict = null;
let passes = {};   // combien de fois chaque mot est déjà passé dans CETTE séance

const PRACTICE_SIZE = 10;
/* Un même mot ne repasse pas indéfiniment dans une séance, même en le ratant. */
const MAX_PASSES = 5;
/* À partir de ce niveau, le mot ne se reconnaît plus : il s'écrit.
   Le niveau 1 est la seule vue « gratuite » — et le mot a déjà été présenté
   dans la leçon avant d'arriver ici. Dès le second passage, on l'écrit. */
const WRITE_FROM_BOX = 2;

function startDeck(cards, isTraining) {
  deck = cards;
  pos = 0;
  revealed = false;
  verdict = null;
  training = isTraining;
  passes = {};
  // Les mots repassent dans la séance — pour monter de niveau, ou parce
  // qu'ils ont été ratés. Sans plafond, une mauvaise séance n'aurait pas de fin.
  deckCap = cards.length * 4 + 8;
  return renderCard();
}
function cardsView()    { return startDeck(dueCards(), false); }
function practiceView() { return startDeck(practiceCards(PRACTICE_SIZE), true); }

function renderCard() {
  if (pos >= deck.length) {
    touchStreak();
    const n = deck.length;
    let msg;
    if (n === 0) msg = 'Aucun mot à réviser pour l\'instant. Fais une leçon pour en apprendre de nouveaux.';
    else if (training) msg = 'Entraînement : le calendrier de révision n\'a pas bougé, mais tes erreurs sont notées.';
    else msg = 'Les mots sus s\'espacent, les mots hésitants redescendent d\'un niveau.';

    return [
      backBar('Accueil'),
      '<div class="stack">',
        '<div class="score"><b>' + n + '</b><span>carte' + (n > 1 ? 's passées' : ' passée') + '. ' + msg + '</span></div>',
        Object.keys(S.cards).length ? '<button class="btn wide" data-go="practice">Encore un tour</button>' : '',
        '<button class="btn primary wide" data-go="home">Retour à l\'accueil</button>',
      '</div>'
    ].join("");
  }

  const c = deck[pos];
  const st = S.cards[c.id];
  const left = deck.length - pos - 1;
  const tag = training
    ? (st.miss ? 'entraînement &#183; raté ' + st.miss + ' fois' : 'entraînement')
    : 'niveau ' + st.box + '/5';

  return [
    backBar('Accueil'),
    '<div class="stack">',
      '<div class="stack-s">',
        // Pas de total : il grandit en cours de route, puisqu'un mot qui monte
        // de niveau repasse dans la séance. « Encore N » ne ment jamais.
        '<span class="label">' + (left > 0 ? 'Encore ' + left : 'Dernière carte') +
          ' &#183; jour ' + c.day + ' &#183; ' + tag + '</span>',
        '<div class="meter">' + deck.map(function (_, i) { return '<i class="' + (i < pos ? 'on' : '') + '"></i>'; }).join("") + '</div>',
      '</div>',

      st.box >= WRITE_FROM_BOX ? writeBody(c) : revealBody(c),
    '</div>'
  ].join("");
}

/* Mot encore neuf : on le montre, on se teste dans sa tête. */
function revealBody(c) {
  return [
    '<div class="flash">',
      '<div class="front">' + esc(c.d) + '</div>',
      revealed ? '<div class="p">' + esc(c.p) + '</div>' : '',
      sayBtn(c.d),
      revealed
        ? '<div class="trad">' + esc(c.f) + '</div>'
        : '<div class="tip">Traduis dans ta tête, puis révèle.</div>',
    '</div>',
    revealed
      ? '<div class="pair"><button class="btn miss" data-grade="0">Raté</button><button class="btn hit" data-grade="1">Je savais</button></div>'
      : '<button class="btn primary wide" data-act="reveal">Révéler</button>'
  ].join("");
}

/* Mot connu : on part du français et on écrit l'allemand. C'est le seul
   sens qui apprenne l'orthographe — et le bouton « écouter » n'apparaît
   qu'après la réponse, sinon il la donnerait. */
function writeBody(c) {
  if (!verdict) {
    return [
      '<div class="flash">',
        '<div class="ask">' + esc(c.f) + '</div>',
        '<div class="tip">Écris le mot en allemand.</div>',
      '</div>',
      '<input class="answer" id="answer" type="text" enterkeyhint="done"',
        ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"',
        ' aria-label="Ta réponse en allemand">',
      '<div class="pair">',
        '<button class="btn" data-act="dunno">Je ne sais pas</button>',
        '<button class="btn primary" data-act="check-word">Vérifier</button>',
      '</div>'
    ].join("");
  }

  let note;
  if (verdict.kind === "exact")            note = "Exact.";
  else if (verdict.kind === "no-article")  note = "Juste. Pense à l'article : <b>" + esc(c.d) + "</b>.";
  else if (verdict.kind === "bad-article") note = "Le mot est bon, mais pas le genre : c'est <b>" + esc(c.d) + "</b>.";
  else if (verdict.kind === "dunno")       note = "Pas grave — ce mot va revenir vite.";
  else if (verdict.kind === "empty")       note = "Rien d'écrit.";
  else                                     note = "Ce n'était pas ça.";

  return [
    '<div class="flash">',
      '<div class="ask">' + esc(c.f) + '</div>',
      '<div class="sol">' + esc(c.d) + '</div>',
      '<div class="p">' + esc(c.p) + '</div>',
      sayBtn(c.d),
      verdict.typed ? '<div class="tip">Tu as écrit : ' + esc(verdict.typed) + '</div>' : '',
    '</div>',
    '<div class="why ' + (verdict.ok ? "good" : "bad") + '">' + note + '</div>',
    '<button class="btn primary wide" data-act="card-next">Continuer</button>'
  ].join("");
}

/* Passe à la carte suivante, quel que soit le mode qui a jugé la réponse. */
function advanceCard(ok) {
  const cur = deck[pos];
  grade(cur.id, ok, !training);

  passes[cur.id] = (passes[cur.id] || 0) + 1;
  const room = deck.length < deckCap && passes[cur.id] < MAX_PASSES;

  if (room && !ok) {
    deck.push(cur);                       // le mot raté repasse en fin de paquet
    const easy = pickEasy(cur.id);        // accompagné d'un mot déjà su, pour ne pas
    if (easy) deck.push(easy);            // terminer en boucle sur ses seules erreurs
  } else if (room && !training && S.cards[cur.id].box <= WRITE_FROM_BOX) {
    // Étapes d'apprentissage : le mot repasse dans la même séance pour monter
    // d'un cran. Le seuil est « <= » et non « < » : un mot qui vient d'atteindre
    // le niveau où il s'écrit doit être écrit AU MOINS UNE FOIS le jour même,
    // sinon le monter n'aurait rien appris.
    deck.push(cur);
  }

  pos++; revealed = false; verdict = null;
  show(renderCard());
}

/* ---------- Quiz ---------- */
let qi = 0, qScore = 0, qLog = [], answered = false;
/* qOrder[position] = l'index de la question dans le fichier
   qPerm[position]  = l'ordre d'affichage de ses réponses
   Tirés une seule fois au démarrage du quiz, pour rester stables ensuite. */
let qOrder = [], qPerm = [];

function quizView() {
  const l = COURSE[S.day - 1];
  qi = 0; qScore = 0; qLog = []; answered = false;
  qOrder = shuffleIdx(l.quiz.length);
  qPerm = qOrder.map(function (src) { return shuffleIdx(l.quiz[src].o.length); });
  return renderQuestion();
}
function renderQuestion() {
  const l = COURSE[S.day - 1];

  if (qi >= l.quiz.length) {
    const d = S.day;                                   // le jour testé, avant tout déblocage
    const passed = qScore >= Math.ceil(l.quiz.length * 0.6);

    S.scores[d] = Math.max(S.scores[d] || 0, qScore);
    if (passed) {
      if (S.done.indexOf(d) === -1) S.done.push(d);
      // On n'avance que si c'était le jour le plus avancé (pas en rejouant un ancien).
      if (d === Math.max.apply(null, S.done) && d < COURSE.length) {
        S.day = d + 1;
        seed(S.day);
      }
    }
    persist();
    touchStreak();

    const need = Math.ceil(l.quiz.length * 0.6);
    const nextOK = reachable(d + 1);

    return [
      backBar('Accueil'),
      '<div class="stack">',
        '<div class="score"><b>' + qScore + '/' + l.quiz.length + '</b><span>' +
          (passed
            ? (d < COURSE.length ? 'Jour validé. Le jour ' + (d + 1) + ' est débloqué.' : 'Jour validé.')
            : 'Il faut ' + need + ' bonnes réponses sur ' + l.quiz.length + ' pour valider. Relis la leçon et retente.') +
        '</span></div>',
        // On repart du jour TESTÉ (d), pas du jour courant : la validation
        // vient peut-être de faire passer S.day au suivant.
        nextOK
          ? '<div class="pair">' +
              '<button class="btn" data-lesson="' + d + '">Revoir le jour ' + d + '</button>' +
              '<button class="btn primary" data-lesson="' + (d + 1) + '">Leçon suivante</button>' +
            '</div>'
          : '<button class="btn wide" data-lesson="' + d + '">Revoir le jour ' + d + '</button>',
        '<button class="btn' + (nextOK ? '' : ' primary') + ' wide" data-go="home">Accueil</button>',
      '</div>'
    ].join("");
  }

  const q = l.quiz[qOrder[qi]];
  const picked = answered ? qLog[qi] : null;

  const opts = qPerm[qi].map(function (i) {
    let cls = "opt";
    if (answered) {
      if (i === q.a) cls += " right";
      else if (i === picked) cls += " wrong";
    }
    return '<button class="' + cls + '" data-pick="' + i + '"' + (answered ? " disabled" : "") + '>' + esc(q.o[i]) + '</button>';
  }).join("");

  return [
    backBar('Accueil'),
    '<div class="stack">',
      '<div class="stack-s">',
        '<span class="label">Quiz &#183; jour ' + S.day + ' &#183; question ' + (qi + 1) + ' sur ' + l.quiz.length + '</span>',
        '<div class="meter">' + l.quiz.map(function (_, i) {
          return '<i class="' + (i < qi || (answered && i === qi) ? (qLog[i] === l.quiz[qOrder[i]].a ? 'on' : 'err') : '') + '"></i>';
        }).join("") + '</div>',
      '</div>',

      '<p class="q">' + esc(q.q) + '</p>',
      '<div class="opts">' + opts + '</div>',
      answered ? '<div class="why">' + q.why + '</div>' : '',
      answered ? '<button class="btn primary wide" data-act="next">' + (qi + 1 >= l.quiz.length ? 'Voir le résultat' : 'Question suivante') + '</button>' : '',
    '</div>'
  ].join("");
}

/* ---------- L'oral ----------
   Aucun texte allemand à l'écran tant qu'on n'a pas répondu : on écoute, et
   on écrit. Deux consignes tirées au sort — réécrire ce qui est dit, ou le
   traduire. Les phrases entières de la leçon viennent s'ajouter aux mots :
   c'est à l'oreille qu'elles servent le plus. */
const ORAL_SIZE = 8;
let oral = [], oi = 0, oralVerdict = null;

function oralItems(n) {
  const l = COURSE[S.day - 1];
  const pool = [];
  l.vocab.forEach(function (v, i) {
    pool.push({ de: v.d, fr: v.f, p: v.p, id: S.day + ":" + i });
  });
  l.examples.forEach(function (e) {
    pool.push({ de: e.d, fr: e.f, p: "", id: null });
  });
  return shuffleIdx(pool.length).slice(0, Math.min(n, pool.length)).map(function (i) {
    return Object.assign({ task: Math.random() < 0.5 ? "write" : "translate" }, pool[i]);
  });
}

function oralView() {
  oral = oralItems(ORAL_SIZE);
  oi = 0;
  oralVerdict = null;
  return renderOral();
}

function renderOral() {
  // Sans voix allemande, ce mode n'a aucun sens : on le dit, plutôt que
  // d'afficher un écran muet où rien ne se passe.
  if (!TTS.voice) {
    return [
      backBar('Accueil'),
      '<div class="stack">',
        '<div class="card">',
          '<span class="label">L\'oral</span>',
          '<p class="msg" style="margin:.5rem 0 0">Cet appareil n\'a pas de voix allemande installée, ' +
            'rien ne peut donc être prononcé.<br><br>Sur iPhone : <b>Réglages → Accessibilité → ' +
            'Contenu énoncé → Voix → Allemand</b>, puis reviens ici.</p>',
        '</div>',
        '<button class="btn primary wide" data-go="home">Retour à l\'accueil</button>',
      '</div>'
    ].join("");
  }

  if (oi >= oral.length) {
    touchStreak();
    const good = oral.filter(function (x) { return x.ok; }).length;
    return [
      backBar('Accueil'),
      '<div class="stack">',
        '<div class="score"><b>' + good + '/' + oral.length + '</b><span>à l\'oreille. ' +
          'Le calendrier de révision n\'a pas bougé, mais tes erreurs sont notées.</span></div>',
        '<button class="btn wide" data-go="oral">Encore un tour</button>',
        '<button class="btn primary wide" data-go="home">Retour à l\'accueil</button>',
      '</div>'
    ].join("");
  }

  const it = oral[oi];
  const head = [
    backBar('Accueil'),
    '<div class="stack">',
      '<div class="stack-s">',
        '<span class="label">L\'oral &#183; ' + (oi + 1) + ' sur ' + oral.length + '</span>',
        '<div class="meter">' + oral.map(function (_, i) {
          return '<i class="' + (i < oi ? (oral[i].ok ? 'on' : 'err') : '') + '"></i>';
        }).join("") + '</div>',
      '</div>'
  ].join("");

  if (!oralVerdict) {
    return head + [
      '<div class="flash">',
        // data-autosay : la phrase est prononcée dès que l'écran s'affiche.
        '<button class="btn primary" data-say="' + att(it.de) + '" data-autosay="' + att(it.de) + '">&#9654;&nbsp; Réécouter</button>',
        '<div class="tip">' + (it.task === "write"
          ? 'Écris en allemand ce que tu entends.'
          : 'Écris en français ce que ça veut dire.') + '</div>',
      '</div>',
      '<input class="answer" id="answer" type="text" enterkeyhint="done"',
        ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"',
        ' aria-label="Ce que tu entends">',
      '<div class="pair">',
        '<button class="btn" data-act="oral-dunno">Je ne sais pas</button>',
        '<button class="btn primary" data-act="oral-check">Vérifier</button>',
      '</div>',
    '</div>'
    ].join("");
  }

  let note;
  if (oralVerdict.kind === "exact")            note = "Exact.";
  else if (oralVerdict.kind === "no-article")  note = "Juste. Pense à l'article : <b>" + esc(it.de) + "</b>.";
  else if (oralVerdict.kind === "bad-article") note = "Le mot est bon, mais pas le genre : c'est <b>" + esc(it.de) + "</b>.";
  else if (oralVerdict.kind === "dunno")       note = "Pas grave — réécoute-la une fois de plus.";
  else if (oralVerdict.kind === "empty")       note = "Rien d'écrit.";
  else                                         note = "Ce n'était pas ça.";

  return head + [
    '<div class="flash">',
      '<div class="sol">' + esc(it.de) + '</div>',
      it.p ? '<div class="p">' + esc(it.p) + '</div>' : '',
      sayBtn(it.de),
      '<div class="trad">' + esc(it.fr) + '</div>',
      oralVerdict.typed ? '<div class="tip">Tu as écrit : ' + esc(oralVerdict.typed) + '</div>' : '',
    '</div>',
    '<div class="why ' + (oralVerdict.ok ? "good" : "bad") + '">' + note + '</div>',
    '<button class="btn primary wide" data-act="oral-next">Continuer</button>',
  '</div>'
  ].join("");
}

/* ===============================================================
   5. NAVIGATION — un seul écouteur pour toute l'app
   =============================================================== */
const ROUTES = {
  home: home, lesson: lessonView, cards: cardsView,
  practice: practiceView, oral: oralView, quiz: quizView
};

function go(name) { show(ROUTES[name]()); }

view.addEventListener("click", function (e) {
  const t = e.target.closest("[data-go],[data-act],[data-pick],[data-grade],[data-day],[data-lesson],[data-say],[data-scheck]");
  if (!t) return;

  if (t.hasAttribute("data-say")) { speak(t.getAttribute("data-say")); return; }

  if (t.dataset.go) { go(t.dataset.go); return; }

  if (t.dataset.day) {
    const n = Number(t.dataset.day);
    if (reachable(n)) { S.day = n; persist(); go("home"); }
    return;
  }

  // Ouvrir directement la leçon d'un jour donné (précédent ou suivant).
  if (t.dataset.lesson) {
    const n = Number(t.dataset.lesson);
    if (reachable(n)) { S.day = n; persist(); go("lesson"); }
    return;
  }

  /* --- étapes de la leçon --- */
  if (t.hasAttribute("data-scheck")) {
    if (stepPick !== null) return;
    stepPick = Number(t.dataset.scheck);
    show(renderStep());
    return;
  }
  if (t.dataset.act === "step-next")    { setStep(stepIdx + 1); show(renderStep()); return; }
  if (t.dataset.act === "step-back")    { setStep(Math.max(0, stepIdx - 1)); show(renderStep()); return; }
  if (t.dataset.act === "step-restart") { setStep(0); show(renderStep()); return; }

  if (t.dataset.act === "reveal") { revealed = true; show(renderCard()); return; }

  if (t.hasAttribute("data-grade")) { advanceCard(t.dataset.grade === "1"); return; }

  if (t.dataset.act === "check-word" || t.dataset.act === "dunno") {
    const inp = document.getElementById("answer");
    const raw = inp ? inp.value : "";
    verdict = (t.dataset.act === "dunno")
      ? { ok: false, kind: "dunno", typed: "" }
      : checkAnswer(raw, deck[pos].d);
    if (t.dataset.act === "check-word") verdict.typed = raw.trim();
    show(renderCard());
    return;
  }

  if (t.dataset.act === "card-next") { advanceCard(!!(verdict && verdict.ok)); return; }

  if (t.dataset.act === "oral-check" || t.dataset.act === "oral-dunno") {
    const inp = document.getElementById("answer");
    const raw = inp ? inp.value : "";
    const it = oral[oi];
    if (t.dataset.act === "oral-dunno") {
      oralVerdict = { ok: false, kind: "dunno", typed: "" };
    } else {
      oralVerdict = it.task === "write" ? checkAnswer(raw, it.de) : checkFR(raw, it.fr);
      oralVerdict.typed = raw.trim();
    }
    it.ok = oralVerdict.ok;
    // Seuls les mots du vocabulaire ont une fiche ; les phrases n'en ont pas.
    // Comme l'entraînement, l'oral nourrit le journal sans toucher au calendrier.
    if (it.id && S.cards[it.id]) grade(it.id, oralVerdict.ok, false);
    show(renderOral());
    return;
  }
  if (t.dataset.act === "oral-next") { oi++; oralVerdict = null; show(renderOral()); return; }

  if (t.hasAttribute("data-pick")) {
    if (answered) return;
    qLog[qi] = Number(t.dataset.pick);
    const src = qOrder[qi];
    if (qLog[qi] === COURSE[S.day - 1].quiz[src].a) qScore++;
    else {
      // Journal : quelle question résiste, et depuis combien de fois.
      const k = S.day + ":" + src;
      S.qmiss[k] = (S.qmiss[k] || 0) + 1;
      persist();
    }
    answered = true;
    show(renderQuestion());
    return;
  }

  if (t.dataset.act === "next") { qi++; answered = false; show(renderQuestion()); return; }

  if (t.dataset.act === "quit-test") {
    try { history.replaceState(null, "", window.location.pathname); } catch (e) {}
    go("home");
    return;
  }

  if (t.dataset.act === "export") { exportData(); return; }
  if (t.dataset.act === "import") { importData(); return; }
  if (t.dataset.act === "reset") {
    if (window.confirm("Effacer toute ta progression ? C'est définitif.")) {
      S = fresh(); persist(); paintStreak(); go("home");
    }
    return;
  }
});

/* ===============================================================
   6. SAUVEGARDE / RESTAURATION
   =============================================================== */
function toolMsg(txt) {
  const el = document.getElementById("toolmsg");
  if (el) el.textContent = txt;
}
function exportData() {
  const json = JSON.stringify(S, null, 2);
  const name = "allemand-progression-" + today() + ".json";

  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename: name, data: json })
      .then(function () { toolMsg("Sauvegarde enregistrée."); })
      .catch(function (err) {
        if (err && err.code === "declined") toolMsg("Sauvegarde annulée.");
        else toolMsg("Sauvegarde impossible ici. Essaie depuis un navigateur classique.");
      });
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
    toolMsg("Sauvegarde enregistrée.");
  } catch (e) { toolMsg("Sauvegarde impossible dans ce navigateur."); }
}
function importData() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.addEventListener("change", function () {
    const f = input.files && input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = function () {
      try {
        const p = JSON.parse(r.result);
        if (typeof p !== "object" || !p.cards) throw new Error("format");
        S = Object.assign(fresh(), p);
        persist(); paintStreak(); go("home");
        toolMsg("Progression restaurée.");
      } catch (e) { toolMsg("Ce fichier n'est pas une sauvegarde valide."); }
    };
    r.readAsText(f);
  });
  input.click();
}

  ok("saisie : ss remplace ß", checkAnswer("Strasse", "Straße").ok);
  ok("saisie : le vrai ä est accepté aussi", checkAnswer("Mädchen", "Mädchen").ok);
  ok("saisie : l'article oublié ne fait pas échouer", checkAnswer("Wort", "das Wort").ok);
  eq("saisie : mais il est rappelé", checkAnswer("Wort", "das Wort").kind, "no-article");
  ok("saisie : un mauvais genre est une erreur", !checkAnswer("der Wort", "das Wort").ok);
  eq("saisie : et il est nommé comme tel", checkAnswer("der Wort", "das Wort").kind, "bad-article");
  ok("saisie : le bon genre passe", checkAnswer("das Wort", "das Wort").ok);
  ok("saisie : un autre mot est une erreur", !checkAnswer("Haus", "das Wort").ok);
  ok("saisie : une réponse vide est une erreur", !checkAnswer("   ", "Hallo").ok);
  eq("saisie : la réponse vide est signalée à part", checkAnswer("", "Hallo").kind, "empty");

  /* Un seul mot dû, monté au niveau 3 : il doit passer en mode écriture. */
  function soloCard(box) {
    S = fresh(); S.day = 1; seed(1);
    const id = Object.keys(S.cards)[0];
    Object.keys(S.cards).forEach(function (k) {
      if (k !== id) S.cards[k].due = shift(today(), 5);
    });
    S.cards[id].box = box;
    return id;
  }

  const wid = soloCard(WRITE_FROM_BOX);
  go("cards");
  eq("saisie : un seul mot est dû", deck.length, 1);
  ok("saisie : le mot connu demande d'écrire", !!view.querySelector("#answer"));
  ok("saisie : plus de bouton « Révéler »", !view.querySelector('[data-act="reveal"]'));
  eq("saisie : c'est le français qui est montré", view.querySelector(".flash .ask").textContent, cardById(wid).f);
  ok("saisie : la réponse allemande n'est pas affichée avant de répondre", !view.querySelector(".flash .sol"));

  document.getElementById("answer").value = cardById(wid).d;
  view.querySelector('[data-act="check-word"]').click();
  ok("saisie : la bonne réponse est acceptée", !!view.querySelector(".why.good"));
  ok("saisie : la solution s'affiche ensuite", !!view.querySelector(".flash .sol"));
  view.querySelector('[data-act="card-next"]').click();
  eq("saisie : le mot monte d'un niveau", S.cards[wid].box, WRITE_FROM_BOX + 1);
  eq("saisie : la réussite est notée au journal", S.cards[wid].hit, 1);

  const wid2 = soloCard(WRITE_FROM_BOX);
  go("cards");
  view.querySelector('[data-act="dunno"]').click();
  ok("saisie : « je ne sais pas » montre la réponse", !!view.querySelector(".flash .sol"));
  ok("saisie : et c'est compté comme raté", !!view.querySelector(".why.bad"));
  view.querySelector('[data-act="card-next"]').click();
  eq("saisie : l'erreur est notée au journal", S.cards[wid2].miss, 1);
  eq("saisie : le mot redescend d'un niveau", S.cards[wid2].box, WRITE_FROM_BOX - 1);

  const wid3 = soloCard(WRITE_FROM_BOX);
  go("cards");
  document.getElementById("answer").value = "totalement faux";
  view.querySelector('[data-act="check-word"]').click();
  ok("saisie : une mauvaise réponse est refusée", !!view.querySelector(".why.bad"));
  ok("saisie : ce qu'on a écrit est rappelé", view.innerHTML.indexOf("Tu as écrit") !== -1);
  view.querySelector('[data-act="card-next"]').click();
  eq("saisie : une mauvaise réponse fait redescendre d'un niveau", S.cards[wid3].box, WRITE_FROM_BOX - 1);

  /* En dessous du seuil, on garde la reconnaissance. */
  const wid4 = soloCard(WRITE_FROM_BOX - 1);
  go("cards");
  ok("saisie : un mot pas encore acquis ne demande pas d'écrire", !view.querySelector("#answer"));
  ok("saisie : il garde le bouton « Révéler »", !!view.querySelector('[data-act="reveal"]'));
  eq("saisie : et c'est l'allemand qui est montré", view.querySelector(".flash .front").textContent, cardById(wid4).d);

  /* --- R. Monter au niveau 3 dans la même séance --- */
  S = fresh(); S.day = 1; seed(1);
  const climbId = Object.keys(S.cards)[0];
  Object.keys(S.cards).forEach(function (k) {
    if (k !== climbId) S.cards[k].due = shift(today(), 5);   // un seul mot en jeu
  });
  go("cards");
  eq("montée : on démarre avec un seul mot, au niveau 1", S.cards[climbId].box, 1);

  /* Trois bonnes réponses d'affilée sans quitter l'écran. */
  let seenWrite = false;
  for (let k = 0; k < 6 && pos < deck.length; k++) {
    if (view.querySelector("#answer")) {
      seenWrite = true;
      document.getElementById("answer").value = cardById(climbId).d;
      view.querySelector('[data-act="check-word"]').click();
      view.querySelector('[data-act="card-next"]').click();
    } else {
      view.querySelector('[data-act="reveal"]').click();
      view.querySelector('[data-grade="1"]').click();
    }
  }
  ok("montée : le mot est repassé dans la séance au lieu de disparaître", seenWrite,
     "niveau atteint : " + S.cards[climbId].box);
  ok("montée : il a dépassé le niveau où l'on écrit", S.cards[climbId].box > WRITE_FROM_BOX,
     "niveau " + S.cards[climbId].box);
  ok("montée : et tout ça le jour même", S.cards[climbId].due > today());

  /* Un mot déjà acquis, lui, ne repasse pas : il sort de la séance. */
  S = fresh(); S.day = 1; seed(1);
  const doneId = Object.keys(S.cards)[0];
  Object.keys(S.cards).forEach(function (k) {
    if (k !== doneId) S.cards[k].due = shift(today(), 5);
  });
  S.cards[doneId].box = WRITE_FROM_BOX;
  go("cards");
  eq("montée : un mot déjà au niveau d'écriture est seul dans le paquet", deck.length, 1);
  document.getElementById("answer").value = cardById(doneId).d;
  view.querySelector('[data-act="check-word"]').click();
  view.querySelector('[data-act="card-next"]').click();
  eq("montée : réussi, il quitte la séance sans repasser", deck.length, 1);
  ok("montée : la séance est terminée", pos >= deck.length);

  /* L'entraînement libre ne fait pas monter, donc ne doit pas boucler. */
  S = fresh(); S.day = 1; seed(1);
  go("practice");
  const beforeTraining = deck.length;
  view.querySelector('[data-act="reveal"]').click();
  view.querySelector('[data-grade="1"]').click();
  eq("entraînement : une bonne réponse ne réinjecte pas le mot", deck.length, beforeTraining);

  /* --- S. L'oral --- */
  ok("traduction : les accents sont ignorés", checkFR("bonjour", "Bonjour").ok);
  ok("traduction : la précision entre parenthèses est facultative",
     checkFR("salut", "salut (en partant)").ok);
  ok("traduction : la forme complète marche aussi",
     checkFR("salut en partant", "salut (en partant)").ok);
  ok("traduction : l'article français est facultatif", checkFR("mot", "le mot").ok);
  ok("traduction : la ponctuation est ignorée", checkFR("bonjour !", "Bonjour").ok);
  ok("traduction : un autre mot est refusé", !checkFR("maison", "le mot").ok);
  ok("traduction : une réponse vide est refusée", !checkFR("   ", "le mot").ok);

  /* Sans voix installée, le mode doit se justifier au lieu d'être muet. */
  const keepVoice = TTS.voice;
  TTS.voice = null;
  S = fresh(); S.day = 1; seed(1);
  go("oral");
  ok("oral : sans voix allemande, l'écran l'explique",
     view.innerHTML.indexOf("voix allemande") !== -1);
  ok("oral : et ne propose pas d'exercice", !view.querySelector("#answer"));

  TTS.voice = { lang: "de-DE", name: "test" };
  S = fresh(); S.day = 1; seed(1);
  go("oral");
  ok("oral : une consigne est donnée", !!view.querySelector(".flash .tip"));
  ok("oral : un champ de saisie est présent", !!view.querySelector("#answer"));
  ok("oral : un bouton permet de réécouter", !!view.querySelector("[data-say]"));
  ok("oral : la phrase est prononcée dès l'affichage", !!view.querySelector("[data-autosay]"));
  ok("oral : AUCUN texte allemand n'est montré avant de répondre",
     !view.querySelector(".flash .sol"));
  ok("oral : ni la traduction", !view.querySelector(".flash .trad"));

  const it0 = oral[0];
  document.getElementById("answer").value = (it0.task === "write") ? it0.de : it0.fr;
  view.querySelector('[data-act="oral-check"]').click();
  ok("oral : la bonne réponse est acceptée, quelle que soit la consigne",
     !!view.querySelector(".why.good"), "consigne : " + it0.task);
  ok("oral : la solution allemande s'affiche ensuite", !!view.querySelector(".flash .sol"));
  ok("oral : la traduction aussi", !!view.querySelector(".flash .trad"));
  view.querySelector('[data-act="oral-next"]').click();
  ok("oral : on passe à la suite", oi === 1);

  S = fresh(); S.day = 1; seed(1);
  go("oral");
  view.querySelector('[data-act="oral-dunno"]').click();
  ok("oral : « je ne sais pas » montre la réponse", !!view.querySelector(".flash .sol"));
  ok("oral : et compte comme raté", !!view.querySelector(".why.bad"));

  /* Le journal est nourri, le calendrier de révision ne bouge pas. */
  S = fresh(); S.day = 1; seed(1);
  go("oral");
  const ov = COURSE[0].vocab[0];
  oral = [{ de: ov.d, fr: ov.f, p: ov.p, id: "1:0", task: "write" }];
  oi = 0; oralVerdict = null;
  show(renderOral());
  const oBox = S.cards["1:0"].box, oDue = S.cards["1:0"].due;
  document.getElementById("answer").value = ov.d;
  view.querySelector('[data-act="oral-check"]').click();
  eq("oral : la réussite est notée au journal", S.cards["1:0"].hit, 1);
  eq("oral : mais le niveau ne bouge pas", S.cards["1:0"].box, oBox);
  eq("oral : ni la date de révision", S.cards["1:0"].due, oDue);

  /* Les phrases de la leçon entrent aussi dans le tirage. */
  ok("oral : les phrases entières sont proposées, pas seulement les mots",
     (function () {
       for (let k = 0; k < 30; k++) {
         if (oralItems(ORAL_SIZE).some(function (x) { return x.id === null; })) return true;
       }
       return false;
     })());
  ok("oral : les deux consignes sortent l'une et l'autre",
     (function () {
       let w = false, t = false;
       for (let k = 0; k < 30; k++) {
         oralItems(ORAL_SIZE).forEach(function (x) {
           if (x.task === "write") w = true;
           if (x.task === "translate") t = true;
         });
       }
       return w && t;
     })());

  TTS.voice = keepVoice;

  /* --- P. Robustesse --- */
  ok("sécurité : le HTML des contenus est échappé", esc("<b>&</b>") === "&lt;b&gt;&amp;&lt;/b&gt;");
  ok("sécurité : les guillemets sont échappés dans les attributs", att('a"b') === "a&quot;b");
  eq("mobile : le double-tap ne déclenche pas le zoom",
     getComputedStyle(document.body).touchAction, "manipulation");
  ok("mobile : le champ de saisie fait au moins 16px, sinon iOS zoome au focus",
     (function () {
       const probe = document.createElement("input");
       probe.className = "answer";
       document.body.appendChild(probe);
       const size = parseFloat(getComputedStyle(probe).fontSize);
       document.body.removeChild(probe);
       return size >= 16;
     })());
  ok("audio : ne plante pas quand aucune voix allemande n'est disponible",
     (function () { try { speak("Guten Tag"); return true; } catch (e) { return false; } })());

  /* --- Restauration de la vraie progression --- */
  try {
    if (backup === null) localStorage.removeItem(KEY);
    else localStorage.setItem(KEY, backup);
  } catch (e) {}
  S = load();
  paintStreak();
  report();
}

function report() {
  const failed = T.filter(function (t) { return !t.p; });
  const rows = T.map(function (t) {
    return '<div class="t-row"><span class="t-tag ' + (t.p ? "ok" : "ko") + '">' + (t.p ? "OK" : "KO") + '</span><span>' +
      esc(t.n) + ((t.p || !t.d) ? "" : '<br><span class="d">' + esc(t.d) + '</span>') +
    '</span></div>';
  }).join("");

  show([
    '<div class="stack">',
      '<div class="card">',
        '<span class="label">Auto-test</span>',
        '<div class="t-sum" style="color:' + (failed.length ? "var(--bad)" : "var(--good)") + '">' +
          (T.length - failed.length) + ' / ' + T.length + '</div>',
        '<p class="msg">' +
          (failed.length ? failed.length + " test(s) en échec." : "Tout passe.") +
          ' La progression enregistrée n\'a pas été modifiée.</p>',
      '</div>',
      '<div class="card">' + rows + '</div>',
      '<button class="btn primary wide" data-act="quit-test">Ouvrir l\'application</button>',
    '</div>'
  ].join(""));
}

/* ---- Démarrage ----
   #test        → lance l'auto-test
   #lesson etc. → ouvre directement un écran (pratique pour tester)
   sinon        → l'accueil                                        */
initTTS();
seed(S.day);
paintStreak();

const entry = (window.location.hash || "").replace("#", "");
if (entry === "test") runTests();
else if (Object.prototype.hasOwnProperty.call(ROUTES, entry)) go(entry);
else go("home");
</script>

</body>
</html>
